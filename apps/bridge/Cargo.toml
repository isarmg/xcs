[package]
name = "xcs-app-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
xcs-client = { path = "../../crates/xcs-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "fs"] }
blake3 = "1.8.7"
xcs-contract = { path = "../../crates/xcs-contract" }
xcs-naming = { path = "../../crates/xcs-naming" }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }

[lints.rust]
unsafe_code = "forbid"
