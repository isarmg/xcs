[package]
name = "zxs-app"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
name = "zxs_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }
zxs-app-bridge = { path = "../bridge" }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
debug = 0
incremental = false

# Locally maintained compatibility/security backports; upstream versions are retained.
[patch.crates-io]
glib = { path = "../../vendor/dependencies/glib-0.18.5" }
glib-macros = { path = "../../vendor/dependencies/glib-macros-0.18.5" }
gtk3-macros = { path = "../../vendor/dependencies/gtk3-macros-0.18.2" }
tauri-plugin-opener = { path = "../../vendor/dependencies/tauri-plugin-opener-2.7.2" }
proc-macro-error2 = { path = "../../vendor/dependencies/proc-macro-error2-2.0.1" }
proc-macro-error-attr2 = { path = "../../vendor/dependencies/proc-macro-error-attr2-2.0.0" }
