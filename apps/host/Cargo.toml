[package]
name = "zxs-app"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
name = "zxs_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }
zxs-app-bridge = { path = "../bridge" }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
debug = 0
incremental = false
