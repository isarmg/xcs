[package]
name = "xcs-server"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = ["core"]
core = ["dep:xcs-core"]

[dependencies]
xcs-auth.workspace = true
axum = { version = "0.8.9", features = ["macros"] }
blake3 = "1.8.7"
bytes = "1"
futures-util = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
thiserror = "2"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace", "limit", "fs"] }
tracing = "0.1"
time = { version = "0.3.55", features = ["formatting"] }
url = "2"
xcs-core = { path = "../xcs-core", optional = true }
xcs-contract = { path = "../xcs-contract" }
xcs-naming = { path = "../xcs-naming" }
xcs-smb = { path = "../../integrations/smb" }
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
