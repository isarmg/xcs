[package]
name = "xcs-web-app"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]
members = ["runtime"]
exclude = ["../vendor/web/xcs-web-core", "../vendor/web/xcs-web-macro"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xcs-web = { path = "runtime" }
xcs-contract = { path = "../crates/xcs-contract" }
xcs-naming = { path = "../crates/xcs-naming" }
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8.7"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
gloo-timers = { version = "0.3", features = ["futures"] }
send_wrapper = "0.6"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "File", "FileList", "Blob", "Crypto", "AbortController", "AbortSignal", "Request", "RequestInit", "RequestMode", "RequestCredentials", "RequestRedirect", "Response", "ReadableStream", "ReadableStreamDefaultReader", "Headers", "Url", "UrlSearchParams", "Storage", "Event", "MouseEvent", "SubmitEvent", "console"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[lints.rust]
unsafe_code = "forbid"
