[package]
name = "contract-check"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"


[dependencies]
blake3 = {version = "1.8.7", path = "../../src/foundation/blake3"}
schema-validation = { version = "=0.58.6", default-features = false, features = ["validator"], path = "../../src/foundation/schema-validation"}
url-encoding = { path = "../../src/foundation/url-encoding", features = ["std"] }
regex = {version = "1", path = "../../src/foundation/regex"}
data-serialization = { version = "1", features = ["derive"], path = "../../src/foundation/data-serialization"}
json-codec = {version = "1", path = "../../src/foundation/json-codec"}
toml = {version = "0.8.23", path = "../../src/foundation/toml"}
walkdir = {version = "2", path = "../../src/foundation/walkdir"}
storage-contract.workspace = true

[[test]]
name = "gitignore"
path = "../../test/tools/contract-check/gitignore.rs"

[[test]]
name = "source_export"
path = "../../test/tools/contract-check/source_export.rs"
