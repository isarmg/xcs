[package]
name = "xcs-contract-check"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[dependencies]
blake3 = "1.8.7"
jsonschema = { version = "=0.58.6", default-features = false }
percent-encoding = "2.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
walkdir = "2"
xcs-contract = { path = "../../crates/xcs-contract" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
