[package]
name = "web-bindings"
version = "0.2.129"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wasm-bindgen/wasm-bindgen"
description = "ZXS Web-only binding generator derived from wasm-bindgen-cli"
autobins = false


[[bin]]
name = "wasm-bindgen"
path = "src/main.rs"

[dependencies]
anyhow = {version = "1", path = "../../src/foundation/anyhow"}
clap = { version = "4", features = ["derive"], path = "../../src/foundation/clap"}
env_logger = {version = "0.11.5", path = "../../src/foundation/env_logger"}
wasm-bindgen-cli-support = {version = "=0.2.129", path = "../../src/foundation/wasm-bindgen-cli-support"}


[lints.rust]
unsafe_code = "forbid"
