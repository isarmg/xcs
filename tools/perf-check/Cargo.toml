[package]
name = "zxs-perf-check"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[dependencies]
zxs-core = { path = "../../crates/zxs-core" }
zxs-platform = { path = "../../crates/zxs-platform" }
serde_json = "1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
tempfile = "3"

[profile.dev]
debug = 0
incremental = false
