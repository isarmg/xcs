[workspace]
resolver = "2"
members = ["crates/xcs-auth", "crates/xcs-contract", "crates/xcs-naming", "crates/xcs-platform", "crates/xcs-core", "crates/xcs-server", "crates/xcs-client", "crates/xcs-cli"]
exclude = ["demos/branch-system", "web", "apps", "integrations/smb", "vendor/web/xcs-web-core", "vendor/web/xcs-web-macro", "vendor/dependencies/unicode-normalization-0.1.24", "tools/web-build", "tools/contract-check", "tools/unicode-build"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
xcs-auth = { path = "crates/xcs-auth" }
xcs-contract = { path = "crates/xcs-contract" }
xcs-naming = { path = "crates/xcs-naming" }
xcs-platform = { path = "crates/xcs-platform" }
xcs-core = { path = "crates/xcs-core" }
xcs-client = { path = "crates/xcs-client" }
xcs-server = { path = "crates/xcs-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "=1.8.7"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
rustix = { version = "1.1.5", features = ["fs", "process", "mount"] }
tempfile = "3"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
