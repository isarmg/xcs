[workspace]
resolver = "2"
members = [
    "src/macros",
    "src/auth",
    "src/client",
    "src/contract",
    "src/admin",
    "src/engine",
    "src/web",
    "src/smb",
    "src/interface",
    "src/platform",
    "src/naming",
    "src/smb-vfs",
    "src/server",
    "tools/unicode-build",
    "tools/contract-check",
    "tools/release-tools",
    "tools/perf-check",
    "tools/web-build",
    "tools/browser-smoke",
    "tools/web-bindings",
    # Explicit regression target, not a default product member.
    "src/foundation/ring",
]
exclude = ["src/foundation"]
default-members = [
    "src/auth",
    "src/contract",
    "src/naming",
    "src/platform",
    "src/engine",
    "src/server",
    "src/client",
    "src/admin",
    "src/smb",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
authentication = { path = "src/auth" }
storage-contract = { path = "src/contract" }
name-policy = { path = "src/naming" }
platform-io = { path = "src/platform" }
storage-engine = { path = "src/engine" }
storage-client = { path = "src/client" }
storage-server = { path = "src/server" }
data-serialization = { version = "1", features = ["derive"], path = "src/foundation/data-serialization"}
json-codec = {version = "1", path = "src/foundation/json-codec"}
error-definition = {version = "2", path = "src/foundation/error-definition"}
blake3 = {version = "=1.8.7", path = "src/foundation/blake3"}
uuid = { version = "1", features = ["v4"], path = "src/foundation/uuid"}
sqlite-access = { version = "=0.9.0", default-features = false, features = ["sqlite-bundled"], path = "src/foundation/sqlite-access"}
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"], path = "src/foundation/tokio"}
rustix = { version = "1.1.5", features = ["fs", "process", "mount"], path = "src/foundation/rustix"}
tempfile = {version = "3", path = "src/foundation/tempfile"}
command-line = { version = "4.6.7", features = ["derive"], path = "src/foundation/command-line"}

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
