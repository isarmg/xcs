# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.56"
name = "serde"
version = "1.0.229"
authors = [
    "Erick Tryzelaar <erick.tryzelaar@gmail.com>",
    "David Tolnay <dtolnay@gmail.com>",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A generic serialization/deserialization framework"
homepage = "https://serde.rs"
documentation = "https://docs.rs/serde"
readme = "../../../docs/upstream/serde-1.0.229/crates-io.md"
keywords = [
    "serde",
    "serialization",
    "no_std",
]
categories = [
    "encoding",
    "no-std",
    "no-std::no-alloc",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/serde-rs/serde"

[features]
alloc = ["serde_core/alloc"]
default = ["std"]
derive = ["serde_derive"]
rc = ["serde_core/rc"]
std = ["serde_core/std"]
unstable = ["serde_core/unstable"]

[lib]
name = "serde"
path = "src/lib.rs"

[dependencies.serde_core]
version = "=1.0.229"
features = ["result"]
default-features = false
path = "../serde_core"

[dependencies.serde_derive]
version = "1"
optional = true
path = "../serde_derive"
