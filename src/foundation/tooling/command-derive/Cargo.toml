# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
rust-version = "1.85"
name = "command-derive"
version = "4.6.7"
build = false
include = [
    "/build.rs",
    "/src/**/*",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE*",
    "/README.md",
    "/examples/**/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Parse command line argument by defining a struct, derive crate."
readme = "../../../../docs/upstream/clap_derive-4.6.7/README.md"
keywords = [
    "command-line",
    "cli",
    "parse",
    "derive",
    "proc_macro",
]
categories = [
    "command-line-interface",
    "development-tools::procedural-macro-helpers",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/clap-rs/clap"
resolver = "2"

[features]
debug = []
default = []
deprecated = []
raw-deprecated = ["deprecated"]

[lib]
name = "command_derive"
path = "src/lib.rs"
bench = false
proc-macro = true


[dependencies.heck]
version = "0.5.0"
path = "../../text-unicode/heck"

[dependencies.proc-macro2]
version = "1.0.106"
path = "../../code-generation/proc-macro2"

[dependencies.quote]
version = "1.0.45"
path = "../../code-generation/quote"

[dependencies.rust-syntax]
version = "3.0.2"
features = ["full"]
path = "../../code-generation/rust-syntax"

[lints.clippy]
assigning_clones = "allow"
blocks_in_conditions = "allow"
bool_assert_comparison = "allow"
branches_sharing_code = "allow"
byte_char_slices = "allow"
checked_conversions = "warn"
collapsible_else_if = "allow"
collapsible_match = "allow"
collection_is_never_read = "warn"
create_dir = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
fn_to_numeric_cast_any = "warn"
if_same_then_else = "allow"
implicit_clone = "warn"
imprecise_flops = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
infinite_loop = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
let_and_return = "allow"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
mem_forget = "warn"
mismatching_type_param_order = "warn"
multiple_bound_locations = "allow"
mutex_integer = "warn"
needless_continue = "allow"
needless_for_each = "warn"
negative_feature_names = "warn"
partial_pub_fields = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
redundant_feature_names = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
result_large_err = "allow"
same_functions_in_if_condition = "warn"
self_named_module_files = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "warn"
string_add = "warn"
string_add_assign = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
uninlined_format_args = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"

[lints.rust]
non_ascii_idents = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rust.rust_2018_idioms]
level = "warn"
priority = -1
