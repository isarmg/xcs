# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.65.0"
name = "cc"
version = "1.8.0"
build = false
exclude = [
    "/.github",
    "src/bin",
    "tests",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
A build-time dependency for Cargo build scripts to assist in invoking the native
C compiler to compile native C code into a static archive to be linked into Rust
code.
"""
homepage = "https://github.com/rust-lang/cc-rs"
documentation = "https://docs.rs/cc"
readme = "../../../../docs/upstream/cc-1.8.0/README.md"
keywords = ["build-dependencies"]
categories = ["development-tools::build-utils"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/cc-rs"

[lib]
name = "cc"
path = "src/lib.rs"

[dependencies.shell-tokenizer]
version = "2.0.1"
path = "../shell-tokenizer"

[lints.clippy]
borrow_as_ptr = "warn"
disallowed_methods = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"

[lints.rust]
missing_docs = "warn"

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
check-cfg = ["cfg(disable_clang_cl_tests)"]

