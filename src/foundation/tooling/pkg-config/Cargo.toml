# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.63"
name = "pkg-config"
version = "0.3.34"
authors = ["Alex Crichton <alex@alexcrichton.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
A library to run the pkg-config system tool at build time in order to be used in
Cargo build scripts.
"""
documentation = "https://docs.rs/pkg-config"
readme = "../../../../docs/upstream/pkg-config-0.3.34/README.md"
keywords = ["build-dependencies"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/pkg-config-rs"

[lib]
name = "pkg_config"
path = "src/lib.rs"

