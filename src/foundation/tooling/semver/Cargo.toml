# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.68"
name = "semver"
version = "1.0.28"
authors = ["David Tolnay <dtolnay@gmail.com>"]
build = false
exclude = ["build.rs"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Parser and evaluator for Cargo's flavor of Semantic Versioning"
documentation = "https://docs.rs/semver"
readme = "../../../../docs/upstream/semver-1.0.28/README.md"
keywords = ["cargo"]
categories = [
    "data-structures",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtolnay/semver"

[features]
default = ["std"]
serialization = ["dep:data-serialization"]
std = []

[lib]
name = "semver"
path = "src/lib.rs"

[dependencies.data-serialization]
version = "1.0.229"
optional = true
default-features = false
path = "../../data-storage/data-serialization"

