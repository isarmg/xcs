# Internal source component. Original manifest and origin: compliance/provenance.

[package]
rust-version = "1.0"
name = "autocfg"
version = "1.5.1"
authors = ["Josh Stone <cuviper@gmail.com>"]
build = false
exclude = ["/.github/**"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Automatic cfg for Rust compiler features"
documentation = "https://docs.rs/autocfg/"
readme = "../../../../docs/upstream/autocfg-1.5.1/README.md"
keywords = [
    "rustc",
    "build",
    "autoconf",
]
categories = ["development-tools::build-utils"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/cuviper/autocfg"

[lib]
name = "autocfg"
path = "src/lib.rs"

