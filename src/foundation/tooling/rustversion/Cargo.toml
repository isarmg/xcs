# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.31"
name = "rustversion"
version = "1.0.23"
authors = ["David Tolnay <dtolnay@gmail.com>"]
build = "build/build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Conditional compilation according to rustc compiler version"
documentation = "https://docs.rs/rustversion"
readme = "../../../../docs/upstream/rustversion-1.0.23/README.md"
categories = [
    "development-tools::build-utils",
    "no-std",
    "no-std::no-alloc",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtolnay/rustversion"

[lib]
name = "rustversion"
path = "src/lib.rs"
proc-macro = true

