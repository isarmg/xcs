# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.63.0"
name = "iterator-toolkit"
version = "0.14.0"
authors = ["bluss"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Extra iterator adaptors, iterator methods, free functions, and macros."
documentation = "https://docs.rs/itertools/"
readme = "../../../docs/upstream/itertools-0.14.0/README.md"
keywords = [
    "iterator",
    "data-structure",
    "zip",
    "product",
]
categories = [
    "algorithms",
    "rust-patterns",
    "no-std",
    "no-std::no-alloc",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-itertools/itertools"

[features]
default = ["use_std"]
use_alloc = []
use_std = ["use_alloc", "either/use_std"]

[lib]
name = "iterator_toolkit"
path = "src/lib.rs"
test = false
bench = false

[dependencies.either]
version = "1.0"
default-features = false
path = "../either"

