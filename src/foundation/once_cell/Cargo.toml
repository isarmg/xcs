# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.65"
name = "once_cell"
version = "1.21.4"
authors = ["Aleksey Kladov <aleksey.kladov@gmail.com>"]
build = false
exclude = [
    "*.png",
    "*.svg",
    "/Cargo.lock.msrv",
    "rustfmt.toml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Single assignment cells and lazy values."
documentation = "https://docs.rs/once_cell"
readme = "../../../docs/upstream/once_cell-1.21.4/README.md"
keywords = [
    "lazy",
    "static",
]
categories = [
    "rust-patterns",
    "memory-management",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/matklad/once_cell"

[features]
alloc = ["race"]
atomic-polyfill = []
default = ["std"]
parking = ["synchronization/parking"]
race = []
std = ["alloc"]
unstable = []

[lib]
name = "once_cell"
path = "src/lib.rs"

[dependencies.synchronization]
path = "../synchronization"
default-features = false
optional = true
features = ["parking"]
