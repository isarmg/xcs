# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
rust-version = "1.85"
name = "const-oid"
version = "0.10.2"
authors = ["RustCrypto Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Const-friendly implementation of the ISO/IEC Object Identifier (OID) standard
as defined in ITU X.660, with support for BER/DER encoding/decoding as well as
heapless no_std (i.e. embedded) support
"""
homepage = "https://github.com/RustCrypto/formats/tree/master/const-oid"
documentation = "https://docs.rs/const-oid"
readme = "../../../../docs/upstream/const-oid-0.10.2/README.md"
keywords = [
    "iso",
    "iec",
    "itu",
    "oid",
]
categories = [
    "cryptography",
    "data-structures",
    "encoding",
    "no-std",
    "parser-implementations",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/RustCrypto/formats"
resolver = "2"

[features]
db = []

[lib]
name = "const_oid"
path = "src/lib.rs"

