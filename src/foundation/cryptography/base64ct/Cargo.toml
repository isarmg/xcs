# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
rust-version = "1.85"
name = "base64ct"
version = "1.8.3"
authors = ["RustCrypto Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Pure Rust implementation of Base64 (RFC 4648) which avoids any usages of
data-dependent branches/LUTs and thereby provides portable "best effort"
constant-time operation and embedded-friendly no_std support
"""
homepage = "https://github.com/RustCrypto/formats/tree/master/base64ct"
documentation = "https://docs.rs/base64ct"
readme = "../../../../docs/upstream/base64ct-1.8.3/README.md"
keywords = [
    "crypto",
    "base64",
    "pem",
    "phc",
]
categories = [
    "cryptography",
    "encoding",
    "no-std",
    "parser-implementations",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/RustCrypto/formats"
resolver = "2"

[features]
alloc = []
std = ["alloc"]

[lib]
name = "base64ct"
path = "src/lib.rs"

