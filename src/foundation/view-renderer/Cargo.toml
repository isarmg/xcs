# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.88"
name = "view-renderer"
version = "0.2.19"
authors = ["Greg Johnston"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Tools for building reactivity-agnostic, renderer-generic, statically-typed view trees for user interface libraries."
readme = "../../../docs/upstream/tachys-0.2.19/README.md"
license = "MIT"
repository = "https://github.com/leptos-rs/leptos"

[features]
delegation = []
shared-value = ["dep:shared-value"]
reactive-state = ["dep:reactive-state", "dep:task-dispatch"]
tracing = ["dep:tracing"]

[lib]
name = "view_renderer"
path = "src/lib.rs"

[dependencies.task-dispatch]
path = "../task-dispatch"
version = "0.3.0"
optional = true


[dependencies.async-trait]
version = "0.1"
default-features = true
path = "../async-trait"

[dependencies.const_str_slice_concat]
path = "../const_str_slice_concat"
version = "0.1"


[dependencies.view-alternatives]
path = "../view-alternatives"
version = "0.1.9"

[dependencies.erased]
version = "0.1"
default-features = true
path = "../erased"

[dependencies.futures]
version = "0.3"
default-features = true
path = "../futures"


[dependencies.indexmap]
version = "2.13"
default-features = true
path = "../indexmap"

[dependencies.iterator-toolkit]
version = "0.14"
default-features = true
path = "../iterator-toolkit"

[dependencies.js-sys]
version = "0.3"
default-features = true
path = "../js-sys"

[dependencies.next_tuple]
path = "../next_tuple"
version = "0.1.0"

[dependencies.shared-value]
path = "../shared-value"
version = "0.2.1"
optional = true

[dependencies.or_poisoned]
path = "../or_poisoned"
version = "0.1.0"

[dependencies.paste]
package = "pastey"
version = "=0.2.3"
default-features = true
path = "../pastey"

[dependencies.reactive-state]
path = "../reactive-state"
version = "0.2.15"
optional = true

[dependencies.rustc-hash]
version = "2.1"
default-features = true
path = "../rustc-hash"

[dependencies.send_wrapper]
version = "0.6"
default-features = true
path = "../send_wrapper"




[dependencies.throw_error]
path = "../throw_error"
version = "0.3.1"

[dependencies.tracing]
version = "0.1"
optional = true
default-features = true
path = "../tracing"

[dependencies.wasm-bindgen]
version = "0.2"
default-features = true
path = "../wasm-bindgen"

[dependencies.web-sys]
version = "0.3"
features = [
    "AddEventListenerOptions",
    "Comment",
    "CssStyleDeclaration",
    "CustomEvent",
    "Document",
    "DocumentFragment",
    "DomStringMap",
    "DomTokenList",
    "Element",
    "Event",
    "FocusEvent",
    "HtmlAnchorElement",
    "HtmlButtonElement",
    "HtmlCollection",
    "HtmlDListElement",
    "HtmlDetailsElement",
    "HtmlDialogElement",
    "HtmlDivElement",
    "HtmlElement",
    "HtmlFieldSetElement",
    "HtmlFormElement",
    "HtmlHeadingElement",
    "HtmlHtmlElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "HtmlLabelElement",
    "HtmlLegendElement",
    "HtmlLiElement",
    "HtmlParagraphElement",
    "HtmlPreElement",
    "HtmlSpanElement",
    "HtmlTableCellElement",
    "HtmlTableElement",
    "HtmlTableRowElement",
    "HtmlTableSectionElement",
    "HtmlTemplateElement",
    "HtmlTimeElement",
    "HtmlTitleElement",
    "HtmlUListElement",
    "KeyboardEvent",
    "MouseEvent",
    "Node",
    "PointerEvent",
    "ShadowRoot",
    "SubmitEvent",
    "SvgElement",
    "Text",
    "Window",
    "console",
]
default-features = true
path = "../web-sys"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(interface_debuginfo)",
    "cfg(erase_components)",
]

# Maintained independently of the enclosing application workspace.
