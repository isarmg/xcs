# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.60.0"
name = "aho-corasick"
version = "1.1.5"
authors = ["Andrew Gallant <jamslam@gmail.com>"]
build = false
exclude = [
    "/aho-corasick-debug",
    "/benchmarks",
    "/tmp",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fast multiple substring searching."
homepage = "https://github.com/BurntSushi/aho-corasick"
readme = "../../../docs/upstream/aho-corasick-1.1.5/README.md"
keywords = [
    "string",
    "search",
    "text",
    "pattern",
    "multi",
]
categories = ["text-processing"]
license = "Unlicense OR MIT"
repository = "https://github.com/BurntSushi/aho-corasick"

[features]
default = ["std", "perf-literal"]
logging = ["dep:log"]
perf-literal = ["dep:memchr"]
std = ["memchr?/std"]

[lib]
name = "aho_corasick"
path = "src/lib.rs"

[dependencies.log]
version = "0.4.17"
optional = true
path = "../log"

[dependencies.memchr]
version = "2.4.0"
optional = true
default-features = false
path = "../memchr"

