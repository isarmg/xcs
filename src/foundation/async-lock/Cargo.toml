# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.85"
name = "async-lock"
version = "3.4.2"
authors = ["Stjepan Glavina <stjepang@gmail.com>"]
build = false
exclude = ["/.*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Async synchronization primitives"
readme = "../../../docs/upstream/async-lock-3.4.2/README.md"
keywords = [
    "lock",
    "mutex",
    "rwlock",
    "semaphore",
    "barrier",
]
categories = [
    "asynchronous",
    "concurrency",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/smol-rs/async-lock"

[features]
default = ["std"]
std = ["event-listener/std", "event-listener-strategy/std"]

[lib]
name = "async_lock"
path = "src/lib.rs"

[dependencies.event-listener]
version = "5.0.0"
default-features = false
path = "../event-listener"

[dependencies.event-listener-strategy]
version = "0.5.0"
default-features = false
path = "../event-listener-strategy"

[dependencies.pin-project-lite]
version = "0.2.11"
path = "../pin-project-lite"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(loom)"]
