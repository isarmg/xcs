# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.85.0"
name = "jsonschema-value"
version = "0.58.6"
authors = ["Dmitry Dygalo <dmitry@dygalo.dev>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "JSON value representations and semantics shared by the jsonschema validator and its bindings"
readme = "../../../docs/upstream/jsonschema-value-0.58.6/README.md"
license = "MIT"
repository = "https://github.com/Stranger6667/jsonschema"
resolver = "3"

[features]
arbitrary-precision = ["serde_json/arbitrary_precision", "dep:num-bigint"]
conformance = []
default = ["serde_json"]
jsonb = ["serde_json"]
jsonb-testkit = ["jsonb"]
macros = []
magnus = []
magnus-tests = ["magnus"]
pyo3 = []
pyo3-tests = ["pyo3"]
serde_json = ["dep:bytecount"]

[lib]
name = "jsonschema_value"
path = "src/lib.rs"

[dependencies.ahash]
version = "0.8"
features = ["serde"]
path = "../ahash"

[dependencies.bytecount]
version = "0.6"
features = ["runtime-dispatch-simd"]
optional = true
path = "../bytecount"

[dependencies.fraction]
version = "0.17"
features = ["with-bigint"]
default-features = false
path = "../fraction"

[dependencies.num-bigint]
version = "0.4"
optional = true
path = "../num-bigint"

[dependencies.num-cmp]
version = "0.1"
path = "../num-cmp"

[dependencies.num-traits]
version = "0.2.19"
path = "../num-traits"

[dependencies.serde_json]
version = "1"
features = ["float_roundtrip"]
path = "../serde_json"

[dependencies.zmij]
version = "1.0.23"
path = "../zmij"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.3.4"
features = ["wasm_js"]
path = "../getrandom-0.3.4"

[lints.clippy]
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
module_name_repetitions = "allow"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
similar_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"

[lints.clippy.pedantic]
level = "warn"
priority = -2

[lints.rust]
unreachable_pub = "warn"
unsafe_code = "warn"
