# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
name = "manyhow"
version = "0.14.1"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "proc macro error handling à la anyhow x proc-macro-error"
documentation = "https://docs.rs/manyhow"
readme = "../../../docs/upstream/manyhow-0.14.1/README.md"
keywords = [
    "proc-macro",
    "error",
    "error-handling",
]
categories = [
    "development-tools::procedural-macro-helpers",
    "rust-patterns",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ModProg/manyhow"

[features]
darling = []
default = ["rust-syntax", "macros"]

[lib]
name = "manyhow"
path = "src/lib.rs"

[dependencies.macros]
version = "0.14.1"
optional = true
package = "manyhow-macros"
path = "../manyhow-macros"

[dependencies.proc-macro2]
version = "1.0.60"
path = "../proc-macro2"

[dependencies.quote]
version = "1"
path = "../quote"

[dependencies.rust-syntax]
version = "3"
features = [
    "printing",
    "parsing",
]
optional = true
default-features = false
path = "../rust-syntax"

