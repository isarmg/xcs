# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.51"
name = "slab"
version = "0.4.12"
authors = ["Carl Lerche <me@carllerche.com>"]
build = false
exclude = ["/.*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pre-allocated storage for a uniform data type"
readme = "../../../docs/upstream/slab-0.4.12/README.md"
keywords = [
    "slab",
    "allocator",
    "no_std",
]
categories = [
    "memory-management",
    "data-structures",
    "no-std",
]
license = "MIT"
repository = "https://github.com/tokio-rs/slab"

[features]
default = ["std"]
std = []

[lib]
name = "slab"
path = "src/lib.rs"

[dependencies.serde]
version = "1.0.95"
features = ["alloc"]
optional = true
default-features = false
path = "../serde"

