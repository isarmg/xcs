# Project synchronization. Original sources and versions: compliance/provenance.
[package]
name = "synchronization"
version = "0.9.12"
edition = "2021"
rust-version = "1.71"
license = "MIT OR Apache-2.0"
build = "build.rs"
autotests = false
autobenches = false
autoexamples = false
[features]
default = ["locks"]
std = []
parking = ["std", "dep:cfg-if", "dep:smallvec", "dep:libc"]
locks = ["parking", "atomic_usize"]
arc_lock = []
atomic_usize = []
serialization = ["dep:data-serialization"]
send_guard = []
hardware-lock-elision = []
nightly = []
[dependencies.scopeguard]
path = "../scopeguard"
default-features = false
[dependencies.data-serialization]
path = "../data-serialization"
optional = true
default-features = false
[dependencies.cfg-if]
path = "../cfg-if"
optional = true
[dependencies.smallvec]
path = "../smallvec"
optional = true
[target.'cfg(unix)'.dependencies.libc]
path = "../libc"
optional = true
