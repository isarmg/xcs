# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2015"
rust-version = "1.71.0"
name = "libloading"
version = "0.8.9"
authors = ["Simonas Kazlauskas <libloading@kazlauskas.me>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Bindings around the platform's dynamic library loading primitives with greatly improved memory safety."
documentation = "https://docs.rs/libloading/"
readme = "../../../../docs/upstream/libloading-0.8.9/README.mkd"
keywords = [
    "dlopen",
    "load",
    "shared",
    "dylib",
]
categories = ["api-bindings"]
license = "ISC"
repository = "https://github.com/nagisa/rust_libloading/"

[lib]
name = "libloading"
path = "src/lib.rs"

[target."cfg(unix)".dependencies.cfg-if]
version = "1"
path = "../../tooling/cfg-if"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(libloading_docs)",
    'cfg(target_os, values("cygwin"))',
]
