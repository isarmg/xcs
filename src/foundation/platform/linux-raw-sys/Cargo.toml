# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.63"
name = "linux-raw-sys"
version = "0.12.1"
authors = ["Dan Gohman <dev@sunfishcode.online>"]
build = false
exclude = [
    "/gen",
    "/.*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Generated bindings for Linux's userspace API"
documentation = "https://docs.rs/linux-raw-sys"
readme = "../../../../docs/upstream/linux-raw-sys-0.12.1/README.md"
keywords = [
    "linux",
    "uapi",
    "ffi",
]
categories = ["external-ffi-bindings"]
license = "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"
repository = "https://github.com/sunfishcode/linux-raw-sys"

[features]
auxvec = []
bootparam = []
btrfs = []
default = ["std", "general", "errno"]
elf = []
elf_uapi = []
errno = []
general = []
if_arp = []
if_ether = []
if_packet = []
if_tun = []
image = []
io_uring = []
ioctl = []
landlock = []
loop_device = []
mempolicy = []
net = []
netlink = []
no_std = []
prctl = []
ptrace = []
rustc-dep-of-std = ["no_std"]
std = []
system = []
vm_sockets = []
xdp = []

[lib]
name = "linux_raw_sys"
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ['cfg(target_arch, values("xtensa"))']
