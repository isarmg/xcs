# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.65"
name = "libc"
version = "0.2.191"
build = "build.rs"
include = [
    "/src",
    "/tests",
    "/examples",
    "/build.rs",
    "/CHANGELOG*",
    "/LICENSE*",
    "/README*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Raw FFI bindings to platform libraries like libc."
readme = "../../../../docs/upstream/libc-0.2.191/README.md"
keywords = [
    "libc",
    "ffi",
    "bindings",
    "operating",
    "system",
]
categories = [
    "external-ffi-bindings",
    "no-std",
    "os",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/libc"

[features]
align = []
const-extern-fn = []
default = ["std"]
extra_traits = []
rustc-dep-of-std = ["align"]
std = []
use_std = ["std"]

[lib]
name = "libc"
path = "src/lib.rs"

[lints.clippy]
explicit_iter_loop = "warn"
identity_op = "allow"
manual_assert = "warn"
map_unwrap_or = "warn"
missing_safety_doc = "allow"
non_minimal_cfg = "allow"
ptr_as_ptr = "warn"
unnecessary_cast = "allow"
unnecessary_semicolon = "warn"

[lints.rust]
unused_qualifications = "allow"
