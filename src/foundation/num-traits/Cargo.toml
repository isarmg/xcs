# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.60"
name = "num-traits"
version = "0.2.19"
authors = ["The Rust Project Developers"]
build = "build.rs"
exclude = [
    "/ci/*",
    "/.github/*",
]
description = "Numeric traits for generic mathematics"
homepage = "https://github.com/rust-num/num-traits"
documentation = "https://docs.rs/num-traits"
readme = "../../../docs/upstream/num-traits-0.2.19/README.md"
keywords = [
    "mathematics",
    "numerics",
]
categories = [
    "algorithms",
    "science",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-num/num-traits"
autotests = false
autobenches = false
autoexamples = false

[build-dependencies.autocfg]
version = "1"
path = "../autocfg"

[features]
default = ["std"]
i128 = []
libm = []
std = []
