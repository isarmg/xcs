# Consolidated source; original identities and licenses remain in compliance/provenance.
[package]
name = "schema-validation"
version = "0.58.6"
edition = "2021"
license = "MIT"
build = false
autotests = false
autobenches = false
[lib]
path = "src/lib.rs"
[features]
default = ["validator"]
value = ["dep:ahash", "dep:bytecount", "dep:fraction", "dep:json-codec", "dep:num-cmp", "dep:numeric", "dep:zmij"]
pattern = ["dep:regex"]
reference = ["dep:ahash", "dep:fluent-uri", "dep:hash-table", "dep:itoa", "dep:json-codec", "dep:micromap", "dep:synchronization", "dep:url-encoding"]
validator = ["dep:ahash", "dep:bytecount", "dep:data-encoding", "dep:data-serialization", "dep:email_address", "dep:fancy-regex", "dep:fraction", "dep:itoa", "dep:json-codec", "dep:num-cmp", "dep:numeric", "dep:regex", "dep:strum", "dep:unicode-general-category", "dep:url-encoding", "dep:uuid-simd", "json-codec", "pattern", "reference", "regex/matcher", "regex/perf", "regex/std", "value"]
json-codec = ["value"]
jsonb-testkit = ["jsonb"]
jsonb = ["json-codec", "value"]
conformance = ["value"]
arbitrary-precision = ["json-codec/arbitrary_precision", "numeric/bigint", "value"]
idna = ["url-encoding/domain", "validator"]
resolve-async = ["reference", "dep:async-trait", "dep:futures", "futures/alloc", "futures/utilities"]

[dependencies.ahash]
version = "0.8"
features = ["serialization"]
path = "../ahash"
optional = true

[dependencies.async-trait]
version = "0.1.86"
optional = true
path = "../async-trait"

[dependencies.bytecount]
version = "0.6"
features = ["runtime-dispatch-simd"]
path = "../bytecount"
optional = true

[dependencies.data-encoding]
version = "2.9"
path = "../data-encoding"
optional = true

[dependencies.email_address]
version = "0.2.9"
path = "../email_address"
optional = true

[dependencies.fancy-regex]
version = "0.19"
path = "../fancy-regex"
optional = true

[dependencies.fraction]
version = "0.17"
features = ["with-bigint"]
default-features = false
path = "../fraction"
optional = true

[dependencies.itoa]
version = "1"
path = "../itoa"
optional = true

[dependencies.num-cmp]
version = "0.1"
path = "../num-cmp"
optional = true

[dependencies.regex]
version = "1.11.1"
path = "../regex"
optional = true
default-features = false
features = ["alloc", "syntax", "unicode"]

[dependencies.data-serialization]
version = "1.0"
features = ["derive"]
path = "../data-serialization"
optional = true

[dependencies.json-codec]
version = "1"
features = ["float_roundtrip"]
path = "../json-codec"
optional = true

[dependencies.strum]
version = "0.28.0"
features = ["derive"]
path = "../strum"
optional = true

[dependencies.unicode-general-category]
version = "1.1"
path = "../unicode-general-category"
optional = true

[dependencies.uuid-simd]
version = "0.8"
features = ["std", "detect"]
default-features = false
path = "../uuid-simd"
optional = true

[dependencies.numeric]
version = "0.2.19"
path = "../numeric"
default-features = false
features = ["std"]
optional = true

[dependencies.url-encoding]
path = "../url-encoding"
default-features = false
features = ["std"]
optional = true

[dependencies.zmij]
version = "1.0.23"
path = "../zmij"
optional = true

[dependencies.fluent-uri]
version = "0.4.1"
features = ["serialization"]
path = "../fluent-uri"
optional = true

[dependencies.futures]
version = "0.3.34"
path = "../futures"
default-features = false
optional = true

[dependencies.hash-table]
version = "0.17"
features = ["equivalent"]
path = "../hash-table"
optional = true

[dependencies.micromap]
version = "0.3.0"
path = "../micromap"
optional = true

[dependencies.synchronization]
path = "../synchronization"
default-features = false
features = ["locks"]
optional = true

[[test]]
name = "canonical"
path = "../../../test/schema-validation/canonical.rs"
required-features = ["validator"]

[[test]]
name = "capabilities"
path = "../../../test/schema-validation/capabilities.rs"
required-features = ["validator", "resolve-async", "jsonb-testkit"]
