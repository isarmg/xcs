# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.85.0"
name = "jsonschema-regex"
version = "0.58.6"
authors = ["Dmitry Dygalo <dmitry@dygalo.dev>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "ECMA 262 regex translation for the jsonschema crate"
readme = false
license = "MIT"
repository = "https://github.com/Stranger6667/jsonschema"
resolver = "3"

[lib]
name = "jsonschema_regex"
path = "src/lib.rs"

[dependencies.regex-syntax]
version = "0.8.9"
path = "../regex-syntax"

[lints.clippy]
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
module_name_repetitions = "allow"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
similar_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"

[lints.clippy.pedantic]
level = "warn"
priority = -2

[lints.rust]
unreachable_pub = "warn"
unsafe_code = "warn"
