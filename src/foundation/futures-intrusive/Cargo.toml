# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "futures-intrusive"
version = "0.5.0"
authors = ["Matthias Einwag <matthias.einwag@live.com>"]
description = """
Futures based on intrusive data structures - for std and no-std environments.
"""
homepage = "https://github.com/Matthias247/futures-intrusive"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Matthias247/futures-intrusive"
autotests = false
autobenches = false
autoexamples = false

[lib]
name = "futures_intrusive"

[dependencies.futures-core]
version = "^0.3"
default-features = false
path = "../futures-core"

[dependencies.lock_api]
version = "0.4.1"
path = "../lock_api"

[dependencies.parking_lot]
version = "0.12.0"
optional = true
path = "../parking_lot"

[features]
alloc = ["futures-core/alloc"]
default = ["std"]
std = ["alloc", "parking_lot"]
