# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "futures-intrusive"
version = "0.5.0"
authors = ["Matthias Einwag <matthias.einwag@live.com>"]
description = """
Futures based on intrusive data structures - for std and no-std environments.
"""
homepage = "https://github.com/Matthias247/futures-intrusive"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Matthias247/futures-intrusive"
autotests = false
autobenches = false
autoexamples = false

[lib]
name = "futures_intrusive"

[dependencies.futures]
version = "0.3.34"
path = "../futures"
default-features = false

[dependencies.synchronization]
path = "../synchronization"
default-features = false
features = ["atomic_usize"]

[features]
alloc = ["futures/alloc"]
default = ["std"]
std = ["alloc", "synchronization/locks"]
