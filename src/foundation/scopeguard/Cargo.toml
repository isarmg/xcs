# Internal source component. Original manifest and origin: compliance/provenance.

[package]
name = "scopeguard"
version = "1.2.0"
authors = ["bluss"]
description = """
A RAII scope guard that will run a given closure when it goes out of scope,
even if the code between panics (assuming unwinding panic).

Defines the macros `defer!`, `defer_on_unwind!`, `defer_on_success!` as
shorthands for guards with one of the implemented strategies.
"""
documentation = "https://docs.rs/scopeguard/"
readme = "../../../docs/upstream/scopeguard-1.2.0/README.md"
keywords = [
    "scope-guard",
    "defer",
    "panic",
    "unwind",
]
categories = [
    "rust-patterns",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bluss/scopeguard"
autotests = false
autobenches = false
autoexamples = false

[features]
default = ["use_std"]
use_std = []
