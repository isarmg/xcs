[package]
name = "concurrent-collections"
version = "0.8.23"
edition = "2021"
build = "build.rs"
autotests = false
autobenches = false
autoexamples = false
license = "MIT OR Apache-2.0"
[lib]
name = "concurrent_collections"
path = "src/lib.rs"
[features]
default = ["std"]
std = ["alloc"]
alloc = []
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(crossbeam_loom)', 'cfg(crossbeam_sanitize)']
