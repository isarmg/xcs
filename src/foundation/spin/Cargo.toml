# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2015"
rust-version = "1.38"
name = "spin"
version = "0.9.9"
authors = [
    "Mathijs van de Nes <git@mathijs.vd-nes.nl>",
    "John Ericson <git@JohnEricson.me>",
    "Joshua Barretto <joshua.s.barretto@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Spin-based synchronization primitives"
readme = "../../../docs/upstream/spin-0.9.9/README.md"
keywords = [
    "spinlock",
    "mutex",
    "rwlock",
]
license = "MIT"
repository = "https://github.com/mvdnes/spin-rs.git"

[features]
barrier = ["mutex"]
default = ["lock_api", "mutex", "spin_mutex", "rwlock", "once", "lazy", "barrier"]
fair_mutex = ["mutex"]
lazy = ["once"]
lock_api = ["dep:synchronization"]
mutex = []
once = []
rwlock = []
spin_mutex = ["mutex"]
std = []
ticket_mutex = ["mutex"]
use_ticket_mutex = ["mutex", "ticket_mutex"]

[lib]
name = "spin"
path = "src/lib.rs"

[dependencies.synchronization]
optional = true
path = "../synchronization"
default-features = false
