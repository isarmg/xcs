# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.64"
name = "tower-http"
version = "0.6.11"
authors = ["Tower Maintainers <team@tower-rs.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Tower middleware and utilities for HTTP clients and servers"
homepage = "https://github.com/tower-rs/tower-http"
readme = "../../../docs/upstream/tower-http-0.6.11/README.md"
keywords = [
    "io",
    "async",
    "futures",
    "service",
    "http",
]
categories = [
    "asynchronous",
    "network-programming",
    "web-programming",
]
license = "MIT"
repository = "https://github.com/tower-rs/tower-http"
resolver = "2"

[features]
add-extension = []
async-compression = []
auth = ["base64", "validate-request"]
catch-panic = ["tracing", "dep:futures", "futures/shared-state", "futures/std", "futures/utilities", "dep:http-body", "http-body/utilities"]
compression-br = ["dep:futures", "dep:http-body", "tokio-util", "dep:tokio"]
compression-deflate = ["dep:futures", "dep:http-body", "tokio-util", "dep:tokio"]
compression-full = ["compression-br", "compression-deflate", "compression-gzip", "compression-zstd"]
compression-gzip = ["dep:futures", "dep:http-body", "tokio-util", "dep:tokio"]
compression-zstd = ["dep:futures", "dep:http-body", "tokio-util", "dep:tokio"]
cors = []
decompression-br = ["dep:futures", "dep:http-body", "http-body/utilities", "tokio-util", "dep:tokio"]
decompression-deflate = ["dep:futures", "dep:http-body", "http-body/utilities", "tokio-util", "dep:tokio"]
decompression-full = ["decompression-br", "decompression-deflate", "decompression-gzip", "decompression-zstd"]
decompression-gzip = ["dep:futures", "dep:http-body", "http-body/utilities", "tokio-util", "dep:tokio"]
decompression-zstd = ["dep:futures", "dep:http-body", "http-body/utilities", "tokio-util", "dep:tokio"]
default = []
follow-redirect = ["dep:futures", "futures/utilities", "dep:http-body", "url-encoding/parser", "url-encoding/std", "service-stack/util"]
fs = ["dep:tokio", "tokio?/fs", "tokio?/io-util", "dep:futures", "futures/utilities", "dep:http-body", "http-body/utilities", "tokio-util/io", "dep:http-range-header", "mime_guess", "mime", "url-encoding/std", "httpdate", "set-status", "futures/alloc"]
full = ["add-extension", "auth", "catch-panic", "compression-full", "cors", "decompression-full", "follow-redirect", "fs", "limit", "map-request-body", "map-response-body", "metrics", "normalize-path", "on-early-drop", "propagate-header", "redirect", "request-id", "sensitive-headers", "set-header", "set-status", "timeout", "trace", "util", "validate-request"]
limit = ["dep:http-body", "http-body/utilities"]
map-request-body = []
map-response-body = []
metrics = ["dep:http-body", "dep:tokio", "tokio?/time"]
normalize-path = []
on-early-drop = ["dep:http-body"]
propagate-header = []
redirect = []
request-id = ["uuid"]
sensitive-headers = []
set-header = []
set-status = []
timeout = ["dep:http-body", "dep:tokio", "tokio?/time"]
tokio = []
trace = ["dep:http-body", "tracing"]
util = []
validate-request = ["mime"]

[lib]
name = "tower_http"
path = "src/lib.rs"

[dependencies.base64]
version = "0.23.1"
optional = true
path = "../base64"
default-features = false
features = ["std"]

[dependencies.flag-set]
version = "2.0.2"
path = "../flag-set"

[dependencies.bytes]
version = "1"
path = "../bytes"

[dependencies.futures]
version = "0.3.34"
path = "../futures"
default-features = false
optional = true

[dependencies.http]
version = "1.0"
path = "../http"

[dependencies.http-body]
version = "1.0.0"
optional = true
path = "../http-body"

[dependencies.http-range-header]
version = "0.4.0"
optional = true
path = "../http-range-header"

[dependencies.httpdate]
version = "1.0"
optional = true
path = "../httpdate"

[dependencies.mime]
version = "0.3.17"
optional = true
default-features = false
path = "../mime"

[dependencies.mime_guess]
version = "2"
optional = true
default-features = false
path = "../mime_guess"

[dependencies.pin-project-lite]
version = "0.2.7"
path = "../pin-project-lite"

[dependencies.tokio]
version = "1.6"
optional = true
default-features = false
path = "../tokio"

[dependencies.tokio-util]
version = "0.7"
features = ["io"]
optional = true
default-features = false
path = "../tokio-util"

[dependencies.tracing]
version = "0.1"
optional = true
default-features = false
path = "../tracing"

[dependencies.uuid]
version = "1.0"
features = ["v4"]
optional = true
path = "../uuid"

[dependencies.service-stack]
version = "0.5.3"
path = "../service-stack"
default-features = false

[dependencies.url-encoding]
path = "../url-encoding"
default-features = false
features = []
optional = true
