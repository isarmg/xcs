# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.64"
name = "tower-http"
version = "0.6.11"
authors = ["Tower Maintainers <team@tower-rs.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Tower middleware and utilities for HTTP clients and servers"
homepage = "https://github.com/tower-rs/tower-http"
readme = "../../../docs/upstream/tower-http-0.6.11/README.md"
keywords = [
    "io",
    "async",
    "futures",
    "service",
    "http",
]
categories = [
    "asynchronous",
    "network-programming",
    "web-programming",
]
license = "MIT"
repository = "https://github.com/tower-rs/tower-http"
resolver = "2"

[features]
add-extension = []
async-compression = []
auth = ["base64", "validate-request"]
catch-panic = ["tracing", "futures-util/std", "dep:http-body", "dep:http-body-util"]
compression-br = ["futures-core", "dep:http-body", "tokio-util", "dep:tokio"]
compression-deflate = ["futures-core", "dep:http-body", "tokio-util", "dep:tokio"]
compression-full = ["compression-br", "compression-deflate", "compression-gzip", "compression-zstd"]
compression-gzip = ["futures-core", "dep:http-body", "tokio-util", "dep:tokio"]
compression-zstd = ["futures-core", "dep:http-body", "tokio-util", "dep:tokio"]
cors = []
decompression-br = ["futures-core", "dep:http-body", "dep:http-body-util", "tokio-util", "dep:tokio"]
decompression-deflate = ["futures-core", "dep:http-body", "dep:http-body-util", "tokio-util", "dep:tokio"]
decompression-full = ["decompression-br", "decompression-deflate", "decompression-gzip", "decompression-zstd"]
decompression-gzip = ["futures-core", "dep:http-body", "dep:http-body-util", "tokio-util", "dep:tokio"]
decompression-zstd = ["futures-core", "dep:http-body", "dep:http-body-util", "tokio-util", "dep:tokio"]
default = []
follow-redirect = ["futures-util", "dep:http-body", "dep:url", "tower/util"]
fs = ["dep:tokio", "tokio?/fs", "tokio?/io-util", "futures-core", "futures-util", "dep:http-body", "dep:http-body-util", "tokio-util/io", "dep:http-range-header", "mime_guess", "mime", "percent-encoding", "httpdate", "set-status", "futures-util/alloc"]
full = ["add-extension", "auth", "catch-panic", "compression-full", "cors", "decompression-full", "follow-redirect", "fs", "limit", "map-request-body", "map-response-body", "metrics", "normalize-path", "on-early-drop", "propagate-header", "redirect", "request-id", "sensitive-headers", "set-header", "set-status", "timeout", "trace", "util", "validate-request"]
limit = ["dep:http-body", "dep:http-body-util"]
map-request-body = []
map-response-body = []
metrics = ["dep:http-body", "dep:tokio", "tokio?/time"]
normalize-path = []
on-early-drop = ["dep:http-body"]
propagate-header = []
redirect = []
request-id = ["uuid"]
sensitive-headers = []
set-header = []
set-status = []
timeout = ["dep:http-body", "dep:tokio", "tokio?/time"]
tokio = []
trace = ["dep:http-body", "tracing"]
util = ["tower"]
validate-request = ["mime"]

[lib]
name = "tower_http"
path = "src/lib.rs"

[dependencies.base64]
version = "0.22"
optional = true
path = "../base64-0.22.1"

[dependencies.bitflags]
version = "2.0.2"
path = "../bitflags-2.13.2"

[dependencies.bytes]
version = "1"
path = "../bytes"

[dependencies.futures-core]
version = "0.3"
optional = true
default-features = false
path = "../futures-core"

[dependencies.futures-util]
version = "0.3.14"
optional = true
default-features = false
path = "../futures-util"

[dependencies.http]
version = "1.0"
path = "../http"

[dependencies.http-body]
version = "1.0.0"
optional = true
path = "../http-body"

[dependencies.http-body-util]
version = "0.1.0"
optional = true
path = "../http-body-util"

[dependencies.http-range-header]
version = "0.4.0"
optional = true
path = "../http-range-header"

[dependencies.httpdate]
version = "1.0"
optional = true
path = "../httpdate"

[dependencies.mime]
version = "0.3.17"
optional = true
default-features = false
path = "../mime"

[dependencies.mime_guess]
version = "2"
optional = true
default-features = false
path = "../mime_guess"

[dependencies.percent-encoding]
version = "2.1.0"
optional = true
path = "../percent-encoding"

[dependencies.pin-project-lite]
version = "0.2.7"
path = "../pin-project-lite"

[dependencies.tokio]
version = "1.6"
optional = true
default-features = false
path = "../tokio"

[dependencies.tokio-util]
version = "0.7"
features = ["io"]
optional = true
default-features = false
path = "../tokio-util"

[dependencies.tower]
version = "0.5"
optional = true
path = "../tower"

[dependencies.tower-layer]
version = "0.3.3"
path = "../tower-layer"

[dependencies.tower-service]
version = "0.3"
path = "../tower-service"

[dependencies.tracing]
version = "0.1"
optional = true
default-features = false
path = "../tracing"

[dependencies.url]
version = "2.5"
optional = true
path = "../url"

[dependencies.uuid]
version = "1.0"
features = ["v4"]
optional = true
path = "../uuid"

