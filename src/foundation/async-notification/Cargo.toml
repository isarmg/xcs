# Unified notification/locking capability. Original identities: compliance/provenance.
[package]
name = "async-notification"
version = "3.4.2"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
autotests = false
autobenches = false
[features]
default = ["std"]
std = ["dep:parking"]
locks = []
[lib]
path = "src/lib.rs"
[dependencies.pin-project-lite]
path = "../pin-project-lite"
[target.'cfg(not(target_family = "wasm"))'.dependencies.parking]
path = "../parking"
optional = true
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(loom)", "cfg(wasm_bindgen_unstable_test_coverage)"]
[[test]]
name = "notification_contract"
path = "../../../test/async-notification/contract.rs"
required-features = ["std", "locks"]
