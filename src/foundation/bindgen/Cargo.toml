# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.70.0"
name = "bindgen"
version = "0.72.1"
authors = [
    "Jyun-Yan You <jyyou.tw@gmail.com>",
    "Emilio Cobos Álvarez <emilio@crisal.io>",
    "Nick Fitzgerald <fitzgen@gmail.com>",
    "The Servo project developers",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Automatically generates Rust FFI bindings to C and C++ libraries."
homepage = "https://rust-lang.github.io/rust-bindgen/"
documentation = "https://docs.rs/bindgen"
readme = "../../../docs/upstream/bindgen-0.72.1/README.md"
keywords = [
    "bindings",
    "ffi",
    "code-generation",
]
categories = [
    "external-ffi-bindings",
    "development-tools::ffi",
]
license = "BSD-3-Clause"
repository = "https://github.com/rust-lang/rust-bindgen"

[features]
__cli = ["dep:clap"]
__testing_only_extra_assertions = []
__testing_only_libclang_16 = []
__testing_only_libclang_9 = []
default = ["logging", "prettyplease", "runtime"]
experimental = []
logging = ["dep:log"]
runtime = ["clang-sys/runtime"]
static = ["clang-sys/static"]

[lib]
name = "bindgen"
path = "lib.rs"

[dependencies.bitflags]
version = "2.2.1"
path = "../bitflags-2.13.2"

[dependencies.cexpr]
version = "0.6"
path = "../cexpr"

[dependencies.clang-sys]
version = "1"
features = ["clang_11_0"]
path = "../clang-sys"

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true
path = "../clap"

[dependencies.itertools]
version = "0.14"
default-features = false
path = "../itertools-0.14.0"

[dependencies.log]
version = "0.4"
optional = true
path = "../log"

[dependencies.prettyplease]
version = "0.2.7"
features = ["verbatim"]
optional = true
path = "../prettyplease-0.2.37"

[dependencies.proc-macro2]
version = "1.0.80"
path = "../proc-macro2"

[dependencies.quote]
version = "1"
default-features = false
path = "../quote"

[dependencies.regex]
version = "1.5.3"
features = [
    "std",
    "unicode-perl",
]
default-features = false
path = "../regex"

[dependencies.rustc-hash]
version = "2.1.0"
path = "../rustc-hash"

[dependencies.shlex]
version = "2"
path = "../shlex-2.0.1"

[dependencies.syn]
version = "2.0"
features = [
    "full",
    "extra-traits",
    "visit-mut",
]
path = "../syn-2.0.119"

[lints.clippy]
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
default_trait_access = "allow"
enum_glob_use = "allow"
ignored_unit_patterns = "allow"
implicit_hasher = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
maybe_infinite_iter = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
redundant_closure_for_method_calls = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust]
unused_qualifications = "warn"
