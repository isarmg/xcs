# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "sha2"
version = "0.10.9"
authors = ["RustCrypto Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Pure Rust implementation of the SHA-2 hash function family
including SHA-224, SHA-256, SHA-384, and SHA-512.
"""
documentation = "https://docs.rs/sha2"
readme = "../../../docs/upstream/sha2-0.10.9/README.md"
keywords = [
    "crypto",
    "sha2",
    "hash",
    "digest",
]
categories = [
    "cryptography",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustCrypto/hashes"

[features]
asm = []
asm-aarch64 = ["asm"]
compress = []
default = ["std"]
force-soft = []
force-soft-compact = []
loongarch64_asm = []
oid = ["digest/oid"]
std = ["digest/std"]

[lib]
name = "sha2"
path = "src/lib.rs"

[dependencies.cfg-if]
version = "1.0"
path = "../cfg-if"

[dependencies.digest]
version = "0.10.7"
path = "../digest-0.10.7"

[target.'cfg(any(target_arch = "aarch64", target_arch = "x86_64", target_arch = "x86"))'.dependencies.cpufeatures]
version = "0.2"
path = "../cpufeatures-0.2.17"

