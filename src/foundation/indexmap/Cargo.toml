# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
rust-version = "1.85"
name = "indexmap"
version = "2.14.2"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A hash table with consistent order and fast iteration."
documentation = "https://docs.rs/indexmap/"
readme = "../../../docs/upstream/indexmap-2.14.2/README.md"
keywords = [
    "hashmap",
    "no_std",
]
categories = [
    "data-structures",
    "no-std",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/indexmap-rs/indexmap"

[features]
default = ["std"]
serialization = ["dep:data-serialization"]
std = []
test_debug = []

[lib]
name = "indexmap"
path = "src/lib.rs"
bench = false

[dependencies.equivalent]
version = "1.0"
default-features = false
path = "../equivalent"

[dependencies.hash-table]
version = "0.17"
default-features = false
path = "../hash-table"

[dependencies.rayon]
version = "1.9"
optional = true
path = "../rayon"

[dependencies.data-serialization]
version = "1.0.229"
optional = true
default-features = false
path = "../data-serialization"

[lints.clippy]
style = "allow"

[lints.rust]
private_bounds = "deny"
private_interfaces = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unsafe_code = "deny"

[lints.rust.rust_2018_idioms]
level = "warn"
priority = -1

