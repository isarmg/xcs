# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.71"
name = "synstructure"
version = "0.14.0"
authors = ["Nika Layzell <nika@thelayzells.com>"]
build = false
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Helper methods and macros for custom derives"
documentation = "https://docs.rs/synstructure"
readme = "../../../docs/upstream/synstructure-0.14.0/README.md"
keywords = [
    "syn",
    "macros",
    "derive",
    "expand_substructure",
    "enum",
]
license = "MIT"
repository = "https://github.com/mystor/synstructure"

[features]
default = ["proc-macro"]
proc-macro = ["proc-macro2/proc-macro", "syn/proc-macro", "quote/proc-macro"]

[lib]
name = "synstructure"
path = "src/lib.rs"

[dependencies.proc-macro2]
version = "1.0.60"
default-features = false
path = "../proc-macro2"

[dependencies.quote]
version = "1"
default-features = false
path = "../quote"

[dependencies.syn]
version = "3"
features = [
    "derive",
    "parsing",
    "printing",
    "clone-impls",
    "visit",
    "extra-traits",
]
default-features = false
path = "../syn-3.0.9"

