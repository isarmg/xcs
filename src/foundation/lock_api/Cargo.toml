# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71.0"
name = "lock_api"
version = "0.4.14"
authors = ["Amanieu d'Antras <amanieu@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Wrappers to create fully-featured Mutex and RwLock types. Compatible with no_std."
readme = false
keywords = [
    "mutex",
    "rwlock",
    "lock",
    "no_std",
]
categories = [
    "concurrency",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Amanieu/parking_lot"

[features]
arc_lock = []
atomic_usize = []
default = ["atomic_usize"]
nightly = []

[lib]
name = "lock_api"
path = "src/lib.rs"

[dependencies.scopeguard]
version = "1.1.0"
default-features = false
path = "../scopeguard"

[dependencies.serde]
version = "1.0.126"
optional = true
default-features = false
path = "../serde"
