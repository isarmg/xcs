# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
rust-version = "1.95"
name = "sysinfo"
version = "0.39.6"
authors = ["Guillaume Gomez <guillaume1.gomez@gmail.com>"]
build = false
exclude = ["/test-unknown"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Library to get system information such as processes, CPUs, disks, components and networks"
readme = "../../../docs/upstream/sysinfo-0.39.6/README.md"
keywords = [
    "system-information",
    "disk",
    "process",
    "network",
    "cpu",
]
license = "MIT"
repository = "https://github.com/GuillaumeGomez/sysinfo"

[features]
apple-app-store = ["apple-sandbox"]
apple-sandbox = []
c-interface = ["default"]
component = []
debug = ["libc/extra_traits"]
default = ["component", "disk", "network", "system", "user"]
disk = []
linux-netdevs = []
linux-tmpfs = []
multithread = ["dep:rayon"]
network = []
serde = ["dep:serde"]
system = ["dep:memchr"]
unknown-ci = []
user = []

[lib]
name = "sysinfo"
path = "src/lib.rs"

[dependencies.memchr]
version = "2.5"
optional = true
path = "../memchr"

[dependencies.rayon]
version = "^1.8"
optional = true
path = "../rayon"

[dependencies.serde]
version = "^1.0.190"
features = ["derive"]
optional = true
path = "../serde"

[target.'cfg(not(any(target_os = "unknown", target_arch = "wasm32")))'.dependencies.libc]
version = "^0.2.173"
path = "../libc"
