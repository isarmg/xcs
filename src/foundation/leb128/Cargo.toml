# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "leb128"
version = "0.2.7"
authors = [
    "Nick Fitzgerald <fitzgen@gmail.com>",
    "Philip Craig <philipjcraig@gmail.com>",
]
build = false
exclude = [
    "/.travis.yml",
    "/.coveralls.yml",
    "/format",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """Read and write DWARF's "Little Endian Base 128" (LEB128) variable length integer encoding."""
documentation = "https://docs.rs/leb128"
readme = "../../../docs/upstream/leb128-0.2.7/README.md"
keywords = [
    "LEB128",
    "DWARF",
    "variable",
    "length",
    "encoding",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gimli-rs/leb128"

[features]
nightly = []

[lib]
name = "leb128"
path = "src/lib.rs"

