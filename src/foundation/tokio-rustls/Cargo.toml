# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "tokio-rustls"
version = "0.26.6"
build = false
exclude = [
    "/.github",
    "/examples",
    "/scripts",
    "/tests/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Asynchronous TLS/SSL streams for Tokio using Rustls."
homepage = "https://github.com/rustls/tokio-rustls"
documentation = "https://docs.rs/tokio-rustls"
readme = "../../../docs/upstream/tokio-rustls-0.26.6/README.md"
categories = [
    "asynchronous",
    "cryptography",
    "network-programming",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustls/tokio-rustls"

[features]
aws-lc-rs = ["aws_lc_rs"]
aws_lc_rs = ["rustls/aws_lc_rs"]
brotli = ["rustls/brotli"]
default = ["logging", "tls12", "aws_lc_rs"]
early-data = []
fips = ["rustls/fips"]
logging = ["rustls/logging"]
ring = ["rustls/ring"]
tls12 = ["rustls/tls12"]
zlib = []

[lib]
name = "tokio_rustls"
path = "src/lib.rs"

[dependencies.rustls]
version = "0.23.27"
features = ["std"]
default-features = false
path = "../rustls"

[dependencies.tokio]
version = "1.0"
path = "../tokio"
