# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.60"
name = "num-rational"
version = "0.4.2"
authors = ["The Rust Project Developers"]
exclude = [
    "/ci/*",
    "/.github/*",
]
description = "Rational numbers implementation for Rust"
homepage = "https://github.com/rust-num/num-rational"
documentation = "https://docs.rs/num-rational"
readme = "../../../docs/upstream/num-rational-0.4.2/README.md"
keywords = [
    "mathematics",
    "numerics",
    "fractions",
]
categories = [
    "algorithms",
    "data-structures",
    "science",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-num/num-rational"
autotests = false
autobenches = false
autoexamples = false

[dependencies.num-bigint]
version = "0.4.0"
optional = true
default-features = false
path = "../num-bigint"

[dependencies.num-integer]
version = "0.1.42"
features = ["i128"]
default-features = false
path = "../num-integer"

[dependencies.num-traits]
version = "0.2.18"
features = ["i128"]
default-features = false
path = "../num-traits"

[dependencies.serde]
version = "1.0.0"
optional = true
default-features = false
path = "../serde"

[features]
default = ["num-bigint", "std"]
num-bigint = ["dep:num-bigint"]
num-bigint-std = ["num-bigint/std"]
serde = ["dep:serde"]
std = ["num-bigint?/std", "num-integer/std", "num-traits/std"]
