# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.60.0"
name = "ahash"
version = "0.8.12"
authors = ["Tom Kaitchuck <Tom.Kaitchuck@gmail.com>"]
build = "build.rs"
exclude = [
    "/smhasher",
    "/benchmark_tools",
]
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A non-cryptographic hash function using AES-NI for high performance"
documentation = "https://docs.rs/ahash"
readme = "../../../docs/upstream/ahash-0.8.12/README.md"
keywords = [
    "hash",
    "hasher",
    "hashmap",
    "aes",
    "no-std",
]
categories = [
    "algorithms",
    "data-structures",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tkaitchuck/ahash"

[lib]
name = "ahash"
path = "src/lib.rs"
test = true
doctest = true
bench = true
doc = true

[dependencies.cfg-if]
version = "1.0"
path = "../cfg-if"

[dependencies.getrandom]
version = "0.4.3"
optional = true
path = "../getrandom-0.4.3"

[dependencies.data-serialization]
version = "1.0.117"
optional = true
path = "../data-serialization"

[dependencies.zerocopy]
version = "0.8.24"
features = ["simd"]
default-features = false
path = "../zerocopy"

[features]
serialization = ["dep:data-serialization"]
default = ["std", "runtime-rng"]
no-rng = []
runtime-rng = ["getrandom"]
std = []

[target.'cfg(not(all(target_arch = "arm", target_os = "none")))'.dependencies.once_cell]
version = "1.18.0"
features = ["alloc"]
default-features = false
path = "../once_cell"
