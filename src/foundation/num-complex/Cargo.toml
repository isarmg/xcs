# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.60"
name = "num-complex"
version = "0.4.6"
authors = ["The Rust Project Developers"]
exclude = [
    "/ci/*",
    "/.github/*",
]
description = "Complex numbers implementation for Rust"
homepage = "https://github.com/rust-num/num-complex"
documentation = "https://docs.rs/num-complex"
readme = "../../../docs/upstream/num-complex-0.4.6/README.md"
keywords = [
    "mathematics",
    "numerics",
]
categories = [
    "algorithms",
    "data-structures",
    "science",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-num/num-complex"
autotests = false
autobenches = false
autoexamples = false

[dependencies.num-traits]
version = "0.2.18"
features = ["i128"]
default-features = false
path = "../num-traits"

[dependencies.data-serialization]
version = "1.0"
optional = true
default-features = false
path = "../data-serialization"

[features]
bytecheck = []
bytemuck = []
default = ["std"]
libm = ["num-traits/libm"]
rand = []
rkyv = []
serialization = ["dep:data-serialization"]
std = ["num-traits/std"]
