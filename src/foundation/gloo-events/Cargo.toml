# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.64"
name = "gloo-events"
version = "0.2.0"
authors = ["Rust and WebAssembly Working Group"]
description = "Convenience crate for working with DOM event listeners"
homepage = "https://github.com/rustwasm/gloo"
readme = "../../../docs/upstream/gloo-events-0.2.0/README.md"
categories = [
    "api-bindings",
    "asynchronous",
    "web-programming",
    "wasm",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustwasm/gloo/tree/master/crates/events"
autotests = false
autobenches = false
autoexamples = false

[dependencies.wasm-bindgen]
version = "0.2"
path = "../wasm-bindgen"

[dependencies.web-sys]
version = "0.3.31"
features = [
    "Event",
    "EventTarget",
    "AddEventListenerOptions",
]
path = "../web-sys"

