# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
name = "quote-use-macros"
version = "0.9.0"
build = false
include = [
    "src/**/*",
    "LICENSE",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Support `use` in procmacros hygienically"
documentation = "https://docs.rs/quote-use"
readme = "../../../docs/upstream/quote-use-macros-0.9.0/README.md"
keywords = ["macro"]
categories = [
    "rust-patterns",
    "development-tools::procedural-macro-helpers",
    "parsing",
]
license = "MIT"
repository = "https://github.com/ModProg/quote-use"

[lib]
name = "quote_use_macros"
path = "src/lib.rs"
proc-macro = true

[dependencies.proc-macro-utils]
version = "0.10"
path = "../proc-macro-utils"

[dependencies.proc-macro2]
version = "1"
path = "../proc-macro2"

[dependencies.quote]
version = "1"
path = "../quote"

[dependencies.rust-syntax]
version = "3"
features = [
    "parsing",
    "extra-traits",
    "clone-impls",
    "printing",
]
default-features = false
path = "../rust-syntax"

