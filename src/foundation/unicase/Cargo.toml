# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "unicase"
version = "2.10.0"
authors = ["Sean McArthur <sean@seanmonstar.com>"]
build = false
exclude = ["scripts/*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A case-insensitive wrapper around strings."
documentation = "https://docs.rs/unicase"
readme = "../../../docs/upstream/unicase-2.10.0/README.md"
keywords = [
    "lowercase",
    "case",
    "case-insensitive",
    "case-folding",
    "no_std",
]
categories = [
    "internationalization",
    "text-processing",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanmonstar/unicase"

[features]
nightly = []

[lib]
name = "unicase"
path = "src/lib.rs"
