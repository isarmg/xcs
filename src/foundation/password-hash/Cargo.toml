# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.60"
name = "password-hash"
version = "0.5.0"
authors = ["RustCrypto Developers"]
description = """
Traits which describe the functionality of password hashing algorithms,
as well as a `no_std`-friendly implementation of the PHC string format
(a well-defined subset of the Modular Crypt Format a.k.a. MCF)
"""
documentation = "https://docs.rs/password-hash"
readme = "../../../docs/upstream/password-hash-0.5.0/README.md"
keywords = [
    "crypt",
    "mcf",
    "password",
    "pbkdf",
    "phc",
]
categories = [
    "authentication",
    "cryptography",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustCrypto/traits/tree/master/password-hash"
autotests = false
autobenches = false
autoexamples = false

[dependencies.base64ct]
version = "1"
path = "../base64ct"

[dependencies.random-generator-core]
version = "0.6.4"
optional = true
default-features = false
path = "../random-generator-core"

[dependencies.subtle]
version = "2"
default-features = false
path = "../subtle"

[features]
alloc = ["base64ct/alloc"]
default = ["random-generator-core"]
getrandom = ["random-generator-core/getrandom"]
std = ["alloc", "base64ct/std", "random-generator-core/std"]
