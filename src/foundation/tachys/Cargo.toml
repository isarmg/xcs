# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.88"
name = "tachys"
version = "0.2.19"
authors = ["Greg Johnston"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Tools for building reactivity-agnostic, renderer-generic, statically-typed view trees for user interface libraries."
readme = "../../../docs/upstream/tachys-0.2.19/README.md"
license = "MIT"
repository = "https://github.com/leptos-rs/leptos"

[features]
default = ["testing"]
delegation = []
error-hook = []
hydrate = []
islands = ["dep:serde", "dep:serde_json"]
mark_branches = []
nightly = ["reactive_graph/nightly"]
oco = ["dep:oco_ref"]
reactive_graph = ["dep:reactive_graph", "dep:any_spawner"]
reactive_stores = ["reactive_graph"]
sledgehammer = []
ssr = []
testing = ["dep:slotmap"]
tracing = ["dep:tracing"]

[lib]
name = "tachys"
path = "src/lib.rs"

[dependencies.any_spawner]
path = "../any_spawner"
version = "0.3.0"
optional = true

[dependencies.async-trait]
version = "0.1"
default-features = true
path = "../async-trait"

[dependencies.const_str_slice_concat]
path = "../const_str_slice_concat"
version = "0.1"


[dependencies.either_of]
path = "../either_of"
version = "0.1.9"

[dependencies.erased]
version = "0.1"
default-features = true
path = "../erased"

[dependencies.futures]
version = "0.3"
default-features = true
path = "../futures"

[dependencies.html-escape]
version = "0.2"
default-features = true
path = "../html-escape"

[dependencies.indexmap]
version = "2.13"
default-features = true
path = "../indexmap"

[dependencies.itertools]
version = "0.14"
default-features = true
path = "../itertools-0.14.0"

[dependencies.js-sys]
version = "0.3"
default-features = true
path = "../js-sys"

[dependencies.next_tuple]
path = "../next_tuple"
version = "0.1.0"

[dependencies.oco_ref]
path = "../oco_ref"
version = "0.2.1"
optional = true

[dependencies.or_poisoned]
path = "../or_poisoned"
version = "0.1.0"

[dependencies.paste]
package = "pastey"
version = "=0.2.3"
default-features = true
path = "../pastey"

[dependencies.reactive_graph]
path = "../reactive_graph"
version = "0.2.15"
optional = true

[dependencies.rustc-hash]
version = "2.1"
default-features = true
path = "../rustc-hash"

[dependencies.send_wrapper]
version = "0.6"
default-features = true
path = "../send_wrapper"

[dependencies.serde]
version = "1.0"
optional = true
default-features = true
path = "../serde"

[dependencies.serde_json]
version = "1.0"
optional = true
default-features = true
path = "../serde_json"

[dependencies.slotmap]
version = "1.1"
optional = true
default-features = true
path = "../slotmap"

[dependencies.throw_error]
path = "../throw_error"
version = "0.3.1"

[dependencies.tracing]
version = "0.1"
optional = true
default-features = true
path = "../tracing"

[dependencies.wasm-bindgen]
version = "0.2"
default-features = true
path = "../wasm-bindgen"

