[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(leptos_debuginfo)",
    "cfg(erase_components)",
    "cfg(rustc_nightly)",
]

# Maintained independently of the enclosing application workspace.
