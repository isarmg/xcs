# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "async-trait"
version = "0.1.92"
authors = ["David Tolnay <dtolnay@gmail.com>"]
build = false
exclude = ["build.rs"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Type erasure for async trait methods"
documentation = "https://docs.rs/async-trait"
readme = "../../../docs/upstream/async-trait-0.1.92/README.md"
keywords = ["async"]
categories = [
    "asynchronous",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtolnay/async-trait"

[lib]
name = "async_trait"
path = "src/lib.rs"
proc-macro = true

[dependencies.proc-macro2]
version = "1.0.74"
path = "../proc-macro2"

[dependencies.quote]
version = "1.0.35"
path = "../quote"

[dependencies.syn]
version = "3"
features = [
    "clone-impls",
    "full",
    "parsing",
    "printing",
    "proc-macro",
    "visit-mut",
]
default-features = false
path = "../syn-3.0.9"

