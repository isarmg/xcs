# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.57"
name = "bytes"
version = "1.12.1"
authors = [
    "Carl Lerche <me@carllerche.com>",
    "Sean McArthur <sean@seanmonstar.com>",
]
build = false
include = [
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "Cargo.toml",
    "src/**/*.rs",
    "tests/**/*.rs",
    "clippy.toml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Types and traits for working with bytes"
readme = "../../../docs/upstream/bytes-1.12.1/README.md"
keywords = [
    "buffers",
    "zero-copy",
    "io",
]
categories = [
    "network-programming",
    "data-structures",
]
license = "MIT"
repository = "https://github.com/tokio-rs/bytes"

[features]
default = ["std"]
std = []

[lib]
name = "bytes"
path = "src/lib.rs"

[dependencies.serde]
version = "1.0.60"
features = ["alloc"]
optional = true
default-features = false
path = "../serde"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(loom)"]
