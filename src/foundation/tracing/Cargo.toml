# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.65.0"
name = "tracing"
version = "0.1.44"
authors = [
    "Eliza Weisman <eliza@buoyant.io>",
    "Tokio Contributors <team@tokio.rs>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Application-level tracing for Rust.
"""
homepage = "https://tokio.rs"
readme = "../../../docs/upstream/tracing-0.1.44/README.md"
keywords = [
    "logging",
    "tracing",
    "metrics",
    "async",
]
categories = [
    "development-tools::debugging",
    "development-tools::profiling",
    "asynchronous",
    "no-std",
]
license = "MIT"
repository = "https://github.com/tokio-rs/tracing"
resolver = "2"

[badges.maintenance]
status = "actively-developed"

[features]
async-await = []
attributes = ["tracing-attributes"]
default = ["std", "attributes"]
log-always = ["log"]
max_level_debug = []
max_level_error = []
max_level_info = []
max_level_off = []
max_level_trace = []
max_level_warn = []
release_max_level_debug = []
release_max_level_error = []
release_max_level_info = []
release_max_level_off = []
release_max_level_trace = []
release_max_level_warn = []
std = ["tracing-core/std"]
valuable = []

[lib]
name = "tracing"
path = "src/lib.rs"

[dependencies.log]
version = "0.4.17"
optional = true
path = "../log"

[dependencies.pin-project-lite]
version = "0.2.9"
path = "../pin-project-lite"

[dependencies.tracing-attributes]
version = "0.1.31"
optional = true
path = "../tracing-attributes"

[dependencies.tracing-core]
version = "0.1.36"
default-features = false
path = "../tracing-core"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(flaky_tests)",
    "cfg(tracing_unstable)",
    "cfg(unsound_local_offset)",
]
