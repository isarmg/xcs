# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.94.0"
name = "sqlx-core"
version = "0.9.0"
authors = [
    "Ryan Leckey <leckey.ryan@gmail.com>",
    "Austin Bonander <austin.bonander@gmail.com>",
    "Chloe Ross <orangesnowfox@gmail.com>",
    "Daniel Akhterov <akhterovd@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Core of SQLx, the rust SQL toolkit. Not intended to be used directly."
readme = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/launchbadge/sqlx"

[features]
json = ["serde", "serde_json"]
offline = ["serde", "either/serde"]

[lib]
name = "sqlx_core"
path = "src/lib.rs"

[dependencies.bit-vec]
version = "0.8"
optional = true
path = "../bit-vec"

[dependencies.crossbeam-queue]
version = "0.3.2"
path = "../crossbeam-queue"

[dependencies.either]
version = "1.6.1"
path = "../either"

[dependencies.event-listener]
version = "5.2.0"
path = "../event-listener"

[dependencies.futures-core]
version = "0.3.32"
default-features = false
path = "../futures-core"

[dependencies.futures-util]
version = "0.3.32"
features = [
    "alloc",
    "sink",
]
default-features = false
path = "../futures-util"

[dependencies.hash-table]
version = "0.17.1"
path = "../hash-table"

[dependencies.hashlink]
version = "0.11.0"
path = "../hashlink"

[dependencies.indexmap]
version = "2.0"
path = "../indexmap"

[dependencies.ipnet]
version = "2.3.0"
optional = true
path = "../ipnet"

[dependencies.log]
version = "0.4.18"
default-features = false
path = "../log"

[dependencies.percent-encoding]
version = "2.3.0"
path = "../percent-encoding"

[dependencies.serde]
version = "1.0.219"
features = [
    "derive",
    "rc",
]
optional = true
path = "../serde"

[dependencies.serde_json]
version = "1.0.142"
features = ["raw_value"]
optional = true
path = "../serde_json"

[dependencies.smallvec]
version = "1.13.1"
path = "../smallvec"

[dependencies.thiserror]
version = "2.0.18"
features = ["std"]
default-features = false
path = "../thiserror"

[dependencies.tokio]
version = "1.25.0"
features = [
    "time",
    "sync",
    "rt",
]
default-features = false
path = "../tokio"

[dependencies.tracing]
version = "0.1.37"
features = ["log"]
path = "../tracing"

[dependencies.url]
version = "2.2.2"
path = "../url"

[dependencies.uuid]
version = "1.12.1"
optional = true
path = "../uuid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
disallowed_methods = "deny"
