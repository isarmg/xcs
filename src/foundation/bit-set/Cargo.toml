# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2015"
name = "bit-set"
version = "0.8.0"
authors = ["Alexis Beingessner <a.beingessner@gmail.com>"]
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A set of bits"
homepage = "https://github.com/contain-rs/bit-set"
documentation = "https://docs.rs/bit-set/"
readme = "../../../docs/upstream/bit-set-0.8.0/README.md"
keywords = [
    "data-structures",
    "bitset",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/contain-rs/bit-set"

[lib]
name = "bit_set"
path = "src/lib.rs"

[dependencies.bit-vec]
version = "0.8.0"
default-features = false
path = "../bit-vec"

[dependencies.data-serialization]
version = "1.0"
features = ["derive"]
optional = true
path = "../data-serialization"

[features]
default = ["std"]
serialization = ["dep:data-serialization", "bit-vec/serialization"]
std = ["bit-vec/std"]
