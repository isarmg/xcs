# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.94.0"
name = "sqlx"
version = "0.9.0"
authors = [
    "Ryan Leckey <leckey.ryan@gmail.com>",
    "Austin Bonander <austin.bonander@gmail.com>",
    "Chloe Ross <orangesnowfox@gmail.com>",
    "Daniel Akhterov <akhterovd@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "🧰 The Rust SQL Toolkit. An async, pure Rust SQL crate featuring compile-time checked queries without a DSL. Supports PostgreSQL, MySQL, and SQLite."
documentation = "https://docs.rs/sqlx"
readme = "../../../docs/upstream/sqlx-0.9.0/README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/launchbadge/sqlx"

[features]
_unstable-all-types = ["json", "ipnet", "uuid", "bit-vec"]
bit-vec = ["sqlx-core/bit-vec"]
ipnet = ["sqlx-core/ipnet"]
json = ["sqlx-core/json", "sqlx-sqlite/json"]
regexp = ["sqlx-sqlite/regexp"]
sqlite = ["sqlite-bundled", "sqlite-deserialize", "sqlite-load-extension", "sqlite-unlock-notify"]
sqlite-bundled = ["sqlx-sqlite/bundled"]
sqlite-deserialize = ["sqlx-sqlite/deserialize"]
sqlite-load-extension = ["sqlx-sqlite/load-extension"]
sqlite-preupdate-hook = ["sqlx-sqlite/preupdate-hook"]
sqlite-unbundled = ["sqlx-sqlite/unbundled"]
sqlite-unlock-notify = ["sqlx-sqlite/unlock-notify"]
uuid = ["sqlx-core/uuid", "sqlx-sqlite/uuid"]

[lib]
name = "sqlx"
path = "src/lib.rs"

[dependencies.sqlx-core]
version = "=0.9.0"
path = "../sqlx-core"

[dependencies.sqlx-sqlite]
version = "=0.9.0"
path = "../sqlx-sqlite"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(mariadb, values(any()))",
    "cfg(postgres, values(any()))",
    "cfg(sqlite_ipaddr)",
    "cfg(sqlite_test_sqlcipher)",
]
