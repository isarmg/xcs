# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.94.0"
name = "sqlx"
version = "0.9.0"
authors = [
    "Ryan Leckey <leckey.ryan@gmail.com>",
    "Austin Bonander <austin.bonander@gmail.com>",
    "Chloe Ross <orangesnowfox@gmail.com>",
    "Daniel Akhterov <akhterovd@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "🧰 The Rust SQL Toolkit. An async, pure Rust SQL crate featuring compile-time checked queries without a DSL. Supports PostgreSQL, MySQL, and SQLite."
documentation = "https://docs.rs/sqlx"
readme = "../../../docs/upstream/sqlx-0.9.0/README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/launchbadge/sqlx"

[features]
_rt-async-global-executor = []
_rt-async-std = []
_rt-smol = []
_rt-tokio = []
_sqlite = []
_unstable-all-types = ["json", "ipnet", "uuid", "bit-vec"]
_unstable-docs = ["all-databases", "_unstable-all-types", "sqlx-sqlite/_unstable-docs"]
all-databases = ["sqlite", "any"]
any = ["sqlx-core/any", "sqlx-sqlite?/any"]
bit-vec = ["sqlx-core/bit-vec"]
default = ["any", "migrate", "json"]
ipnet = ["sqlx-core/ipnet"]
json = ["sqlx-core/json", "sqlx-sqlite?/json"]
migrate = ["sqlx-core/migrate", "sqlx-sqlite?/migrate"]
regexp = ["sqlx-sqlite?/regexp"]
runtime-async-global-executor = ["_rt-async-global-executor", "sqlx-core/_rt-async-global-executor"]
runtime-async-std = ["_rt-async-std", "sqlx-core/_rt-async-std"]
runtime-smol = ["_rt-smol", "sqlx-core/_rt-smol"]
runtime-tokio = ["_rt-tokio", "sqlx-core/_rt-tokio"]
sqlite = ["sqlite-bundled", "sqlite-deserialize", "sqlite-load-extension", "sqlite-unlock-notify"]
sqlite-bundled = ["_sqlite", "sqlx-sqlite/bundled"]
sqlite-deserialize = ["sqlx-sqlite/deserialize"]
sqlite-load-extension = ["sqlx-sqlite/load-extension"]
sqlite-preupdate-hook = ["sqlx-sqlite/preupdate-hook"]
sqlite-unbundled = ["_sqlite", "sqlx-sqlite/unbundled"]
sqlite-unlock-notify = ["sqlx-sqlite/unlock-notify"]
sqlx-toml = ["sqlx-core/sqlx-toml", "sqlx-sqlite?/sqlx-toml"]
tls-native-tls = ["sqlx-core/_tls-native-tls"]
tls-none = []
tls-rustls = ["tls-rustls-ring"]
tls-rustls-aws-lc-rs = ["sqlx-core/_tls-rustls-aws-lc-rs"]
tls-rustls-ring = ["tls-rustls-ring-webpki"]
tls-rustls-ring-native-roots = ["sqlx-core/_tls-rustls-ring-native-roots"]
tls-rustls-ring-webpki = ["sqlx-core/_tls-rustls-ring-webpki"]
uuid = ["sqlx-core/uuid", "sqlx-sqlite?/uuid"]

[lib]
name = "sqlx"
path = "src/lib.rs"

[dependencies.sqlx-core]
version = "=0.9.0"
features = ["migrate"]
path = "../sqlx-core"

[dependencies.sqlx-sqlite]
version = "=0.9.0"
optional = true
path = "../sqlx-sqlite"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(mariadb, values(any()))",
    "cfg(postgres, values(any()))",
    "cfg(sqlite_ipaddr)",
    "cfg(sqlite_test_sqlcipher)",
]
