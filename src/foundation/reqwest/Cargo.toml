# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.64.0"
name = "reqwest"
version = "0.12.28"
authors = ["Sean McArthur <sean@seanmonstar.com>"]
build = false
include = [
    "README.md",
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "src/**/*.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "higher level HTTP client library"
documentation = "https://docs.rs/reqwest"
readme = "../../../docs/upstream/reqwest-0.12.28/README.md"
keywords = [
    "http",
    "request",
    "client",
]
categories = [
    "web-programming::http-client",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanmonstar/reqwest"

[features]
__rustls = ["dep:hyper-rustls", "dep:tokio-rustls", "dep:rustls", "__tls"]
__rustls-ring = ["hyper-rustls?/ring", "tokio-rustls?/ring", "rustls?/ring"]
__tls = ["dep:rustls-pki-types", "tokio/io-util"]
json = ["dep:json-codec"]
rustls-tls = ["rustls-tls-webpki-roots"]
rustls-tls-webpki-roots = ["rustls-tls-webpki-roots-no-provider", "__rustls-ring"]
rustls-tls-webpki-roots-no-provider = ["dep:webpki-roots", "hyper-rustls?/webpki-tokio", "__rustls"]
stream = ["tokio/fs", "dep:futures-util", "dep:tokio-util"]
default = []

[lib]
name = "reqwest"
path = "src/lib.rs"

[dependencies.base64]
version = "0.23.1"
path = "../base64"
default-features = false
features = ["std"]

[dependencies.bytes]
version = "1.2"
path = "../bytes"

[dependencies.futures-core]
version = "0.3.28"
default-features = false
path = "../futures-core"

[dependencies.futures-util]
version = "0.3.28"
optional = true
default-features = false
path = "../futures-util"

[dependencies.http]
version = "1.1"
path = "../http"

[dependencies.data-serialization]
version = "1.0"
path = "../data-serialization"

[dependencies.json-codec]
version = "1.0"
optional = true
path = "../json-codec"

[dependencies.form-codec]
version = "0.7.1"
path = "../form-codec"

[dependencies.sync_wrapper]
version = "1.0"
features = ["futures"]
path = "../sync_wrapper"

[dependencies.url]
version = "2.4"
path = "../url"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.http-body]
version = "1"
path = "../http-body"
features = ["utilities"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.hyper]
version = "1.1"
features = [
    "http1",
    "client",
]
path = "../hyper"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.hyper-rustls]
version = "0.27.0"
features = [
    "http1",
    "tls12",
]
optional = true
default-features = false
path = "../hyper-rustls"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.hyper-util]
version = "0.1.12"
features = [
    "http1",
    "client",
    "client-legacy",
    "client-proxy",
    "tokio",
]
path = "../hyper-util"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.log]
version = "0.4.17"
path = "../log"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.percent-encoding]
version = "2.3"
path = "../percent-encoding"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.pin-project-lite]
version = "0.2.11"
path = "../pin-project-lite"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rustls]
version = "0.23.4"
features = [
    "std",
    "tls12",
]
optional = true
default-features = false
path = "../rustls"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rustls-pki-types]
version = "1.9.0"
features = ["std"]
optional = true
path = "../rustls-pki-types"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
version = "1.0"
features = [
    "net",
    "time",
]
default-features = false
path = "../tokio"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio-rustls]
version = "0.26"
features = ["tls12"]
optional = true
default-features = false
path = "../tokio-rustls"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio-util]
version = "0.7.9"
features = ["io"]
optional = true
default-features = false
path = "../tokio-util"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tower]
version = "0.5.2"
features = [
    "retry",
    "timeout",
    "util",
]
default-features = false
path = "../tower"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tower-http]
version = "0.6.8"
features = ["follow-redirect"]
default-features = false
path = "../tower-http"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tower-service]
version = "0.3"
path = "../tower-service"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.webpki-roots]
version = "1"
optional = true
path = "../webpki-roots"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(reqwest_unstable)"]
