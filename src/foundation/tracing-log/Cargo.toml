# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.56.0"
name = "tracing-log"
version = "0.2.0"
authors = ["Tokio Contributors <team@tokio.rs>"]
description = """
Provides compatibility between `tracing` and the `log` crate.
"""
homepage = "https://tokio.rs"
readme = "../../../docs/upstream/tracing-log-0.2.0/README.md"
keywords = [
    "logging",
    "tracing",
    "log",
]
categories = [
    "development-tools::debugging",
    "asynchronous",
]
license = "MIT"
repository = "https://github.com/tokio-rs/tracing"
autotests = false
autobenches = false
autoexamples = false

[dependencies.log]
version = "0.4.17"
path = "../log"

[dependencies.once_cell]
version = "1.13.0"
path = "../once_cell"

[dependencies.tracing-core]
version = "0.1.28"
path = "../tracing-core"

[features]
default = ["log-tracer", "std"]
interest-cache = []
log-tracer = []
std = ["log/std"]

[badges.maintenance]
status = "actively-maintained"
