# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "getrandom"
version = "0.2.17"
authors = ["The Rand Project Developers"]
build = false
exclude = [".*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A small cross-platform library for retrieving random data from system source"
documentation = "https://docs.rs/getrandom"
readme = "../../../docs/upstream/getrandom-0.2.17/README.md"
categories = [
    "os",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-random/getrandom"

[features]
custom = []
js = ["wasm-bindgen", "js-sys"]
linux_disable_fallback = []
rdrand = []
rustc-dep-of-std = ["libc/rustc-dep-of-std"]
std = []
test-in-browser = []

[lib]
name = "getrandom"
path = "src/lib.rs"

[dependencies.cfg-if]
version = "1"
path = "../cfg-if"

[target.'cfg(all(any(target_arch = "wasm32", target_arch = "wasm64"), target_os = "unknown"))'.dependencies.js-sys]
version = "0.3"
optional = true
path = "../js-sys"

[target.'cfg(all(any(target_arch = "wasm32", target_arch = "wasm64"), target_os = "unknown"))'.dependencies.wasm-bindgen]
version = "0.2.62"
optional = true
default-features = false
path = "../wasm-bindgen"

[target."cfg(unix)".dependencies.libc]
version = "0.2.154"
default-features = false
path = "../libc"
