# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.56.0"
name = "leb128fmt"
version = "0.1.0"
authors = ["Bryant Luk <code@bryantluk.com>"]
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "CHANGELOG.md",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]
description = "A library to encode and decode LEB128 compressed integers."
documentation = "https://docs.rs/leb128fmt"
readme = "../../../../docs/upstream/leb128fmt-0.1.0/README.md"
keywords = [
    "leb128",
    "encoding",
    "no_std",
    "compression",
]
categories = [
    "encoding",
    "no-std",
    "no-std::no-alloc",
    "compression",
    "parser-implementations",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bluk/leb128fmt"
autotests = false
autobenches = false
autoexamples = false

[features]
alloc = []
default = ["std"]
std = []
