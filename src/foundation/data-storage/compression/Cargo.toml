# Maintained functional component. Upstream identities and licenses: compliance/provenance.
[package]
name = "compression"
version = "1.1.10"
edition = "2021"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
build = false
license = "MIT"
description = "DEFLATE codecs, gzip/zlib stream formats, and Adler-32 checksums"

[lib]
path = "src/lib.rs"

[features]
default = []
std = []
alloc = []
codec = []
streams = ["std", "alloc", "codec", "dep:crc32fast"]
simd = []
runtime-detection = ["std", "crc32fast?/std"]
block-boundary = ["codec"]
serialization = ["codec", "alloc", "dep:data-serialization"]

[dependencies.crc32fast]
path = "../crc32fast"
optional = true
default-features = false

[dependencies.data-serialization]
path = "../data-serialization"
optional = true
default-features = false
features = ["derive", "alloc"]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(fuzzing)"]

[[test]]
name = "contracts"
path = "../../../../test/compression/contracts.rs"

[[test]]
name = "empty-read"
path = "../../../../test/foundation/compression/streams/tests/empty-read.rs"
required-features = ["streams"]

[[test]]
name = "early-flush"
path = "../../../../test/foundation/compression/streams/tests/early-flush.rs"
required-features = ["streams"]

[[test]]
name = "gunzip"
path = "../../../../test/foundation/compression/streams/tests/gunzip.rs"
required-features = ["streams"]

[[test]]
name = "zero-write"
path = "../../../../test/foundation/compression/streams/tests/zero-write.rs"
required-features = ["streams"]
