# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "json-codec"
version = "1.0.154"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A JSON serialization file format"
documentation = "https://docs.rs/serde_json"
readme = "../../../../docs/upstream/serde_json-1.0.154/README.md"
keywords = [
    "json",
    "serde",
    "serialization",
]
categories = [
    "encoding",
    "parser-implementations",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/serde-rs/json"

[features]
alloc = ["data-serialization/alloc"]
arbitrary_precision = []
default = ["std"]
float_roundtrip = []
preserve_order = ["indexmap", "alloc", "dep:foldhash"]
raw_value = []
std = ["memchr/std", "data-serialization/std"]
unbounded_depth = []

[lib]
name = "json_codec"
path = "src/lib.rs"

[dependencies.foldhash]
version = "0.2"
optional = true
default-features = false
path = "../../core-types/foldhash"

[dependencies.indexmap]
version = "2.2.3"
optional = true
default-features = false
path = "../../collections/indexmap"

[dependencies.itoa]
version = "1.0"
path = "../../core-types/itoa"

[dependencies.memchr]
version = "2"
default-features = false
path = "../../text-unicode/memchr"

[dependencies.data-serialization]
version = "1.0.229"
default-features = false
path = "../data-serialization"

[dependencies.zmij]
version = "1.0"
path = "../../core-types/zmij"

