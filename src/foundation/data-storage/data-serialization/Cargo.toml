# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.99"
name = "data-serialization"
version = "1.0.229"
authors = [
    "Erick Tryzelaar <erick.tryzelaar@gmail.com>",
    "David Tolnay <dtolnay@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A generic serialization/deserialization framework"
homepage = "https://serde.rs"
documentation = "https://docs.rs/serde"
readme = "../../../../docs/upstream/serde-1.0.229/crates-io.md"
keywords = [
    "serde",
    "serialization",
    "no_std",
]
categories = [
    "encoding",
    "no-std",
    "no-std::no-alloc",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/serde-rs/serde"

[features]
alloc = []
default = ["std"]
derive = ["dep:serialization-derive"]
error-path = ["alloc", "dep:itoa"]
rc = []
std = ["alloc"]

[lib]
name = "data_serialization"
path = "src/lib.rs"

[dependencies.serialization-derive]
version = "=1.0.229"
optional = true
path = "../serialization-derive"

[dependencies.itoa]
version = "1"
optional = true
path = "../../core-types/itoa"
