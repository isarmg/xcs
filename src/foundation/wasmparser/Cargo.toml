# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.82.0"
name = "wasmparser"
version = "0.245.1"
authors = ["Yury Delendik <ydelendik@mozilla.com>"]
build = false
exclude = ["benches/*.wasm"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
A simple event-driven library for parsing WebAssembly binary files.
"""
homepage = "https://github.com/bytecodealliance/wasm-tools/tree/main/crates/wasmparser"
readme = "../../../docs/upstream/wasmparser-0.245.1/README.md"
keywords = [
    "parser",
    "WebAssembly",
    "wasm",
]
license = "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"
repository = "https://github.com/bytecodealliance/wasm-tools/tree/main/crates/wasmparser"

[features]
component-model = ["dep:semver"]
default = ["std", "validate", "serde", "features", "component-model", "hash-collections", "simd"]
features = []
hash-collections = ["dep:hash-table", "dep:indexmap"]
prefer-btree-collections = []
serde = ["dep:serde", "indexmap?/serde", "hash-table?/serde"]
simd = []
std = ["indexmap?/std"]
try-op = []
validate = []

[lib]
name = "wasmparser"
path = "src/lib.rs"

[dependencies.flag-set]
version = "2.4.1"
path = "../flag-set"

[dependencies.hash-table]
version = "0.17.1"
features = ["default-hasher"]
optional = true
default-features = false
path = "../hash-table"

[dependencies.indexmap]
version = "2.13.0"
optional = true
default-features = false
path = "../indexmap"

[dependencies.semver]
version = "1.0.0"
optional = true
default-features = false
path = "../semver"

[dependencies.serde]
version = "1.0.166"
features = ["alloc"]
optional = true
default-features = false
path = "../serde"

[lints.clippy]
clone_on_copy = "warn"
manual_strip = "warn"
map_clone = "warn"
uninlined_format_args = "warn"
unnecessary_cast = "warn"
unnecessary_fallible_conversions = "warn"
unnecessary_mut_passed = "warn"
unnecessary_to_owned = "warn"

[lints.clippy.all]
level = "allow"
priority = -1

[lints.rust]
deprecated-safe-2024 = "warn"
keyword_idents_2024 = "warn"
missing-unsafe-on-extern = "warn"
rust-2024-guarded-string-incompatible-syntax = "warn"
rust-2024-incompatible-pat = "warn"
rust-2024-prelude-collisions = "warn"
unsafe-attr-outside-unsafe = "warn"
unsafe-op-in-unsafe-fn = "warn"
unsafe_code = "deny"
unstable_features = "warn"
unused-lifetimes = "warn"
unused-macro-rules = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(fuzzing)",
    "cfg(debug_check_try_op)",
]
