# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.89.0"
name = "uuid"
version = "1.28.0"
authors = [
    "Ashley Mannix<ashleymannix@live.com.au>",
    "Dylan DPC<dylan.dpc@gmail.com>",
    "Hunar Roop Kahlon<hunar.roop@gmail.com>",
]
build = false
include = [
    "src",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A library to generate and parse UUIDs."
documentation = "https://docs.rs/uuid"
readme = "../../../docs/upstream/uuid-1.28.0/README.md"
keywords = [
    "guid",
    "unique",
    "uuid",
]
categories = [
    "data-structures",
    "no-std",
    "parser-implementations",
    "wasm",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/uuid-rs/uuid"

[badges.is-it-maintained-issue-resolution]
repository = "uuid-rs/uuid"

[badges.is-it-maintained-open-issues]
repository = "uuid-rs/uuid"

[badges.maintenance]
status = "actively-developed"

[features]
atomic = []
borsh = []
default = ["std"]
js = ["dep:wasm-bindgen", "dep:js-sys"]
macro-diagnostics = []
md5 = []
rng = ["dep:getrandom"]
rng-getrandom = ["rng", "dep:getrandom"]
serialization = ["dep:serialization-core"]
sha1 = []
std = ["wasm-bindgen?/std", "js-sys?/std"]
v1 = ["atomic"]
v3 = ["md5"]
v4 = ["rng"]
v5 = ["sha1"]
v6 = ["atomic"]
v7 = ["rng"]
v8 = []

[lib]
name = "uuid"
path = "src/lib.rs"

[dependencies.serialization-core]
version = "1.0.221"
optional = true
default-features = false
path = "../serialization-core"

[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none")))'.dependencies.wasm-bindgen]
version = "0.2"
optional = true
default-features = false
path = "../wasm-bindgen"

[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none"), target_feature = "atomics"))'.dependencies.js-sys]
version = "0.3"
optional = true
default-features = false
path = "../js-sys"

[target.'cfg(not(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none"))))'.dependencies.getrandom]
version = "0.4"
optional = true
path = "../getrandom-0.4.3"

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
check-cfg = ["cfg(uuid_unstable)"]
