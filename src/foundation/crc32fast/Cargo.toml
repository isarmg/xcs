# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.63"
name = "crc32fast"
version = "1.5.2"
authors = [
    "Sam Rijs <srijs@airpost.net>",
    "Alex Crichton <alex@alexcrichton.com>",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fast, SIMD-accelerated CRC32 (IEEE) checksum computation"
readme = "../../../docs/upstream/crc32fast-1.5.2/README.md"
keywords = [
    "hash",
    "crc",
    "crc32",
    "simd",
    "fast",
]
categories = [
    "algorithms",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/srijs/rust-crc32fast"

[features]
default = ["std"]
nightly = []
std = []

[lib]
name = "crc32fast"
path = "src/lib.rs"

[dependencies.cfg-if]
version = "1.0"
path = "../cfg-if"

