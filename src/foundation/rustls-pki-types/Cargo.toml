# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.60"
name = "rustls-pki-types"
version = "1.15.1"
build = false
include = [
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "src/**/*.rs",
    "README.md",
    "src/data/*.der",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Shared types for the rustls PKI ecosystem"
homepage = "https://github.com/rustls/pki-types"
documentation = "https://docs.rs/rustls-pki-types"
readme = "../../../docs/upstream/rustls-pki-types-1.15.1/README.md"
categories = [
    "network-programming",
    "data-structures",
    "cryptography",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustls/pki-types"

[features]
alloc = ["dep:zeroize"]
default = ["alloc"]
std = ["alloc"]

[lib]
name = "rustls_pki_types"
path = "src/lib.rs"

[dependencies.zeroize]
version = "1"
optional = true
path = "../zeroize"

[lints.rust]
elided_lifetimes_in_paths = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(rustls_pki_types_docsrs)"]
