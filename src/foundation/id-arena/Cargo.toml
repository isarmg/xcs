# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
name = "id-arena"
version = "2.3.0"
authors = [
    "Nick Fitzgerald <fitzgen@gmail.com>",
    "Aleksey Kladov <aleksey.kladov@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A simple, id-based arena."
documentation = "https://docs.rs/id-arena"
readme = "../../../docs/upstream/id-arena-2.3.0/README.md"
categories = [
    "memory-management",
    "rust-patterns",
    "no-std",
]
license = "MIT/Apache-2.0"
repository = "https://github.com/fitzgen/id-arena"

[features]
default = ["std"]
std = []

[lib]
name = "id_arena"
path = "src/lib.rs"

[dependencies.rayon]
version = "1.0.3"
optional = true
path = "../rayon"
