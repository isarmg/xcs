# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.63.0"
name = "either"
version = "1.19.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
The enum `Either` with variants `Left` and `Right` is a general purpose sum type with two cases.
"""
documentation = "https://docs.rs/either/1/"
readme = "../../../docs/upstream/either-1.19.0/README.md"
keywords = [
    "data-structure",
    "no_std",
]
categories = [
    "data-structures",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rayon-rs/either"

[features]
default = ["std"]
std = []
use_std = ["std"]

[lib]
name = "either"
path = "src/lib.rs"

[dependencies.serde]
version = "1.0.95"
features = [
    "alloc",
    "derive",
]
optional = true
default-features = false
path = "../serde"

