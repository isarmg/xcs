license = "CDLA-Permissive-2.0"
repository = "https://github.com/rustls/webpki-roots"

[lib]
name = "webpki_roots"
path = "src/lib.rs"

[dependencies.pki-types]
version = "1.8"
default-features = false
package = "rustls-pki-types"
path = "../rustls-pki-types"

