# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "crypto-common"
version = "0.1.7"
authors = ["RustCrypto Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Common cryptographic traits"
documentation = "https://docs.rs/crypto-common"
readme = "../../../docs/upstream/crypto-common-0.1.7/README.md"
keywords = [
    "crypto",
    "traits",
]
categories = [
    "cryptography",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustCrypto/traits"
resolver = "2"

[features]
getrandom = ["random-generator-core/getrandom"]
std = []

[lib]
name = "crypto_common"
path = "src/lib.rs"

[dependencies.generic-array]
version = "=0.14.7"
features = ["more_lengths"]
path = "../generic-array"

[dependencies.random-generator-core]
version = "0.6"
optional = true
path = "../random-generator-core"

[dependencies.typenum]
version = "1.14"
path = "../typenum"
