# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.79"
name = "micromap"
version = "0.3.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The fastest alternative to HashMap, for maps smaller than 20 keys"
homepage = "https://github.com/yegor256/micromap"
readme = "../../../docs/upstream/micromap-0.3.0/README.md"
keywords = [
    "memory",
    "map",
]
categories = [
    "data-structures",
    "memory-management",
]
license = "MIT"
repository = "https://github.com/yegor256/micromap"

[features]
default = []
serde = ["dep:serde"]
std = []

[lib]
name = "micromap"
path = "src/lib.rs"

[dependencies.serde]
version = "1.0.228"
optional = true
default-features = false
path = "../serde"

