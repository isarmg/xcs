# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.81"
name = "wasm-bindgen-futures"
version = "0.4.79"
authors = ["The wasm-bindgen Developers"]
build = false
include = [
    "/LICENSE-*",
    "/src",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Bridging the gap between Rust Futures and JavaScript Promises"
homepage = "https://wasm-bindgen.github.io/wasm-bindgen/"
documentation = "https://docs.rs/wasm-bindgen-futures"
readme = "../../../docs/upstream/wasm-bindgen-futures-0.4.79/README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wasm-bindgen/wasm-bindgen/tree/master/crates/futures"

[features]
default = ["std"]
futures-core-03-stream = ["js-sys/futures-core-03-stream"]
std = ["wasm-bindgen/std", "js-sys/std"]

[lib]
name = "wasm_bindgen_futures"
path = "src/lib.rs"

[dependencies.js-sys]
version = "=0.3.106"
default-features = false
path = "../js-sys"

[dependencies.wasm-bindgen]
version = "=0.2.129"
default-features = false
path = "../wasm-bindgen"

[target.'cfg(all(target_os = "emscripten", wasm_bindgen_unstable_tokio))'.dependencies.tokio]
version = "1"
features = [
    "rt",
    "time",
]
default-features = false
path = "../tokio"

[lints.clippy]
large_enum_variant = "allow"
new_without_default = "allow"
overly_complex_bool_expr = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
uninlined_format_args = "warn"

[lints.rust]
unused_lifetimes = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(wasm_bindgen_unstable_test_coverage)",
    "cfg(wasm_bindgen_use_js_sys)",
    "cfg(xxx_debug_only_print_generated_code)",
    "cfg(legacy_eh)",
    "cfg(tokio_unstable)",
    "cfg(wasm_bindgen_unstable_tokio)",
    "cfg(wasm_bindgen_unstable_jspi)",
]
