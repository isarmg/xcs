# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "serde_derive"
version = "1.0.229"
authors = [
    "Erick Tryzelaar <erick.tryzelaar@gmail.com>",
    "David Tolnay <dtolnay@gmail.com>",
]
build = false
exclude = ["build.rs"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Macros 1.1 implementation of #[derive(Serialize, Deserialize)]"
homepage = "https://serde.rs"
documentation = "https://serde.rs/derive.html"
readme = "../../../docs/upstream/serde_derive-1.0.229/crates-io.md"
keywords = [
    "serde",
    "serialization",
    "no_std",
    "derive",
]
categories = [
    "no-std",
    "no-std::no-alloc",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/serde-rs/serde"

[features]
default = []
deserialize_in_place = []

[lib]
name = "serde_derive"
path = "src/lib.rs"
proc-macro = true

[dependencies.proc-macro2]
version = "1.0.74"
features = ["proc-macro"]
default-features = false
path = "../proc-macro2"

[dependencies.quote]
version = "1.0.35"
features = ["proc-macro"]
default-features = false
path = "../quote"

[dependencies.syn]
version = "3"
features = [
    "clone-impls",
    "derive",
    "parsing",
    "printing",
    "proc-macro",
]
default-features = false
path = "../syn-3.0.9"

