# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "proc-macro2-diagnostics"
version = "0.11.0"
authors = ["Sergio Benitez <sb@sergio.bz>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Diagnostics for proc-macro2."
documentation = "https://docs.rs/proc-macro2-diagnostics"
readme = "../../../docs/upstream/proc-macro2-diagnostics-0.11.0/README.md"
license = "MIT/Apache-2.0"
repository = "https://github.com/SergioBenitez/proc-macro2-diagnostics"
resolver = "2"

[features]
nightly = ["dep:version_check"]

[lib]
name = "proc_macro2_diagnostics"
path = "src/lib.rs"

[dependencies.proc-macro2]
version = "1.0"
path = "../proc-macro2"

[dependencies.quote]
version = "1.0"
path = "../quote"

[dependencies.syn]
version = "3"
features = [
    "parsing",
    "printing",
]
default-features = false
path = "../syn-3.0.9"

[build-dependencies.version_check]
version = "0.9.4"
optional = true
path = "../version_check"
