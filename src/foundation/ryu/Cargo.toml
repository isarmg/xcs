# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "ryu"
version = "1.0.23"
authors = ["David Tolnay <dtolnay@gmail.com>"]
build = false
exclude = [
    "build.rs",
    "*.png",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fast floating point to string conversion"
documentation = "https://docs.rs/ryu"
readme = "../../../docs/upstream/ryu-1.0.23/README.md"
keywords = ["float"]
categories = [
    "value-formatting",
    "no-std",
    "no-std::no-alloc",
]
license = "Apache-2.0 OR BSL-1.0"
repository = "https://github.com/dtolnay/ryu"

[features]
small = []

[lib]
name = "ryu"
path = "src/lib.rs"

