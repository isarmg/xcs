# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "digest"
version = "0.10.7"
authors = ["RustCrypto Developers"]
description = "Traits for cryptographic hash functions and message authentication codes"
documentation = "https://docs.rs/digest"
readme = "../../../docs/upstream/digest-0.10.7/README.md"
keywords = [
    "digest",
    "crypto",
    "hash",
]
categories = [
    "cryptography",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustCrypto/traits"
autotests = false
autobenches = false
autoexamples = false

[dependencies.block-buffer]
version = "0.10"
optional = true
path = "../block-buffer-0.10.4"

[dependencies.crypto-common]
version = "0.1.3"
path = "../crypto-common-0.1.7"

[dependencies.subtle]
version = "2.4"
optional = true
default-features = false
path = "../subtle"

[features]
alloc = []
core-api = ["block-buffer"]
default = ["core-api"]
dev = []
mac = ["subtle"]
oid = []
rand_core = ["crypto-common/rand_core"]
std = ["alloc", "crypto-common/std"]
