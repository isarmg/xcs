# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
rust-version = "1.88.0"
name = "date-time"
version = "0.3.55"
authors = [
    "Jacob Pratt <open-source@jhpratt.dev>",
    "Time contributors",
]
build = false
include = [
    "{src,tests,benchmarks}/**/*",
    "LICENSE-*",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Date and time library. Fully interoperable with the standard library. Mostly compatible with #![no_std]."
homepage = "https://time-rs.github.io"
readme = "../../../../docs/upstream/time-0.3.55/README.md"
keywords = [
    "date",
    "time",
    "calendar",
    "duration",
]
categories = [
    "date-and-time",
    "no-std",
    "parser-implementations",
    "value-formatting",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/time-rs/time"

[features]
alloc = ["data-serialization?/alloc"]
default = ["std"]
formatting = ["std"]
large-dates = []
parsing = []
serialization = ["dep:data-serialization"]
serialization-human-readable = ["serialization", "formatting", "parsing"]
serialization-well-known = ["serialization", "formatting", "parsing"]
std = ["alloc"]
wasm-bindgen = ["dep:js-sys"]

[lib]
name = "date_time"
path = "src/lib.rs"
bench = false




[dependencies.data-serialization]
version = "1.0.229"
optional = true
default-features = false
path = "../../data-storage/data-serialization"


[target.'cfg(all(target_family = "wasm", not(any(target_os = "emscripten", target_os = "wasi"))))'.dependencies.js-sys]
version = "0.3.58"
optional = true
path = "../../web-runtime/js-sys"


[lints.clippy]
alloc_instead_of_core = "deny"
as_underscore = "warn"
dbg_macro = "warn"
decimal_literal_representation = "warn"
explicit_auto_deref = "warn"
get_unwrap = "warn"
manual_let_else = "warn"
missing_docs_in_private_items = "warn"
missing_enforced_import_renames = "warn"
missing_panics_doc = "warn"
obfuscated_if_else = "warn"
print_stdout = "warn"
semicolon_outside_block = "warn"
std_instead_of_core = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
use_debug = "warn"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.incompatible_msrv]
level = "allow"
priority = 1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.option_if_let_else]
level = "allow"
priority = 1

[lints.clippy.redundant_pub_crate]
level = "allow"
priority = 1

[lints.clippy.uninhabited_references]
level = "allow"
priority = 1

[lints.rust]
ambiguous_glob_reexports = "deny"
clashing_extern_declarations = "deny"
const_item_mutation = "deny"
dangling_pointers_from_temporaries = "deny"
deref_nullptr = "deny"
drop_bounds = "deny"
future_incompatible = "deny"
hidden_glob_reexports = "deny"
improper_ctypes = "deny"
improper_ctypes_definitions = "deny"
invalid_from_utf8 = "deny"
invalid_macro_export_arguments = "deny"
invalid_nan_comparisons = "deny"
invalid_reference_casting = "deny"
invalid_value = "deny"
keyword_idents = "warn"
let_underscore = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_abi = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
named_arguments_used_positionally = "deny"
non_ascii_idents = "deny"
noop_method_call = "warn"
opaque_hidden_inferred_bound = "deny"
overlapping_range_endpoints = "deny"
single_use_lifetimes = "warn"
suspicious_double_ref_op = "deny"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unconditional_recursion = "deny"
unnameable_test_items = "deny"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
unstable_syntax_pre_expansion = "deny"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[lints.rust.unexpected_cfgs]
level = "deny"
priority = 0
check-cfg = [
    "cfg(__ui_tests)",
    "cfg(bench)",
]

[lints.rust.unstable_name_collisions]
level = "allow"
priority = 1

[lints.rust.unused]
level = "warn"
priority = -1

[lints.rustdoc]
private_doc_tests = "warn"
unescaped_backticks = "warn"
