# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
name = "quote-use"
version = "0.9.0"
build = false
include = [
    "src/**/*",
    "LICENSE",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Support `use` in procmacros hygienically"
documentation = "https://docs.rs/quote-use"
readme = "../../../docs/upstream/quote-use-0.9.0/README.md"
keywords = ["macro"]
categories = [
    "rust-patterns",
    "development-tools::procedural-macro-helpers",
    "parsing",
]
license = "MIT"
repository = "https://github.com/ModProg/quote-use"

[features]

[lib]
name = "quote_use"
path = "src/lib.rs"

[dependencies.quote]
version = "1"
path = "../quote"

[dependencies.quote-use-macros]
version = "0.9.0"
path = "../quote-use-macros"

[dependencies.syn]
version = "3"
features = [
    "parsing",
    "printing",
]
optional = true
default-features = false
path = "../syn-3.0.9"

