# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "matchers"
version = "0.2.0"
authors = ["Eliza Weisman <eliza@buoyant.io>"]
description = """
Regex matching on character and byte streams.
"""
homepage = "https://github.com/hawkw/matchers"
documentation = "https://docs.rs/matchers/"
readme = "../../../docs/upstream/matchers-0.2.0/README.md"
keywords = [
    "regex",
    "match",
    "pattern",
    "streaming",
]
categories = ["text-processing"]
license = "MIT"
repository = "https://github.com/hawkw/matchers"
autotests = false
autobenches = false
autoexamples = false


[features]
unicode = ["regex/unicode"]

[badges.maintenance]
status = "experimental"

[dependencies.regex]
version = "1.13.1"
path = "../regex"
default-features = false
features = ["automata", "dfa-build", "dfa-search", "syntax"]
