# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.56"
name = "serde_core"
version = "1.0.229"
authors = [
    "Erick Tryzelaar <erick.tryzelaar@gmail.com>",
    "David Tolnay <dtolnay@gmail.com>",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Serde traits only, with no support for derive -- use the `serde` crate instead"
homepage = "https://serde.rs"
documentation = "https://docs.rs/serde_core"
readme = "../../../docs/upstream/serde_core-1.0.229/README.md"
keywords = [
    "serde",
    "serialization",
    "no_std",
]
categories = [
    "encoding",
    "no-std",
    "no-std::no-alloc",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/serde-rs/serde"

[features]
alloc = []
default = ["std", "result"]
rc = []
result = []
std = []
unstable = []

[lib]
name = "serde_core"
path = "src/lib.rs"

