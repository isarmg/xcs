# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
name = "task-dispatch"
version = "0.3.0"
authors = ["Greg Johnston"]
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Spawn asynchronous tasks in an executor-independent way."
readme = "../../../docs/upstream/any_spawner-0.3.0/README.md"
license = "MIT"
repository = "https://github.com/leptos-rs/leptos"

[lib]
name = "task_dispatch"
path = "src/lib.rs"

[dependencies.futures]
version = "0.3.34"
path = "../futures"
default-features = false
features = ["channel", "std"]

[dependencies.error-definition]
version = "2.0.12"
path = "../error-definition"

[dependencies.tokio]
version = "1.41"
features = ["rt"]
optional = true
default-features = false
path = "../tokio"

[dependencies.js-sys]
version = "=0.3.106"
optional = true
default-features = false
features = ["std"]
path = "../js-sys"

[features]
futures-executor = ["futures/thread-pool"]
tokio = ["dep:tokio"]
wasm-bindgen = ["dep:js-sys"]

# Maintained independently of the enclosing application workspace.
