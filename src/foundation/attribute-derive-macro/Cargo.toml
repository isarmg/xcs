# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
name = "attribute-derive-macro"
version = "0.11.0"
build = false
include = [
    "src/**/*",
    "LICENSE",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "CommandLine for proc macro attributes"
documentation = "https://docs.rs/attribute-derive"
readme = "../../../docs/upstream/attribute-derive-macro-0.11.0/README.md"
keywords = [
    "derive",
    "macro",
]
categories = [
    "rust-patterns",
    "development-tools::procedural-macro-helpers",
    "parsing",
]
license = "MIT"
repository = "https://github.com/ModProg/attribute-derive"

[lib]
name = "attribute_derive_macro"
path = "src/lib.rs"
proc-macro = true


[dependencies.interpolator]
version = "0.5.0"
features = ["iter"]
path = "../interpolator"

[dependencies.manyhow]
version = "0.14"
path = "../manyhow"

[dependencies.proc-macro-utils]
version = "0.10.0"
path = "../proc-macro-utils"

[dependencies.proc-macro2]
version = "1"
path = "../proc-macro2"

[dependencies.quote]
version = "1"
path = "../quote"

[dependencies.quote-use]
version = "0.9"
path = "../quote-use"

[dependencies.rust-syntax]
version = "3"
path = "../rust-syntax"
