# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.58.0"
name = "slotmap"
version = "1.1.1"
authors = ["Orson Peters <orsonpeters@gmail.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Slotmap data structure"
readme = "../../../docs/upstream/slotmap-1.1.1/README.md"
keywords = [
    "slotmap",
    "storage",
    "allocator",
    "arena",
    "reference",
]
categories = [
    "data-structures",
    "memory-management",
    "caching",
]
license = "Zlib"
repository = "https://github.com/orlp/slotmap"

[features]
default = ["std"]
std = []
unstable = []

[lib]
name = "slotmap"
path = "src/lib.rs"

[dependencies.serde]
version = "1.0"
features = [
    "derive",
    "alloc",
]
optional = true
default-features = false
path = "../serde"

[build-dependencies.version_check]
version = "0.9"
path = "../version_check"
