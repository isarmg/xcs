# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71.0"
name = "base64"
version = "0.23.1"
authors = ["Marshall Pierce <marshall@mpierce.org>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "encodes and decodes base64 as bytes or utf8"
documentation = "https://docs.rs/base64"
readme = "../../../docs/upstream/base64-0.23.1/README.md"
keywords = [
    "base64",
    "utf8",
    "encode",
    "decode",
    "no_std",
]
categories = ["encoding"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/marshallpierce/rust-base64"

[features]
alloc = []
default = ["std", "simd-unsafe"]
simd-unsafe = []
std = ["alloc"]

[lib]
name = "base64"
path = "src/lib.rs"

