# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.57"
name = "derive-where"
version = "1.7.0"
build = false
include = [
    "src/**/*",
    "Cargo.toml",
    "LICENSE-*",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Deriving with custom trait bounds"
documentation = "https://docs.rs/derive-where"
readme = "../../../docs/upstream/derive-where-1.7.0/README.md"
keywords = [
    "derive",
    "macro",
]
categories = [
    "rust-patterns",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ModProg/derive-where"

[features]
nightly = []
safe = []
serialization = []
zeroize = []
zeroize-on-drop = ["zeroize"]

[lib]
name = "derive_where"
path = "src/lib.rs"
proc-macro = true

[dependencies.proc-macro2]
version = "1"
features = ["proc-macro"]
default-features = false
path = "../proc-macro2"

[dependencies.quote]
version = "1"
default-features = false
path = "../quote"

[dependencies.rust-syntax]
version = "3"
features = [
    "clone-impls",
    "derive",
    "extra-traits",
    "full",
    "parsing",
    "printing",
]
default-features = false
path = "../rust-syntax"

