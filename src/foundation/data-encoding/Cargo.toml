# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.48"
name = "data-encoding"
version = "2.11.1"
build = false
include = [
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "src/lib.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Efficient and customizable data-encoding functions like base64, base32, and hex"
documentation = "https://docs.rs/data-encoding"
readme = "../../../docs/upstream/data-encoding-2.11.1/README.md"
keywords = [
    "no_std",
    "base64",
    "base32",
    "hex",
]
categories = [
    "encoding",
    "no-std",
]
license = "MIT"
repository = "https://github.com/ia0/data-encoding"

[features]
alloc = []
default = ["std"]
std = ["alloc"]

[lib]
name = "data_encoding"
path = "src/lib.rs"

[lints.clippy]
undocumented-unsafe-blocks = "warn"

[lints.rust]
elided-lifetimes-in-paths = "warn"
let-underscore-drop = "warn"
missing-debug-implementations = "warn"
missing-docs = "warn"
unreachable-pub = "warn"
unsafe-op-in-unsafe-fn = "warn"
unused-results = "warn"
