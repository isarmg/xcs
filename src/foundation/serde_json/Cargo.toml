# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "serde_json"
version = "1.0.154"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A JSON serialization file format"
documentation = "https://docs.rs/serde_json"
readme = "../../../docs/upstream/serde_json-1.0.154/README.md"
keywords = [
    "json",
    "serde",
    "serialization",
]
categories = [
    "encoding",
    "parser-implementations",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/serde-rs/json"

[features]
alloc = ["serde_core/alloc"]
arbitrary_precision = []
default = ["std"]
float_roundtrip = []
preserve_order = ["indexmap", "alloc", "dep:foldhash"]
raw_value = []
std = ["memchr/std", "serde_core/std"]
unbounded_depth = []

[lib]
name = "serde_json"
path = "src/lib.rs"

[dependencies.foldhash]
version = "0.2"
optional = true
default-features = false
path = "../foldhash"

[dependencies.indexmap]
version = "2.2.3"
optional = true
default-features = false
path = "../indexmap"

[dependencies.itoa]
version = "1.0"
path = "../itoa"

[dependencies.memchr]
version = "2"
default-features = false
path = "../memchr"

[dependencies.serde_core]
version = "1.0.220"
default-features = false
path = "../serde_core"

[dependencies.zmij]
version = "1.0"
path = "../zmij"

