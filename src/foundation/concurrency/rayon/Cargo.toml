# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.80"
name = "rayon"
version = "1.12.0"
build = false
exclude = [
    "/ci/*",
    "/.github/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Simple work-stealing parallelism for Rust"
documentation = "https://docs.rs/rayon/"
readme = "../../../../docs/upstream/rayon-1.12.0/README.md"
keywords = [
    "parallel",
    "thread",
    "concurrency",
    "join",
    "performance",
]
categories = ["concurrency"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rayon-rs/rayon"

[features]
web_spin_lock = ["rayon-core/web_spin_lock"]

[lib]
name = "rayon"
path = "src/lib.rs"

[dependencies.either]
version = "1"
default-features = false
path = "../../core-types/either"

[dependencies.rayon-core]
version = "1.13.0"
path = "../rayon-core"

