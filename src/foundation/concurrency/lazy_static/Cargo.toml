# Internal source component. Original manifest and origin: compliance/provenance.

[package]
name = "lazy_static"
version = "1.5.1"
authors = ["Marvin Löbel <loebel.marvin@gmail.com>"]
build = false
exclude = [".github"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A macro for declaring lazily evaluated statics in Rust."
documentation = "https://docs.rs/lazy_static"
readme = "../../../../docs/upstream/lazy_static-1.5.1/README.md"
keywords = [
    "macro",
    "lazy",
    "static",
]
categories = [
    "no-std",
    "rust-patterns",
    "memory-management",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang-nursery/lazy-static.rs"

[features]
spin_no_std = ["spin"]

[lib]
name = "lazy_static"
path = "src/lib.rs"

[dependencies.spin]
version = "0.9.8"
features = ["once"]
optional = true
default-features = false
path = "../spin"

