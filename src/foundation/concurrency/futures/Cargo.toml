# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.71"
name = "futures"
version = "0.3.34"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
An implementation of futures and streams featuring zero allocations,
composability, and iterator-like interfaces.
"""
homepage = "https://rust-lang.github.io/futures-rs"
readme = "../../../../docs/upstream/futures-0.3.34/README.md"
keywords = [
    "futures",
    "async",
    "future",
]
categories = ["asynchronous"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/futures-rs"

[features]
default = ["std", "utilities", "sink", "channel", "io", "async-await-macro", "executor", "shared-state"]
alloc = []
std = ["alloc", "slab?/std"]
utilities = ["dep:pin-project-lite"]
shared-state = ["std", "utilities", "dep:slab"]
sink = []
channel = ["alloc"]
io = ["std", "utilities", "dep:memchr"]
async-await = ["utilities"]
async-await-macro = ["async-await", "dep:futures-macro"]
executor = ["std", "utilities"]
thread-pool = ["executor"]
bilock = ["utilities"]
unstable = []
write-all-vectored = ["io"]

[lib]
name = "futures"
path = "src/lib.rs"

[dependencies.futures-macro]
version = "=0.3.34"
optional = true
default-features = false
path = "../futures-macro"

[dependencies.memchr]
version = "2.2"
optional = true
path = "../../text-unicode/memchr"

[dependencies.pin-project-lite]
version = "0.2.6"
optional = true
path = "../pin-project-lite"

[dependencies.slab]
version = "0.4.7"
optional = true
default-features = false
path = "../../collections/slab"

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unreachable_pub = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(futures_sanitizer)"]
