# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "flume"
version = "0.12.0"
authors = ["Joshua Barretto <joshua.s.barretto@gmail.com>"]
build = false
exclude = [
    "/.github",
    "/misc",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A blazingly fast multi-producer channel"
documentation = "https://docs.rs/flume"
readme = "../../../../docs/upstream/flume-0.12.0/README.md"
keywords = [
    "mpsc",
    "fifo",
    "channel",
    "thread",
    "mpmc",
]
categories = [
    "concurrency",
    "data-structures",
]
license = "Apache-2.0/MIT"
repository = "https://github.com/zesterer/flume"

[features]
async = ["dep:futures"]
default = ["async", "select", "eventual-fairness"]
eventual-fairness = ["select", "fastrand"]
select = []
spin = []

[lib]
name = "flume"
path = "src/lib.rs"

[dependencies.fastrand]
version = "2.3"
features = [
    "std",
    "js",
]
optional = true
path = "../../core-types/fastrand"

[dependencies.futures]
version = "0.3.34"
path = "../futures"
default-features = false
optional = true

[dependencies.spin1]
version = "0.9.8"
features = ["mutex"]
package = "spin"
path = "../spin"

