# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.80"
name = "rayon-core"
version = "1.13.0"
build = "build.rs"
links = "rayon-core"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Core APIs for Rayon"
documentation = "https://docs.rs/rayon-core/"
readme = "../../../docs/upstream/rayon-core-1.13.0/README.md"
keywords = [
    "parallel",
    "thread",
    "concurrency",
    "join",
    "performance",
]
categories = ["concurrency"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rayon-rs/rayon"

[features]
web_spin_lock = []

[lib]
name = "rayon_core"
path = "src/lib.rs"

[dependencies.crossbeam-deque]
version = "0.8.1"
path = "../crossbeam-deque"

[dependencies.crossbeam-utils]
version = "0.8.0"
path = "../crossbeam-utils"

