# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.70"
name = "socket2"
version = "0.6.5"
authors = [
    "Alex Crichton <alex@alexcrichton.com>",
    "Thomas de Zeeuw <thomasdezeeuw@gmail.com>",
]
build = false
include = [
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "src/**/*.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Utilities for handling networking sockets with a maximal amount of configuration
possible intended.
"""
homepage = "https://github.com/rust-lang/socket2"
documentation = "https://docs.rs/socket2"
readme = "../../../docs/upstream/socket2-0.6.5/README.md"
keywords = [
    "io",
    "socket",
    "network",
]
categories = [
    "api-bindings",
    "network-programming",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/socket2"

[features]
all = []

[lib]
name = "socket2"
path = "src/lib.rs"

[target.'cfg(any(unix, target_os = "wasi"))'.dependencies.libc]
version = "0.2.172"
path = "../libc"
