# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.81"
name = "wasm-binding-macros"
version = "0.2.129"
authors = ["The wasm-bindgen Developers"]
build = false
include = [
    "/LICENSE-*",
    "/src",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Definition of the `#[wasm_bindgen]` attribute, an internal dependency
"""
homepage = "https://wasm-bindgen.github.io/wasm-bindgen/"
documentation = "https://docs.rs/wasm-bindgen"
readme = "../../../docs/upstream/wasm-bindgen-macro-0.2.129/README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wasm-bindgen/wasm-bindgen/tree/master/crates/macro"

[features]
strict-macro = []
extra-traits = []

[lib]
name = "wasm_binding_macros"
path = "src/lib.rs"
proc-macro = true

[dependencies.bumpalo]
version = "3.0.0"
path = "../bumpalo"

[dependencies.proc-macro2]
version = "1.0"
path = "../proc-macro2"

[dependencies.quote]
version = "1.0"
path = "../quote"

[dependencies.rust-syntax]
version = "3.0"
features = [
    "visit",
    "visit-mut",
    "full",
    "extra-traits",
]
path = "../rust-syntax"

[dependencies.wasm-bindgen-shared]
version = "=0.2.129"
path = "../wasm-bindgen-shared"

[lints.clippy]
large_enum_variant = "allow"
new_without_default = "allow"
overly_complex_bool_expr = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
uninlined_format_args = "warn"

[lints.rust]
unused_lifetimes = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(wasm_bindgen_unstable_test_coverage)",
    "cfg(xxx_debug_only_print_generated_code)",
    "cfg(legacy_eh)",
    "cfg(tokio_unstable)",
    "cfg(wasm_bindgen_unstable_tokio)",
    "cfg(wasm_bindgen_unstable_jspi)",
]
