# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
name = "adler2"
version = "2.0.1"
authors = [
    "Jonas Schievink <jonasschievink@gmail.com>",
    "oyvindln <oyvindln@users.noreply.github.com>",
]
build = false
exclude = [".*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A simple clean-room implementation of the Adler-32 checksum"
documentation = "https://docs.rs/adler2/"
readme = "../../../docs/upstream/adler2-2.0.1/README.md"
keywords = [
    "checksum",
    "integrity",
    "hash",
    "adler32",
    "zlib",
]
categories = ["algorithms"]
license = "0BSD OR MIT OR Apache-2.0"
repository = "https://github.com/oyvindln/adler2"

[features]
default = ["std"]
rustc-dep-of-std = []
std = []

[lib]
name = "adler2"
path = "src/lib.rs"

