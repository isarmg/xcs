# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2015"
name = "bit-vec"
version = "0.8.0"
authors = ["Alexis Beingessner <a.beingessner@gmail.com>"]
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A vector of bits"
homepage = "https://github.com/contain-rs/bit-vec"
documentation = "https://docs.rs/bit-vec/"
readme = "../../../docs/upstream/bit-vec-0.8.0/README.md"
keywords = [
    "data-structures",
    "bitvec",
    "bitmask",
    "bitmap",
    "bit",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/contain-rs/bit-vec"

[lib]
name = "bit_vec"
path = "src/lib.rs"

[dependencies.data-serialization]
version = "1.0"
features = ["derive"]
optional = true
default-features = false
path = "../data-serialization"

[features]
serialization = ["dep:data-serialization"]
borsh_std = []
default = ["std"]
serialization_no_std = ["data-serialization/alloc"]
serialization_std = ["std", "data-serialization/std"]
std = []
