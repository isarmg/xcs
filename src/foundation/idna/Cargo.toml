# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.57"
name = "idna"
version = "1.1.0"
authors = ["The rust-url developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "IDNA (Internationalizing Domain Names in Applications) and Punycode."
readme = "../../../docs/upstream/idna-1.1.0/README.md"
keywords = [
    "no-std",
    "web",
    "http",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/servo/rust-url/"

[features]
alloc = []
compiled_data = ["idna_adapter/compiled_data"]
default = ["std", "compiled_data"]
std = ["alloc"]

[lib]
name = "idna"
path = "src/lib.rs"
doctest = false

[dependencies.idna_adapter]
version = "1"
path = "../idna_adapter"

[dependencies.smallvec]
version = "1.13.1"
features = ["const_generics"]
path = "../smallvec"

[dependencies.utf8_iter]
version = "1.0.4"
path = "../utf8_iter"

