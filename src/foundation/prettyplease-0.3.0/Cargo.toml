# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "prettyplease"
version = "0.3.0"
authors = ["David Tolnay <dtolnay@gmail.com>"]
build = "build.rs"
links = "prettyplease03"
exclude = ["cargo-expand"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A minimal `syn` syntax tree pretty-printer"
documentation = "https://docs.rs/prettyplease"
readme = "../../../docs/upstream/prettyplease-0.3.0/README.md"
keywords = ["rustfmt"]
categories = ["development-tools"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtolnay/prettyplease"

[features]
verbatim = ["syn/parsing"]

[lib]
name = "prettyplease"
path = "src/lib.rs"

[dependencies.proc-macro2]
version = "1.0.80"
default-features = false
path = "../proc-macro2"

[dependencies.syn]
version = "3"
features = ["full"]
default-features = false
path = "../syn-3.0.9"

