# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
name = "typed-builder-macro"
version = "0.23.2"
authors = [
    "IdanArye <idanarye@gmail.com>",
    "Chris Morgan <me@chrismorgan.info>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Compile-time type-checked builder derive"
documentation = "https://idanarye.github.io/rust-typed-builder/"
readme = "../../../docs/upstream/typed-builder-macro-0.23.2/README.md"
keywords = ["builder"]
categories = ["rust-patterns"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/idanarye/rust-typed-builder"

[lib]
name = "typed_builder_macro"
path = "src/lib.rs"
proc-macro = true

[dependencies.proc-macro2]
version = "1"
path = "../proc-macro2"

[dependencies.quote]
version = "1"
path = "../quote"

[dependencies.syn]
version = "3"
features = [
    "full",
    "extra-traits",
]
path = "../syn-3.0.9"
