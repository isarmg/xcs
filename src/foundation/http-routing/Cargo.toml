# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.80"
name = "http-routing"
version = "0.8.9"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "HTTP routing and request handling library that focuses on ergonomics and modularity"
homepage = "https://github.com/tokio-rs/axum"
readme = "../../../docs/upstream/axum-0.8.9/README.md"
keywords = [
    "http",
    "web",
    "routing",
]
categories = [
    "asynchronous",
    "network-programming",
    "web-programming::http-server",
]
license = "MIT"
repository = "https://github.com/tokio-rs/axum"

[features]
serialization = ["dep:data-serialization"]
__private = ["tokio", "http1", "dep:reqwest"]
__private_docs = ["service-stack/full", "dep:data-serialization", "dep:tower-http"]
default = ["form", "http1", "json", "matched-path", "original-uri", "query", "tokio", "tower-log", "tracing"]
form = ["dep:form_urlencoded", "dep:form-codec", "dep:serialization-error-path"]
http1 = ["dep:hyper", "hyper?/http1", "hyper-util?/http1"]
http2 = ["dep:hyper", "hyper?/http2", "hyper-util?/http2"]
json = ["dep:json-codec", "dep:serialization-error-path"]
macros = ["dep:axum-macros"]
matched-path = []
multipart = []
original-uri = []
query = ["dep:form_urlencoded", "dep:form-codec", "dep:serialization-error-path"]
tokio = ["dep:hyper-util", "dep:tokio", "tokio/net", "tokio/rt", "service-stack/make", "tokio/macros"]
tower-log = ["service-stack/log"]
tracing = ["dep:tracing"]
ws = ["dep:hyper", "tokio", "dep:base64"]

[lib]
name = "http_routing"
path = "src/lib.rs"


[dependencies.axum-macros]
version = "0.5.1"
optional = true
path = "../axum-macros"

[dependencies.base64]
version = "0.23.1"
optional = true
path = "../base64"
default-features = false
features = ["std"]

[dependencies.bytes]
version = "1.0"
path = "../bytes"

[dependencies.form_urlencoded]
version = "1.1.0"
optional = true
path = "../form_urlencoded"

[dependencies.futures]
version = "0.3.34"
path = "../futures"
default-features = false
features = ["alloc", "utilities"]

[dependencies.http]
version = "1.0.0"
path = "../http"

[dependencies.http-body]
version = "1.0.0"
path = "../http-body"
features = ["utilities"]

[dependencies.hyper]
version = "1.1.0"
optional = true
path = "../hyper"

[dependencies.hyper-util]
version = "0.1.3"
features = [
    "tokio",
    "server",
    "service",
]
optional = true
path = "../hyper-util"

[dependencies.itoa]
version = "1.0.5"
path = "../itoa"

[dependencies.matchit]
version = "=0.8.4"
path = "../matchit"

[dependencies.memchr]
version = "2.4.1"
path = "../memchr"

[dependencies.mime]
version = "0.3.16"
path = "../mime"

[dependencies.percent-encoding]
version = "2.1"
path = "../percent-encoding"

[dependencies.pin-project-lite]
version = "0.2.7"
path = "../pin-project-lite"

[dependencies.reqwest]
version = "0.12"
features = [
    "json",
    "stream",
]
optional = true
default-features = false
path = "../reqwest"

[dependencies.data-serialization]
version = "1.0.211"
optional = true
path = "../data-serialization"

[dependencies.serialization-core]
version = "1.0.221"
path = "../serialization-core"

[dependencies.json-codec]
version = "1.0"
features = ["raw_value"]
optional = true
path = "../json-codec"

[dependencies.serialization-error-path]
version = "0.1.8"
optional = true
path = "../serialization-error-path"

[dependencies.form-codec]
version = "0.7"
optional = true
path = "../form-codec"

[dependencies.sync_wrapper]
version = "1.0.0"
path = "../sync_wrapper"

[dependencies.tokio]
version = "1.44"
features = ["time"]
optional = true
package = "tokio"
path = "../tokio"

[dependencies.tower-http]
version = "0.6.8"
features = [
    "add-extension",
    "auth",
    "catch-panic",
    "compression-br",
    "compression-deflate",
    "compression-gzip",
    "cors",
    "decompression-br",
    "decompression-deflate",
    "decompression-gzip",
    "follow-redirect",
    "fs",
    "limit",
    "map-request-body",
    "map-response-body",
    "metrics",
    "normalize-path",
    "propagate-header",
    "redirect",
    "request-id",
    "sensitive-headers",
    "set-header",
    "set-status",
    "timeout",
    "trace",
    "util",
    "validate-request",
]
optional = true
path = "../tower-http"

[dependencies.tracing]
version = "0.1"
optional = true
default-features = false
path = "../tracing"

[lints.clippy]
await_holding_lock = "warn"
dbg_macro = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
filter_map_next = "warn"
fn_params_excessive_bools = "warn"
if_let_mutex = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
must_use_candidate = "warn"
needless_borrow = "warn"
needless_continue = "warn"
option_option = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_self_not_must_use = "warn"
str_to_string = "warn"
suboptimal_flops = "warn"
todo = "warn"
type_complexity = "allow"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
verbose_file_reads = "warn"

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.rust.rust_2018_idioms]
level = "warn"
priority = -1
[dependencies.service-stack]
version = "0.5.3"
path = "../service-stack"
default-features = false
features = ["util"]
