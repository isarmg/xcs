# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "proc-macro2"
version = "1.0.107"
authors = [
    "David Tolnay <dtolnay@gmail.com>",
    "Alex Crichton <alex@alexcrichton.com>",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A substitute implementation of the compiler's `proc_macro` API to decouple token-based libraries from the procedural macro use case."
documentation = "https://docs.rs/proc-macro2"
readme = "../../../../docs/upstream/proc-macro2-1.0.107/README.md"
keywords = [
    "macros",
    "rust-syntax",
]
categories = ["development-tools::procedural-macro-helpers"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtolnay/proc-macro2"

[features]
default = ["proc-macro"]
nightly = []
proc-macro = []
span-locations = []

[lib]
name = "proc_macro2"
path = "src/lib.rs"

[dependencies.unicode-ident]
version = "1.0"
path = "../../text-unicode/unicode-ident"

