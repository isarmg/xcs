# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "strum_macros"
version = "0.28.0"
authors = ["Peter Glotfelty <peter.glotfelty@microsoft.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Helpful macros for working with enums and strings"
homepage = "https://github.com/Peternator7/strum"
documentation = "https://docs.rs/strum"
readme = "../../../../docs/upstream/strum_macros-0.28.0/README.md"
keywords = [
    "enum",
    "string",
    "macros",
    "proc-macros",
]
categories = [
    "development-tools::procedural-macro-helpers",
    "parsing",
]
license = "MIT"
repository = "https://github.com/Peternator7/strum"

[lib]
name = "strum_macros"
path = "src/lib.rs"
proc-macro = true

[dependencies.heck]
version = "0.5.0"
path = "../../text-unicode/heck"

[dependencies.proc-macro2]
version = "1.0"
path = "../proc-macro2"

[dependencies.quote]
version = "1.0"
path = "../quote"

[dependencies.rust-syntax]
version = "3"
features = ["parsing"]
path = "../rust-syntax"

