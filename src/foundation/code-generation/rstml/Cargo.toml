# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
name = "rstml"
version = "0.13.1"
authors = [
    "vldm <me@vldm.cc>",
    "stoically <stoically@protonmail.com>",
]
build = "build.rs"
include = [
    "/src",
    "LICENSE",
    "build.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust templating for XML-based formats (HTML, SVG, MathML) implemented on top of proc-macro::TokenStreams"
readme = "../../../../docs/upstream/rstml-0.13.1/README.md"
keywords = [
    "html",
    "jsx",
    "macro",
    "rsx",
    "rust-syntax",
]
license = "MIT"
repository = "https://github.com/rs-tml/rstml"

[features]
colors = []
default = []
rawtext-stable-hack = ["rawtext-stable-hack-module"]
rawtext-stable-hack-module = []

[lib]
name = "rstml"
path = "src/lib.rs"
bench = false

[dependencies.derive-where]
version = "1.7.0"
path = "../derive-where"

[dependencies.proc-macro2]
version = "1.0.93"
features = ["span-locations"]
path = "../proc-macro2"

[dependencies.proc-macro2-diagnostics]
version = "0.11"
features = ["nightly"]
default-features = false
path = "../proc-macro2-diagnostics"

[dependencies.quote]
version = "1.0.38"
path = "../quote"

[dependencies.rust-syntax]
version = "3.0.0"
features = [
    "extra-traits",
    "full",
    "parsing",
    "visit-mut",
]
path = "../rust-syntax"

[dependencies.error-definition]
version = "2.0.11"
path = "../../diagnostics/error-definition"

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
check-cfg = ["cfg(rstml_signal_nightly)"]
