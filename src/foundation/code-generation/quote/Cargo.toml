# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "quote"
version = "1.0.47"
authors = ["David Tolnay <dtolnay@gmail.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Quasi-quoting macro quote!(...)"
documentation = "https://docs.rs/quote/"
readme = "../../../../docs/upstream/quote-1.0.47/README.md"
keywords = [
    "macros",
    "rust-syntax",
]
categories = ["development-tools::procedural-macro-helpers"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtolnay/quote"

[features]
default = ["proc-macro"]
proc-macro = ["proc-macro2/proc-macro"]

[lib]
name = "quote"
path = "src/lib.rs"

[dependencies.proc-macro2]
version = "1.0.80"
default-features = false
path = "../proc-macro2"

