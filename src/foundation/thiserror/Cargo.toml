# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.77"
name = "thiserror"
version = "2.0.21"
authors = ["David Tolnay <dtolnay@gmail.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "derive(Error)"
documentation = "https://docs.rs/thiserror"
readme = "../../../docs/upstream/thiserror-2.0.21/README.md"
keywords = [
    "error",
    "error-handling",
    "derive",
]
categories = [
    "rust-patterns",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtolnay/thiserror"

[features]
default = ["std"]
std = []

[lib]
name = "thiserror"
path = "src/lib.rs"

[dependencies.thiserror-impl]
version = "=2.0.21"
path = "../thiserror-impl"

