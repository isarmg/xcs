# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.63"
name = "tempfile"
version = "3.27.0"
authors = [
    "Steven Allen <steven@stebalien.com>",
    "The Rust Project Developers",
    "Ashley Mannix <ashleymannix@live.com.au>",
    "Jason White <me@jasonwhite.io>",
]
build = false
include = [
    "CHANGELOG.md",
    "Cargo.toml",
    "LICENSE-*",
    "README.md",
    "src/**/*.rs",
    "tests/**/*.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A library for managing temporary files and directories."
homepage = "https://stebalien.com/projects/tempfile-rs/"
documentation = "https://docs.rs/tempfile"
readme = "../../../docs/upstream/tempfile-3.27.0/README.md"
keywords = [
    "tempfile",
    "tmpfile",
    "filesystem",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Stebalien/tempfile"

[features]
default = ["system-entropy"]
nightly = []

[lib]
name = "tempfile"
path = "src/lib.rs"

[dependencies.fastrand]
version = "2.1.1"
path = "../fastrand"

[dependencies.once_cell]
version = "1.19.0"
features = ["std"]
default-features = false
path = "../once_cell"

[target.'cfg(any(unix, target_os = "wasi"))'.dependencies.rustix]
version = "1.1.4"
features = ["fs"]
path = "../rustix"

[target.'cfg(any(unix, windows, target_os = "wasi"))'.dependencies.system-entropy]
version = ">=0.3.0, <0.5"
optional = true
default-features = false
path = "../system-entropy"
