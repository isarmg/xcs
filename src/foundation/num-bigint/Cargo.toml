# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.60"
name = "num-bigint"
version = "0.4.8"
authors = ["The Rust Project Developers"]
build = false
exclude = [
    "/ci/*",
    "/.github/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Big integer implementation for Rust"
homepage = "https://github.com/rust-num/num-bigint"
documentation = "https://docs.rs/num-bigint"
readme = "../../../docs/upstream/num-bigint-0.4.8/README.md"
keywords = [
    "mathematics",
    "numerics",
    "bignum",
]
categories = [
    "algorithms",
    "data-structures",
    "science",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-num/num-bigint"

[features]
arbitrary = []
default = ["std"]
quickcheck = []
rand = []
serde = ["dep:serde"]
std = ["num-integer/std", "num-traits/std"]

[lib]
name = "num_bigint"
path = "src/lib.rs"

[dependencies.num-integer]
version = "0.1.46"
features = ["i128"]
default-features = false
path = "../num-integer"

[dependencies.num-traits]
version = "0.2.18"
features = ["i128"]
default-features = false
path = "../num-traits"

[dependencies.serde]
version = "1.0"
optional = true
default-features = false
path = "../serde"
