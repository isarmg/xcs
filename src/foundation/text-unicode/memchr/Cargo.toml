# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.61"
name = "memchr"
version = "2.8.3"
authors = [
    "Andrew Gallant <jamslam@gmail.com>",
    "bluss",
]
build = false
exclude = [
    "/.github",
    "/benchmarks",
    "/fuzz",
    "/scripts",
    "/tmp",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Provides extremely fast (uses SIMD on x86_64, aarch64 and wasm32) routines for
1, 2 or 3 byte search and single substring search.
"""
homepage = "https://github.com/BurntSushi/memchr"
documentation = "https://docs.rs/memchr/"
readme = "../../../../docs/upstream/memchr-2.8.3/README.md"
keywords = [
    "memchr",
    "memmem",
    "substring",
    "find",
    "search",
]
license = "Unlicense OR MIT"
repository = "https://github.com/BurntSushi/memchr"

[features]
alloc = []
default = ["std"]
libc = []
logging = ["dep:log"]
rustc-dep-of-std = []
std = ["alloc"]
use_std = ["std"]

[lib]
name = "memchr"
path = "src/lib.rs"
bench = false

[dependencies.log]
version = "0.4.20"
optional = true
path = "../../diagnostics/log"

