# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
rust-version = "1.88"
name = "unicode-properties"
version = "2.3.0"
authors = ["The ICU4X Project Developers"]
build = "build.rs"
include = [
    "data/**/*",
    "src/**/*",
    "examples/**/*",
    "benches/**/*",
    "tests/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "build.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Definitions for Unicode properties"
homepage = "https://icu4x.unicode.org"
readme = "../../../../docs/architecture/unicode-data-families.md"
keywords = [
    "character-properties",
    "unicode",
]
categories = [
    "internationalization",
    "localization",
    "no-std",
    "embedded",
]
license = "Unicode-3.0"
repository = "https://github.com/unicode-org/icu4x"
resolver = "2"

[features]
alloc = ["zerovec/alloc", "icu_collections/alloc", "data-serialization?/alloc"]
compiled_data = ["icu_provider/baked"]
default = ["compiled_data"]
log = ["dep:log"]
serialization = ["dep:data-serialization", "icu_locale_core/serialization", "zerovec/serialization", "icu_collections/serialization", "icu_provider/serialization", "zerotrie/serialization"]
unstable = []

[lib]
name = "unicode_properties"
path = "src/lib.rs"

[dependencies.displaydoc]
version = "0.2.3"
default-features = false
path = "../../code-generation/displaydoc"

[dependencies.icu_collections]
version = "~2.3.0"
default-features = false
path = "../icu_collections"

[dependencies.icu_locale_core]
version = "2.3.0"
features = ["zerovec"]
default-features = false
path = "../icu_locale_core"

[dependencies.icu_provider]
version = "2.3.0"
default-features = false
path = "../icu_provider"

[dependencies.log]
version = "0.4.17"
optional = true
default-features = false
path = "../../diagnostics/log"

[dependencies.data-serialization]
version = "1.0.220"
features = ["derive"]
optional = true
default-features = false
path = "../../data-storage/data-serialization"

[dependencies.zerotrie]
version = "0.2.5"
features = [
    "yoke",
    "zerofrom",
]
default-features = false
path = "../../collections/zerotrie"

[dependencies.zerovec]
version = "0.11.7"
features = [
    "derive",
    "yoke",
]
default-features = false
path = "../../collections/zerovec"

[lints.clippy]
alloc_instead_of_core = "warn"
bool_assert_comparison = "allow"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
crosspointer_transmute = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
exhaustive_enums = "deny"
exhaustive_structs = "deny"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_fields_in_debug = "warn"
missing_transmute_annotations = "warn"
negative_feature_names = "warn"
or_fun_call = "warn"
same_functions_in_if_condition = "warn"
todo = "warn"
transmute_bytes_to_str = "warn"
transmute_int_to_bool = "warn"
transmute_int_to_non_zero = "warn"
transmute_ptr_to_ptr = "warn"
transmute_ptr_to_ref = "warn"
transmute_undefined_repr = "warn"
transmutes_expressible_as_ptr_casts = "warn"
trivially_copy_pass_by_ref = "deny"
unnecessary_wraps = "warn"
useless_transmute = "warn"
wildcard_dependencies = "warn"

[lints.rust]
missing_debug_implementations = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
# Historical implementation branches are retained, not selectable Cargo features.
# These names only suppress cfg diagnostics; they never enable dormant code.
check-cfg = [
    "cfg(feature, values(\"harfbuzz_traits\", \"unicode_bidi\", \"datagen\"))",
    "cfg(icu4x_custom_data)",
    "cfg(icu4c_enable_renaming)",
    "cfg(needs_alloc_error_handler)",
    "cfg(icu4x_nightly_tests)",
    "cfg(icu4x_run_size_tests)",
    "cfg(icu4x_unstable_fast_trie_only)",
]
