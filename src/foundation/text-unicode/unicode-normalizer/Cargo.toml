# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
rust-version = "1.88"
name = "unicode-normalizer"
version = "2.3.0"
authors = ["The ICU4X Project Developers"]
build = "build.rs"
include = [
    "data/**/*",
    "src/**/*",
    "examples/**/*",
    "benches/**/*",
    "tests/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "build.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "API for normalizing text into Unicode Normalization Forms"
homepage = "https://icu4x.unicode.org"
readme = "../../../../docs/architecture/unicode-data-families.md"
keywords = [
    "unicode",
    "normalization",
    "text-processing",
]
categories = [
    "internationalization",
    "localization",
    "no-std",
    "embedded",
]
license = "Unicode-3.0"
repository = "https://github.com/unicode-org/icu4x"
resolver = "2"

[features]
compiled_data = ["unicode-properties?/compiled_data", "icu_provider/baked"]
default = ["compiled_data", "utf8_iter"]
unicode-properties = ["dep:unicode-properties"]
serialization = ["dep:data-serialization", "icu_collections/serialization", "zerovec/serialization", "unicode-properties?/serialization", "icu_provider/serialization"]
utf8_iter = ["dep:utf8_iter"]

[lib]
name = "unicode_normalizer"
path = "src/lib.rs"

[dependencies.icu_collections]
version = "~2.3.0"
default-features = false
path = "../icu_collections"

[dependencies.unicode-properties]
version = "~2.3.0"
optional = true
default-features = false
path = "../unicode-properties"

[dependencies.icu_provider]
version = "2.3.0"
default-features = false
path = "../icu_provider"

[dependencies.data-serialization]
version = "1.0.220"
features = [
    "derive",
    "alloc",
]
optional = true
default-features = false
path = "../../data-storage/data-serialization"

[dependencies.smallvec]
version = "1.10.0"
default-features = false
path = "../../collections/smallvec"

[dependencies.utf8_iter]
version = "1.0.2"
optional = true
default-features = false
path = "../utf8_iter"

[dependencies.zerovec]
version = "0.11.7"
default-features = false
path = "../../collections/zerovec"

[lints.clippy]
alloc_instead_of_core = "warn"
bool_assert_comparison = "allow"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
crosspointer_transmute = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
exhaustive_enums = "deny"
exhaustive_structs = "deny"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_fields_in_debug = "warn"
missing_transmute_annotations = "warn"
negative_feature_names = "warn"
or_fun_call = "warn"
same_functions_in_if_condition = "warn"
todo = "warn"
transmute_bytes_to_str = "warn"
transmute_int_to_bool = "warn"
transmute_int_to_non_zero = "warn"
transmute_ptr_to_ptr = "warn"
transmute_ptr_to_ref = "warn"
transmute_undefined_repr = "warn"
transmutes_expressible_as_ptr_casts = "warn"
trivially_copy_pass_by_ref = "deny"
unnecessary_wraps = "warn"
useless_transmute = "warn"
wildcard_dependencies = "warn"

[lints.rust]
missing_debug_implementations = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
# Historical implementation branches are retained, not selectable Cargo features.
# These names only suppress cfg diagnostics; they never enable dormant code.
check-cfg = [
    "cfg(feature, values(\"utf16_iter\", \"write16\", \"harfbuzz_traits\", \"datagen\"))",
    "cfg(icu4x_custom_data)",
    "cfg(icu4c_enable_renaming)",
    "cfg(needs_alloc_error_handler)",
    "cfg(icu4x_nightly_tests)",
    "cfg(icu4x_run_size_tests)",
    "cfg(icu4x_unstable_fast_trie_only)",
]
