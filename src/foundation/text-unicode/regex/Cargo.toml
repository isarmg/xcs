# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.65"
name = "regex"
version = "1.13.1"
authors = [
    "The Rust Project Developers",
    "Andrew Gallant <jamslam@gmail.com>",
]
build = false
include = [
    "/CHANGELOG.md",
    "/Cargo.toml",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/README.md",
    "/UNICODE.md",
    "bench/README.md",
    "src/**/*.rs",
    "testdata/**.toml",
    "tests/**/*.rs",
    "bench/**/*.rs",
    "benches/**/*.rs",
    "LICENSE-UNICODE",
    "!/tests/fuzz/mod.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
An implementation of regular expressions for Rust. This implementation uses
finite automata and guarantees linear time matching on all inputs.
"""
homepage = "https://github.com/rust-lang/regex"
documentation = "https://docs.rs/regex"
readme = "../../../../docs/architecture/pattern-matching.md"
categories = ["text-processing"]
license = "(MIT OR Apache-2.0) AND (Unlicense OR MIT)"
repository = "https://github.com/rust-lang/regex"

[features]
alloc = []
automata = []
automata-full = ["std", "syntax", "engine-perf", "unicode", "meta", "nfa", "dfa", "hybrid"]
default = ["matcher", "std", "perf", "unicode"]
engine-perf = ["perf-inline", "perf-literal"]
dfa = ["dfa-build", "dfa-search", "dfa-onepass"]
dfa-build = ["nfa-thompson", "dfa-search"]
dfa-onepass = ["automata", "nfa-thompson"]
dfa-search = ["automata"]
hybrid = ["alloc", "automata", "nfa-thompson"]
internal-instrument = ["internal-instrument-pikevm"]
internal-instrument-pikevm = ["logging", "std"]
literal = ["alloc"]
literal-perf = ["literal", "dep:memchr"]
logging = ["dep:log", "memchr?/logging"]
matcher = ["syntax", "meta", "nfa-pikevm"]
meta = ["automata", "nfa-pikevm", "syntax"]
nfa = ["nfa-thompson", "nfa-pikevm", "nfa-backtrack"]
nfa-backtrack = ["nfa-thompson"]
nfa-pikevm = ["nfa-thompson"]
nfa-thompson = ["alloc", "automata"]
perf = ["perf-backtrack", "perf-dfa", "perf-inline", "perf-literal", "perf-onepass"]
perf-backtrack = ["nfa-backtrack"]
perf-dfa = ["hybrid"]
perf-dfa-full = ["dfa-build", "dfa-search"]
perf-inline = []
perf-literal = ["dep:memchr", "literal", "perf-literal-multisubstring", "perf-literal-substring"]
perf-literal-multisubstring = ["literal"]
perf-literal-substring = ["dep:memchr", "literal-perf"]
perf-onepass = ["dfa-onepass"]
std = ["alloc", "memchr?/std"]
syntax = ["alloc"]
unicode = ["unicode-age", "unicode-bool", "unicode-case", "unicode-gencat", "unicode-perl", "unicode-script", "unicode-segment", "unicode-word-boundary"]
unicode-age = []
unicode-bool = []
unicode-case = []
unicode-gencat = []
unicode-perl = ["unicode-word-boundary"]
unicode-script = []
unicode-segment = []
unicode-word-boundary = []

[lib]
name = "regex"
path = "src/lib.rs"


[dependencies.log]
version = "0.4.14"
optional = true
path = "../../diagnostics/log"

[dependencies.memchr]
version = "2.6.0"
optional = true
default-features = false
path = "../memchr"



[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
check-cfg = ["cfg(docsrs_regex)"]


[[test]]
name = "retained-regressions"
path = "../../../../test/regex-family/retained_regressions.rs"
required-features = ["matcher", "std", "unicode"]
