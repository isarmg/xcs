# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.85.0"
name = "unicode-segmentation"
version = "1.13.3"
authors = [
    "kwantam <kwantam@gmail.com>",
    "Manish Goregaokar <manishsmail@gmail.com>",
]
build = false
include = [
    "COPYRIGHT",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "Cargo.toml",
    "src/**/*.rs",
    "README.md",
    "tests/**/*.rs",
    "benches/**/*.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
This crate provides Grapheme Cluster, Word and Sentence boundaries
according to Unicode Standard Annex #29 rules.
"""
homepage = "https://github.com/unicode-rs/unicode-segmentation"
readme = "../../../../docs/upstream/unicode-segmentation-1.13.3/README.md"
keywords = [
    "text",
    "unicode",
    "grapheme",
    "word",
    "boundary",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/unicode-rs/unicode-segmentation"

[features]
no_std = []

[lib]
name = "unicode_segmentation"
path = "src/lib.rs"

