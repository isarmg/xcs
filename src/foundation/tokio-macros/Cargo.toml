# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "tokio-macros"
version = "2.7.2"
authors = ["Tokio Contributors <team@tokio.rs>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Tokio's proc macros.
"""
homepage = "https://tokio.rs"
readme = "../../../docs/upstream/tokio-macros-2.7.2/README.md"
categories = ["asynchronous"]
license = "MIT"
repository = "https://github.com/tokio-rs/tokio"

[features]

[lib]
name = "tokio_macros"
path = "src/lib.rs"
proc-macro = true

[dependencies.proc-macro2]
version = "1.0.60"
path = "../proc-macro2"

[dependencies.quote]
version = "1"
path = "../quote"

[dependencies.syn]
version = "3.0"
features = ["full"]
path = "../syn-3.0.9"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(fuzzing)",
    "cfg(loom)",
    "cfg(mio_unsupported_force_poll_poll)",
    "cfg(tokio_allow_from_blocking_fd)",
    "cfg(tokio_internal_mt_counters)",
    "cfg(tokio_no_parking_lot)",
    "cfg(tokio_no_tuning_tests)",
    "cfg(tokio_unstable)",
    'cfg(target_os, values("cygwin"))',
]
