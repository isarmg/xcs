# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.54"
name = "pastey"
version = "0.2.3"
authors = [
    "Aditya Kumar <git@adityais.dev>",
    "David Tolnay <dtolnay@gmail.com>",
]
build = false
include = [
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "Cargo.toml",
    "src/**/*.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Macros for all your token pasting needs. Successor of paste."
readme = "../../../docs/upstream/pastey-0.2.3/README.md"
keywords = ["macros"]
categories = [
    "development-tools",
    "no-std",
    "no-std::no-alloc",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/as1100k/pastey"

[lib]
name = "pastey"
path = "src/lib.rs"
proc-macro = true

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(coverage_nightly)"]
