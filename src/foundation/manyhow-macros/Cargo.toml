# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
name = "manyhow-macros"
version = "0.14.1"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Macro for manyhow"
documentation = "https://docs.rs/manyhow"
readme = "../../../docs/upstream/manyhow-macros-0.14.1/README.md"
keywords = [
    "proc-macro",
    "error",
    "error-handling",
]
categories = [
    "development-tools::procedural-macro-helpers",
    "rust-patterns",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ModProg/manyhow"

[lib]
name = "manyhow_macros"
path = "src/lib.rs"
proc-macro = true

[dependencies.proc-macro-utils]
version = "0.10.0"
path = "../proc-macro-utils"

[dependencies.proc-macro2]
version = "1"
path = "../proc-macro2"

[dependencies.quote]
version = "1"
path = "../quote"
