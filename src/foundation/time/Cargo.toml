# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
rust-version = "1.88.0"
name = "time"
version = "0.3.55"
authors = [
    "Jacob Pratt <open-source@jhpratt.dev>",
    "Time contributors",
]
build = false
include = [
    "{src,tests,benchmarks}/**/*",
    "LICENSE-*",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Date and time library. Fully interoperable with the standard library. Mostly compatible with #![no_std]."
homepage = "https://time-rs.github.io"
readme = "../../../docs/upstream/time-0.3.55/README.md"
keywords = [
    "date",
    "time",
    "calendar",
    "duration",
]
categories = [
    "date-and-time",
    "no-std",
    "parser-implementations",
    "value-formatting",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/time-rs/time"

[features]
alloc = ["serde_core?/alloc"]
default = ["std"]
formatting = ["std"]
large-dates = ["time-core/large-dates"]
local-offset = ["std", "dep:libc"]
parsing = []
quickcheck = ["alloc", "deranged/quickcheck"]
rand = ["rand08", "rand09"]
rand08 = ["deranged/rand08"]
rand09 = ["deranged/rand09"]
serde = ["dep:serde_core", "deranged/serde"]
serde-human-readable = ["serde", "formatting", "parsing"]
serde-well-known = ["serde", "formatting", "parsing"]
std = ["alloc"]
wasm-bindgen = ["dep:js-sys"]

[lib]
name = "time"
path = "src/lib.rs"
bench = false

[dependencies.deranged]
version = "0.5.8"
path = "../deranged"

[dependencies.num-conv]
version = "0.2.2"
path = "../num-conv"

[dependencies.powerfmt]
version = "0.2.0"
default-features = false
path = "../powerfmt"

[dependencies.serde_core]
version = "1.0.220"
optional = true
default-features = false
path = "../serde_core"

[dependencies.time-core]
version = "=0.1.9"
path = "../time-core"

[target.'cfg(all(target_family = "wasm", not(any(target_os = "emscripten", target_os = "wasi"))))'.dependencies.js-sys]
version = "0.3.58"
optional = true
path = "../js-sys"

[target.'cfg(target_family = "unix")'.dependencies.libc]
version = "0.2.98"
optional = true
path = "../libc"

[lints.clippy]
alloc-instead-of-core = "deny"
as-underscore = "warn"
dbg-macro = "warn"
decimal-literal-representation = "warn"
explicit-auto-deref = "warn"
get-unwrap = "warn"
manual-let-else = "warn"
missing-docs-in-private-items = "warn"
missing-enforced-import-renames = "warn"
missing-panics-doc = "warn"
obfuscated-if-else = "warn"
print-stdout = "warn"
semicolon-outside-block = "warn"
std-instead-of-core = "deny"
todo = "warn"
undocumented-unsafe-blocks = "deny"
unimplemented = "warn"
uninlined-format-args = "warn"
unnested-or-patterns = "warn"
unwrap-in-result = "warn"
unwrap-used = "warn"
use-debug = "warn"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.incompatible-msrv]
level = "allow"
priority = 1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.option-if-let-else]
level = "allow"
priority = 1

[lints.clippy.redundant-pub-crate]
level = "allow"
priority = 1

[lints.clippy.uninhabited-references]
level = "allow"
priority = 1

[lints.rust]
ambiguous-glob-reexports = "deny"
clashing-extern-declarations = "deny"
const-item-mutation = "deny"
dangling-pointers-from-temporaries = "deny"
deref-nullptr = "deny"
drop-bounds = "deny"
future-incompatible = "deny"
hidden-glob-reexports = "deny"
improper-ctypes = "deny"
improper-ctypes-definitions = "deny"
invalid-from-utf8 = "deny"
invalid-macro-export-arguments = "deny"
invalid-nan-comparisons = "deny"
invalid-reference-casting = "deny"
invalid-value = "deny"
keyword-idents = "warn"
let-underscore = "warn"
macro-use-extern-crate = "warn"
meta-variable-misuse = "warn"
missing-abi = "warn"
missing-copy-implementations = "warn"
missing-debug-implementations = "warn"
missing-docs = "warn"
named-arguments-used-positionally = "deny"
non-ascii-idents = "deny"
noop-method-call = "warn"
opaque-hidden-inferred-bound = "deny"
overlapping-range-endpoints = "deny"
single-use-lifetimes = "warn"
suspicious-double-ref-op = "deny"
trivial-casts = "warn"
trivial-numeric-casts = "warn"
unconditional-recursion = "deny"
unnameable-test-items = "deny"
unreachable-pub = "warn"
unsafe-op-in-unsafe-fn = "deny"
unstable-syntax-pre-expansion = "deny"
unused-import-braces = "warn"
unused-lifetimes = "warn"
unused-qualifications = "warn"
variant-size-differences = "warn"

[lints.rust.unexpected_cfgs]
level = "deny"
priority = 0
check-cfg = [
    "cfg(__ui_tests)",
    "cfg(bench)",
]

[lints.rust.unstable-name-collisions]
level = "allow"
priority = 1

[lints.rust.unused]
level = "warn"
priority = -1

[lints.rustdoc]
private-doc-tests = "warn"
unescaped-backticks = "warn"
