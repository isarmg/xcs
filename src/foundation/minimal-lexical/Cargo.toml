# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "minimal-lexical"
version = "0.2.1"
authors = ["Alex Huszagh <ahuszagh@gmail.com>"]
exclude = ["assets/*", "ci/*", "docs/*", "etc/*", "fuzz/*", "examples/*", "scripts/*"]
autoexamples = false
description = "Fast float parsing conversion routines."
documentation = "https://docs.rs/minimal-lexical"
readme = "../../../docs/upstream/minimal-lexical-0.2.1/README.md"
keywords = ["parsing", "no_std"]
categories = ["parsing", "no-std"]
license = "MIT/Apache-2.0"
repository = "https://github.com/Alexhuszagh/minimal-lexical"
autotests = false
autobenches = false

[features]
alloc = []
compact = []
default = ["std"]
lint = []
nightly = []
std = []
