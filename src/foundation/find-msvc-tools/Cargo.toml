doc_markdown = "warn"
manual_let_else = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"

[lints.rust]
missing_docs = "warn"

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
check-cfg = ["cfg(disable_clang_cl_tests)"]
