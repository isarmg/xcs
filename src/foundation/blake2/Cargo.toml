# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "blake2"
version = "0.10.6"
authors = ["RustCrypto Developers"]
description = "BLAKE2 hash functions"
documentation = "https://docs.rs/blake2"
readme = "../../../docs/upstream/blake2-0.10.6/README.md"
keywords = [
    "crypto",
    "blake2",
    "hash",
    "digest",
]
categories = [
    "cryptography",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustCrypto/hashes"
autotests = false
autobenches = false
autoexamples = false

[dependencies.digest]
version = "0.10.3"
features = ["mac"]
path = "../digest-0.10.7"

[features]
default = ["std"]
reset = []
simd = []
simd_asm = ["simd_opt"]
simd_opt = ["simd"]
size_opt = []
std = ["digest/std"]
