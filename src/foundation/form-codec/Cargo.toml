# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "form-codec"
version = "0.7.1"
authors = ["Anthony Ramine <n.oxyde@gmail.com>"]
exclude = ["/.travis.yml", "/bors.toml"]
description = "`x-www-form-urlencoded` meets Serde"
documentation = "https://docs.rs/serde_urlencoded/0.7.1/serde_urlencoded/"
keywords = ["serde", "serialization", "urlencoded"]
categories = ["encoding", "web-programming"]
license = "MIT/Apache-2.0"
repository = "https://github.com/nox/serde_urlencoded"
autotests = false
autobenches = false
autoexamples = false

[lib]
test = false
[dependencies.itoa]
version = "1"
path = "../itoa"

[dependencies.ryu]
version = "1"
path = "../ryu"

[dependencies.data-serialization]
version = "1.0.69"
path = "../data-serialization"
[badges.travis-ci]
repository = "nox/serde_urlencoded"

[dependencies.url-encoding]
path = "../url-encoding"
default-features = false
features = ["form", "std"]
