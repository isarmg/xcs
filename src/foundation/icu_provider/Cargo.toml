# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
rust-version = "1.88"
name = "icu_provider"
version = "2.3.1"
authors = ["The ICU4X Project Developers"]
build = false
include = [
    "data/**/*",
    "src/**/*",
    "examples/**/*",
    "benches/**/*",
    "tests/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "build.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Trait and struct definitions for the ICU data provider"
homepage = "https://icu4x.unicode.org"
readme = "../../../docs/upstream/icu_provider-2.3.1/README.md"
keywords = [
    "data-loading",
    "data",
]
categories = [
    "internationalization",
    "localization",
    "no-std",
    "embedded",
]
license = "Unicode-3.0"
repository = "https://github.com/unicode-org/icu4x"
resolver = "2"

[features]
alloc = ["icu_locale_core/alloc", "data-serialization?/alloc", "yoke/alloc", "zerofrom/alloc", "zerovec/alloc", "zerotrie?/alloc", "dep:stable_deref_trait", "dep:writeable"]
baked = ["dep:zerotrie", "dep:writeable"]
deserialize_bincode_1 = ["serialization", "std"]
deserialize_json = ["serialization", "dep:json-codec"]
deserialize_postcard_1 = ["serialization"]
export = ["serialization", "std", "sync", "zerovec/databake"]
logging = ["dep:log"]
serialization = ["dep:data-serialization", "yoke/serialization"]
std = ["alloc"]
sync = []
zerotrie = []

[lib]
name = "icu_provider"
path = "src/lib.rs"
bench = false

[dependencies.displaydoc]
version = "0.2.3"
default-features = false
path = "../displaydoc"

[dependencies.icu_locale_core]
version = "2.3.0"
default-features = false
path = "../icu_locale_core"

[dependencies.log]
version = "0.4.17"
optional = true
default-features = false
path = "../log"

[dependencies.data-serialization]
version = "1.0.220"
features = ["derive"]
optional = true
default-features = false
path = "../data-serialization"

[dependencies.json-codec]
version = "1.0.45"
optional = true
path = "../json-codec"

[dependencies.stable_deref_trait]
version = "1.2.0"
optional = true
default-features = false
path = "../stable_deref_trait"

[dependencies.writeable]
version = "0.6.4"
optional = true
default-features = false
path = "../writeable"

[dependencies.yoke]
version = "0.8.3"
features = ["derive"]
default-features = false
path = "../yoke"

[dependencies.zerofrom]
version = "0.1.6"
features = ["derive"]
default-features = false
path = "../zerofrom"

[dependencies.zerotrie]
version = "0.2.5"
optional = true
default-features = false
path = "../zerotrie"

[dependencies.zerovec]
version = "0.11.8"
features = ["derive"]
default-features = false
path = "../zerovec"

[lints.clippy]
alloc_instead_of_core = "warn"
bool_assert_comparison = "allow"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
crosspointer_transmute = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
exhaustive_enums = "deny"
exhaustive_structs = "deny"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_fields_in_debug = "warn"
missing_transmute_annotations = "warn"
negative_feature_names = "warn"
or_fun_call = "warn"
same_functions_in_if_condition = "warn"
todo = "warn"
transmute_bytes_to_str = "warn"
transmute_int_to_bool = "warn"
transmute_int_to_non_zero = "warn"
transmute_ptr_to_ptr = "warn"
transmute_ptr_to_ref = "warn"
transmute_undefined_repr = "warn"
transmutes_expressible_as_ptr_casts = "warn"
trivially_copy_pass_by_ref = "deny"
unnecessary_wraps = "warn"
useless_transmute = "warn"
wildcard_dependencies = "warn"

[lints.rust]
missing_debug_implementations = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(icu4c_enable_renaming)",
    "cfg(needs_alloc_error_handler)",
    "cfg(icu4x_nightly_tests)",
    "cfg(icu4x_run_size_tests)",
    "cfg(icu4x_unstable_fast_trie_only)",
]
