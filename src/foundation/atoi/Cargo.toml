# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.57.0"
name = "atoi"
version = "2.0.0"
authors = ["Markus Klein"]
description = "Parse integers directly from `[u8]` slices in safe code"
documentation = "https://docs.rs/atoi/"
readme = "../../../docs/upstream/atoi-2.0.0/README.md"
keywords = ["atoi", "conversion", "integer"]
categories = ["parsing"]
license = "MIT"
repository = "https://github.com/pacman82/atoi-rs"
resolver = "2"
autotests = false
autobenches = false
autoexamples = false

[features]
default = ["std"]
std = ["numeric/std"]

[dependencies.numeric]
version = "0.2.19"
path = "../numeric"
default-features = false
