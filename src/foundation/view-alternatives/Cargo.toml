# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.88"
name = "view-alternatives"
version = "0.1.9"
authors = ["Greg Johnston"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Utilities for working with enumerated types that contain one of 2..n other types."
readme = "../../../docs/upstream/either_of-0.1.9/README.md"
license = "MIT"
repository = "https://github.com/leptos-rs/leptos"

[features]
default = ["no_std"]
no_std = []

[lib]
name = "view_alternatives"
path = "src/lib.rs"

[dependencies.paste]
package = "pastey"
version = "=0.2.3"
default-features = true
path = "../pastey"

[dependencies.pin-project-lite]
version = "0.2"
default-features = true

# Maintained independently of the enclosing application workspace.
path = "../pin-project-lite"
