# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.60"
name = "crossbeam-queue"
version = "0.3.14"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Concurrent queues"
homepage = "https://github.com/crossbeam-rs/crossbeam/tree/master/crossbeam-queue"
readme = "../../../docs/upstream/crossbeam-queue-0.3.14/README.md"
keywords = [
    "queue",
    "mpmc",
    "lock-free",
    "producer",
    "consumer",
]
categories = [
    "concurrency",
    "data-structures",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/crossbeam-rs/crossbeam"

[features]
alloc = []
default = ["std"]
nightly = ["crossbeam-utils/nightly"]
std = ["alloc", "crossbeam-utils/std"]

[lib]
name = "crossbeam_queue"
path = "src/lib.rs"

[dependencies.crossbeam-utils]
version = "0.8.18"
default-features = false
path = "../crossbeam-utils"

[lints.clippy.declare_interior_mutable_const]
level = "allow"
priority = 1

[lints.clippy.lint_groups_priority]
level = "allow"
priority = 1

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(crossbeam_loom)",
    "cfg(crossbeam_sanitize)",
]
