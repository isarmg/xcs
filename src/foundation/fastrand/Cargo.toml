# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.63"
name = "fastrand"
version = "2.5.0"
authors = ["Stjepan Glavina <stjepang@gmail.com>"]
build = false
exclude = ["/.*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A simple and fast random number generator"
readme = "../../../docs/upstream/fastrand-2.5.0/README.md"
keywords = [
    "simple",
    "fast",
    "rand",
    "random",
    "wyrand",
]
categories = ["algorithms"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/smol-rs/fastrand"

[features]
alloc = []
default = ["std"]
js = ["std", "system-entropy"]
std = ["alloc"]

[lib]
name = "fastrand"
path = "src/lib.rs"

[target.'cfg(all(any(target_arch = "wasm32", target_arch = "wasm64"), target_os = "unknown"))'.dependencies.system-entropy]
version = "0.4"
features = ["wasm_js"]
optional = true
path = "../system-entropy"

