# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "rustls-webpki"
version = "0.103.15"
build = false
include = [
    "Cargo.toml",
    "/LICENSE",
    "/README.md",
    "src/aws_lc_rs_algs.rs",
    "src/calendar.rs",
    "src/cert.rs",
    "src/crl/mod.rs",
    "src/crl/types.rs",
    "src/data/",
    "src/der.rs",
    "src/end_entity.rs",
    "src/error.rs",
    "src/rpk_entity.rs",
    "src/subject_name/dns_name.rs",
    "src/subject_name/ip_address.rs",
    "src/subject_name/mod.rs",
    "src/subject_name/name.rs",
    "src/subject_name/verify.rs",
    "src/name/verify.rs",
    "src/name/name.rs",
    "src/signed_data.rs",
    "src/ring_algs.rs",
    "src/alg_tests.rs",
    "src/time.rs",
    "src/trust_anchor.rs",
    "src/x509.rs",
    "src/verify_cert.rs",
    "src/lib.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Web PKI X.509 Certificate Verification."
readme = "../../../docs/upstream/rustls-webpki-0.103.15/README.md"
categories = [
    "cryptography",
    "no-std",
]
license = "ISC"
repository = "https://github.com/rustls/webpki"

[features]
alloc = ["ring?/alloc", "pki-types/alloc"]
aws-lc-rs = []
aws-lc-rs-fips = []
aws-lc-rs-unstable = ["aws-lc-rs"]
default = ["std"]
ring = ["dep:ring"]
std = ["alloc", "pki-types/std"]

[lib]
name = "webpki"
path = "src/lib.rs"

[dependencies.pki-types]
version = "1.12"
default-features = false
package = "rustls-pki-types"
path = "../rustls-pki-types"

[dependencies.ring]
version = "0.17"
optional = true
default-features = false
path = "../ring"

[dependencies.untrusted]
version = "0.9"
path = "../untrusted"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(webpki_docsrs)"]

