# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "simd-adler32"
version = "0.3.10"
authors = ["Marvin Countryman <me@maar.vin>"]
build = false
exclude = ["bench"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A SIMD-accelerated Adler-32 hash algorithm implementation."
readme = "../../../docs/upstream/simd-adler32-0.3.10/README.md"
keywords = [
    "simd",
    "avx2",
    "ssse3",
    "adler",
    "adler32",
]
categories = [
    "algorithms",
    "no-std",
]
license = "MIT"
repository = "https://github.com/mcountryman/simd-adler32"

[features]
const-generics = []
default = ["std", "const-generics"]
nightly = []
std = []

[lib]
name = "simd_adler32"
path = "src/lib.rs"

