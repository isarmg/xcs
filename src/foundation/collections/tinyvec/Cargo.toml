# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "tinyvec"
version = "1.13.3"
authors = ["Lokathor <zefria@gmail.com>"]
build = false
exclude = [
    "/.github",
    "/*.py",
    "/*.sh",
    "/src-backup",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "`tinyvec` provides 100% safe vec-like data structures."
readme = "../../../../docs/upstream/tinyvec-1.13.3/README.md"
keywords = [
    "vec",
    "no_std",
    "no-std",
]
categories = [
    "data-structures",
    "no-std",
]
license = "Zlib OR Apache-2.0 OR MIT"
repository = "https://github.com/Lokathor/tinyvec"

[features]
alloc = []
debugger_visualizer = []
default = []
experimental_write_impl = []
grab_spare_slice = []
latest_stable_rust = ["rustc_1_61"]
nightly_slice_partition_dedup = []
real_blackbox = []
rustc_1_40 = []
rustc_1_55 = []
rustc_1_57 = []
rustc_1_61 = ["rustc_1_57"]
schemars = ["alloc"]
serialization = ["dep:data-serialization"]
std = ["alloc"]
tinyvec_macros = []

[lib]
name = "tinyvec"
path = "src/lib.rs"

[dependencies.data-serialization]
version = "1.0.229"
optional = true
default-features = false
path = "../../data-storage/data-serialization"
