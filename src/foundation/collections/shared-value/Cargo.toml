# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.88"
name = "shared-value"
version = "0.2.1"
authors = [
    "Danik Vitek",
    "Greg Johnston",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A smart pointer for storing immutable values with relatively-cheap cloning. (Like a `Cow` meets an `Rc`!)"
readme = "../../../../docs/upstream/oco_ref-0.2.1/README.md"
license = "MIT"
repository = "https://github.com/leptos-rs/leptos"

[lib]
name = "shared_value"
path = "src/lib.rs"

[dependencies.data-serialization]
version = "1.0.219"
default-features = true
path = "../../data-storage/data-serialization"

[dependencies.error-definition]
version = "2.0.12"
default-features = true
path = "../../diagnostics/error-definition"


[dev-dependencies.json-codec]
version = "1"
path = "../../data-storage/json-codec"
