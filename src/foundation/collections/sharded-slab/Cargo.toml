# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.42.0"
name = "sharded-slab"
version = "0.1.7"
authors = ["Eliza Weisman <eliza@buoyant.io>"]
description = """
A lock-free concurrent slab.
"""
homepage = "https://github.com/hawkw/sharded-slab"
documentation = "https://docs.rs/sharded-slab/"
readme = "../../../../docs/upstream/sharded-slab-0.1.7/README.md"
keywords = [
    "slab",
    "allocator",
    "lock-free",
    "atomic",
]
categories = [
    "memory-management",
    "data-structures",
    "concurrency",
]
license = "MIT"
repository = "https://github.com/hawkw/sharded-slab"
autotests = false
autobenches = false
autoexamples = false

[dependencies.lazy_static]
version = "1"
path = "../../concurrency/lazy_static"

[badges.maintenance]
status = "experimental"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(slab_print)"] }
