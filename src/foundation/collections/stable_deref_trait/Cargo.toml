# Internal source component. Original manifest and origin: compliance/provenance.

[package]
name = "stable_deref_trait"
version = "1.2.1"
authors = ["Robert Grosse <n210241048576@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
An unsafe marker trait for types like Box and Rc that dereference to a stable address even when moved, and hence can be used with libraries such as owning_ref and rental.
"""
documentation = "https://docs.rs/stable_deref_trait/1.2.1/stable_deref_trait"
readme = "../../../../docs/upstream/stable_deref_trait-1.2.1/README.md"
categories = [
    "memory-management",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/storyyeller/stable_deref_trait"

[features]
alloc = []
default = ["std"]
std = ["alloc"]

[lib]
name = "stable_deref_trait"
path = "src/lib.rs"
