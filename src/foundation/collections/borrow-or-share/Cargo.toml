# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.65"
name = "borrow-or-share"
version = "0.2.4"
authors = ["Scallop Ye <yescallop@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Traits for either borrowing or sharing data."
documentation = "https://docs.rs/borrow-or-share"
readme = "../../../../docs/upstream/borrow-or-share-0.2.4/README.md"
keywords = [
    "borrow",
    "share",
]
categories = ["rust-patterns"]
license = "MIT-0"
repository = "https://github.com/yescallop/borrow-or-share"

[features]
alloc = []
default = ["alloc"]
std = ["alloc"]

[lib]
name = "borrow_or_share"
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(no_rc, no_sync, no_global_oom_handling)"]
