# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71.1"
name = "bumpalo"
version = "3.20.3"
authors = ["Nick Fitzgerald <fitzgen@gmail.com>"]
build = false
exclude = [
    "/.github/*",
    "/benches",
    "/tests",
    "valgrind.supp",
    "bumpalo.png",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A fast bump allocation arena for Rust."
documentation = "https://docs.rs/bumpalo"
readme = "../../../../docs/upstream/bumpalo-3.20.3/README.md"
keywords = [
    "arena",
    "bump",
    "allocator",
]
categories = [
    "memory-management",
    "rust-patterns",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/fitzgen/bumpalo"

[features]
allocator_api = []
bench_allocator_api = ["allocator_api"]
boxed = []
collections = []
default = []
serialization = ["dep:data-serialization"]
std = []

[lib]
name = "bumpalo"
path = "src/lib.rs"
bench = false

[dependencies.allocator-api2]
version = "0.2.8"
optional = true
default-features = false
path = "../allocator-api2"

[dependencies.data-serialization]
version = "1.0.171"
optional = true
path = "../../data-storage/data-serialization"

