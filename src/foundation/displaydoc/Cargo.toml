# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71.0"
name = "displaydoc"
version = "0.2.7"
authors = ["Jane Lusby <jlusby@yaah.dev>"]
build = false
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "CHANGELOG.md",
    "src/**/*.rs",
    "tests/**/*.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
A derive macro for implementing the display Trait via a doc comment and string interpolation
"""
homepage = "https://github.com/yaahc/displaydoc"
documentation = "https://docs.rs/displaydoc"
readme = "../../../docs/upstream/displaydoc-0.2.7/README.md"
keywords = [
    "display",
    "derive",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yaahc/displaydoc"

[features]
default = ["std"]
std = []

[lib]
name = "displaydoc"
path = "src/lib.rs"
proc-macro = true

[dependencies.proc-macro2]
version = "1.0"
path = "../proc-macro2"

[dependencies.quote]
version = "1.0"
path = "../quote"

[dependencies.syn]
version = "3.0"
path = "../syn-3.0.9"

