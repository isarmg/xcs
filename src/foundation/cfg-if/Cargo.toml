# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.32"
name = "cfg-if"
version = "1.0.5"
authors = ["Alex Crichton <alex@alexcrichton.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
A macro to ergonomically define an item depending on a large number of #[cfg]
parameters. Structured like an if-else chain, the first matching branch is the
item that gets emitted.
"""
readme = "../../../docs/upstream/cfg-if-1.0.5/README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/cfg-if"

[features]
rustc-dep-of-std = []

[lib]
name = "cfg_if"
path = "src/lib.rs"

