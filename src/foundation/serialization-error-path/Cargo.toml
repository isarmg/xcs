# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.61"
name = "serialization-error-path"
version = "0.1.20"
authors = ["David Tolnay <dtolnay@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Path to the element that failed to deserialize"
documentation = "https://docs.rs/serde_path_to_error"
readme = "../../../docs/upstream/serde_path_to_error-0.1.20/README.md"
keywords = [
    "serde",
    "serialization",
]
categories = [
    "encoding",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtolnay/path-to-error"

[lib]
name = "serialization_error_path"
path = "src/lib.rs"

[dependencies.itoa]
version = "1.0"
path = "../itoa"

[dependencies.serialization-core]
version = "1.0.220"
features = ["alloc"]
default-features = false
path = "../serialization-core"

