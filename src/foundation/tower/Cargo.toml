# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.64.0"
name = "tower"
version = "0.5.3"
authors = ["Tower Maintainers <team@tower-rs.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Tower is a library of modular and reusable components for building robust
clients and servers.
"""
homepage = "https://github.com/tower-rs/tower"
readme = "../../../docs/upstream/tower-0.5.3/README.md"
keywords = [
    "io",
    "async",
    "non-blocking",
    "futures",
    "service",
]
categories = [
    "asynchronous",
    "network-programming",
]
license = "MIT"
repository = "https://github.com/tower-rs/tower"

[features]
balance = ["discover", "load", "ready-cache", "make", "slab", "util"]
buffer = ["tokio/sync", "tokio/rt", "tokio-util", "tracing", "pin-project-lite"]
discover = ["dep:futures", "futures/std", "pin-project-lite"]
filter = ["dep:futures", "futures/alloc", "futures/utilities", "pin-project-lite"]
full = ["balance", "buffer", "discover", "filter", "hedge", "limit", "load", "load-shed", "make", "ready-cache", "reconnect", "retry", "spawn-ready", "steer", "timeout", "util"]
hedge = ["util", "filter", "dep:futures", "futures/alloc", "futures/utilities", "tokio/time", "tracing"]
limit = ["tokio/time", "tokio/sync", "tokio-util", "tracing", "pin-project-lite"]
load = ["tokio/time", "tracing", "pin-project-lite"]
load-shed = ["pin-project-lite"]
log = ["tracing/log"]
make = ["pin-project-lite", "tokio"]
ready-cache = ["dep:futures", "futures/std", "futures/alloc", "futures/utilities", "indexmap", "tokio/sync", "tracing", "pin-project-lite"]
reconnect = ["make", "tracing"]
retry = ["tokio/time", "util"]
spawn-ready = ["dep:futures", "futures/alloc", "futures/utilities", "tokio/sync", "tokio/rt", "util", "tracing"]
steer = []
timeout = ["pin-project-lite", "tokio/time"]
tokio-stream = []
util = ["dep:futures", "futures/std", "futures/alloc", "futures/utilities", "pin-project-lite", "sync_wrapper"]

[lib]
name = "tower"
path = "src/lib.rs"

[dependencies.futures]
version = "0.3.34"
path = "../futures"
default-features = false
optional = true

[dependencies.indexmap]
version = "2.0.2"
optional = true
path = "../indexmap"

[dependencies.pin-project-lite]
version = "0.2.7"
optional = true
path = "../pin-project-lite"

[dependencies.slab]
version = "0.4.9"
optional = true
path = "../slab"

[dependencies.sync_wrapper]
version = "1"
optional = true
path = "../sync_wrapper"

[dependencies.tokio]
version = "1.6.2"
optional = true
path = "../tokio"

[dependencies.tokio-util]
version = "0.7.0"
optional = true
default-features = false
path = "../tokio-util"

[dependencies.tower-layer]
version = "0.3.3"
path = "../tower-layer"

[dependencies.tower-service]
version = "0.3.3"
path = "../tower-service"

[dependencies.tracing]
version = "0.1.2"
features = ["std"]
optional = true
default-features = false
path = "../tracing"

