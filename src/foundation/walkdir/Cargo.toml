# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "walkdir"
version = "2.5.0"
authors = ["Andrew Gallant <jamslam@gmail.com>"]
exclude = [
    "/ci/*",
    "/.travis.yml",
    "/appveyor.yml",
]
description = "Recursively walk a directory."
homepage = "https://github.com/BurntSushi/walkdir"
documentation = "https://docs.rs/walkdir/"
readme = "../../../docs/upstream/walkdir-2.5.0/README.md"
keywords = [
    "directory",
    "recursive",
    "walk",
    "iterator",
]
categories = ["filesystem"]
license = "Unlicense/MIT"
repository = "https://github.com/BurntSushi/walkdir"
autotests = false
autobenches = false
autoexamples = false

[dependencies.same-file]
version = "1.0.1"
path = "../same-file"

[badges.appveyor]
repository = "BurntSushi/walkdir"

[badges.travis-ci]
repository = "BurntSushi/walkdir"
