# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.61"
name = "http-body"
version = "1.1.0"
authors = [
    "Carl Lerche <me@carllerche.com>",
    "Lucio Franco <luciofranco14@gmail.com>",
    "Sean McArthur <sean@seanmonstar.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Trait representing an asynchronous, streaming, HTTP request or response body.
"""
documentation = "https://docs.rs/http-body"
readme = "../../../docs/upstream/http-body-1.1.0/README.md"
keywords = ["http"]
categories = ["web-programming"]
license = "MIT"
repository = "https://github.com/hyperium/http-body"

[lib]
name = "http_body"
path = "src/lib.rs"

[dependencies.bytes]
version = "1"
path = "../bytes"

[dependencies.http]
version = "1"
path = "../http"
