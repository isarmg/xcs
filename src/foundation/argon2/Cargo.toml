# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.65"
name = "argon2"
version = "0.5.3"
authors = ["RustCrypto Developers"]
description = """
Pure Rust implementation of the Argon2 password hashing function with support
for the Argon2d, Argon2i, and Argon2id algorithmic variants
"""
documentation = "https://docs.rs/argon2"
readme = "../../../docs/upstream/argon2-0.5.3/README.md"
keywords = [
    "crypto",
    "hashing",
    "password",
    "phf",
]
categories = [
    "authentication",
    "cryptography",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustCrypto/password-hashes/tree/master/argon2"
autotests = false
autobenches = false
autoexamples = false

[dependencies.base64ct]
version = "1"
path = "../base64ct"

[dependencies.blake2]
version = "0.10.6"
default-features = false
path = "../blake2"

[dependencies.password-hash]
version = "0.5"
optional = true
path = "../password-hash"

[dependencies.zeroize]
version = "1"
optional = true
default-features = false
path = "../zeroize"

[features]
alloc = ["password-hash/alloc"]
default = ["alloc", "password-hash", "rand"]
rand = ["password-hash/rand_core"]
simple = ["password-hash"]
std = ["alloc", "password-hash/std"]

[target."cfg(any(target_arch = \"x86\", target_arch = \"x86_64\"))".dependencies.cpufeatures]
version = "0.2.12"
path = "../cpufeatures-0.2.17"
