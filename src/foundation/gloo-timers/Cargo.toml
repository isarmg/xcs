# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.64"
name = "gloo-timers"
version = "0.3.0"
authors = ["Rust and WebAssembly Working Group"]
description = "Convenience crate for working with JavaScript timers"
homepage = "https://github.com/rustwasm/gloo"
readme = "../../../docs/upstream/gloo-timers-0.3.0/README.md"
categories = [
    "api-bindings",
    "asynchronous",
    "wasm",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustwasm/gloo/tree/master/crates/timers"
autotests = false
autobenches = false
autoexamples = false

[dependencies.futures]
version = "0.3.34"
path = "../futures"
default-features = false
optional = true

[dependencies.js-sys]
version = "0.3.31"
path = "../js-sys"

[dependencies.wasm-bindgen]
version = "0.2"
path = "../wasm-bindgen"

[features]
default = []
futures = ["dep:futures", "futures/std", "futures/channel"]
