# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.66"
name = "fancy-regex"
version = "0.19.2"
authors = [
    "Raph Levien <raph@google.com>",
    "Robin Stocker <robin@nibor.org>",
    "Keith Hall <keith.hall@available.systems>",
]
build = false
exclude = [
    "/.github/*",
    "/Cargo.lock.msrv",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "An implementation of regexes, supporting a relatively rich set of features, including backreferences and look-around. Aims to be compatible with Oniguruma syntax when the relevant flag is set."
documentation = "https://docs.rs/fancy-regex"
readme = "../../../docs/upstream/fancy-regex-0.19.2/README.md"
categories = ["text-processing"]
license = "MIT"
repository = "https://github.com/fancy-regex/fancy-regex"

[features]
default = ["unicode", "perf", "std", "variable-lookbehinds"]
leftmost_longest = []
perf = ["regex-automata/perf"]
perf-dfa-full = ["regex-automata/dfa-build"]
std = ["regex-automata/std", "regex-syntax/std", "bit-set/std"]
track_caller = []
unicode = ["regex-automata/unicode", "regex-syntax/unicode"]
variable-lookbehinds = ["regex-automata/dfa-search"]

[lib]
name = "fancy_regex"
path = "src/lib.rs"

[dependencies.bit-set]
version = "0.8"
default-features = false
path = "../bit-set"

[dependencies.regex-automata]
version = "0.4.16"
features = [
    "alloc",
    "syntax",
    "meta",
    "nfa",
    "dfa-onepass",
    "dfa-search",
    "hybrid",
]
default-features = false
path = "../regex-automata"

[dependencies.regex-syntax]
version = "0.8"
default-features = false
path = "../regex-syntax"

