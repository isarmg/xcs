# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "smallvec"
version = "1.16.3"
authors = ["The Servo Project Developers"]
build = false
include = [
    "Cargo.toml",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "README.md",
    "src/**/*.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "'Small vector' optimization: store up to a small number of items on the stack"
documentation = "https://docs.rs/smallvec/"
readme = "../../../docs/upstream/smallvec-1.16.3/README.md"
keywords = [
    "small",
    "vec",
    "vector",
    "stack",
    "no_std",
]
categories = ["data-structures"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/servo/rust-smallvec"

[features]
const_generics = []
const_new = ["const_generics"]
drain_filter = []
drain_keep_rest = ["drain_filter"]
impl_bincode = []
may_dangle = []
specialization = []
union = []
write = []

[lib]
name = "smallvec"
path = "src/lib.rs"

[dependencies.serde]
version = "1"
optional = true
default-features = false
path = "../serde"

