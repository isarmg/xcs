# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "ref-cast"
version = "1.0.27"
authors = ["David Tolnay <dtolnay@gmail.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Safely cast &T to &U where the struct U contains a single field of type T."
documentation = "https://docs.rs/ref-cast"
readme = "../../../docs/upstream/ref-cast-1.0.27/README.md"
categories = [
    "rust-patterns",
    "no-std",
    "no-std::no-alloc",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtolnay/ref-cast"

[lib]
name = "ref_cast"
path = "src/lib.rs"

[dependencies.ref-cast-impl]
version = "=1.0.27"
path = "../ref-cast-impl"

