# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.61"
name = "crossbeam-deque"
version = "0.8.8"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Concurrent work-stealing deque"
homepage = "https://github.com/crossbeam-rs/crossbeam/tree/master/crossbeam-deque"
readme = "../../../docs/upstream/crossbeam-deque-0.8.8/README.md"
keywords = [
    "chase-lev",
    "lock-free",
    "scheduler",
    "scheduling",
]
categories = [
    "algorithms",
    "concurrency",
    "data-structures",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/crossbeam-rs/crossbeam"

[features]
default = ["std"]
std = ["crossbeam-epoch/std", "crossbeam-utils/std"]

[lib]
name = "crossbeam_deque"
path = "src/lib.rs"

[dependencies.crossbeam-epoch]
version = "0.9.17"
default-features = false
path = "../crossbeam-epoch"

[dependencies.crossbeam-utils]
version = "0.8.18"
default-features = false
path = "../crossbeam-utils"

[lints.clippy.declare_interior_mutable_const]
level = "allow"
priority = 1

[lints.clippy.lint_groups_priority]
level = "allow"
priority = 1

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(crossbeam_loom)",
    "cfg(crossbeam_sanitize)",
]
