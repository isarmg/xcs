# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "utf8parse"
version = "0.2.2"
authors = [
    "Joe Wilm <joe@jwilm.com>",
    "Christian Duerr <contact@christianduerr.com>",
]
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Table-driven UTF-8 parser"
documentation = "https://docs.rs/utf8parse/"
readme = false
keywords = [
    "utf8",
    "parse",
    "table",
]
categories = [
    "parsing",
    "no-std",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/alacritty/vte"
resolver = "2"

[lib]
name = "utf8parse"
path = "src/lib.rs"

[features]
default = []
nightly = []
