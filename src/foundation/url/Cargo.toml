# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.63"
name = "url"
version = "2.5.8"
authors = ["The rust-url developers"]
build = false
include = [
    "src/**/*",
    "LICENSE-*",
    "README.md",
    "tests/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "URL library for Rust, based on the WHATWG URL Standard"
documentation = "https://docs.rs/url"
readme = "../../../docs/upstream/url-2.5.8/README.md"
keywords = [
    "url",
    "parser",
]
categories = [
    "parser-implementations",
    "web-programming",
    "encoding",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/servo/rust-url"

[features]
debugger_visualizer = []
default = ["std"]
expose_internals = []
serialization = ["dep:data-serialization", "data-serialization/derive"]
std = ["idna/std", "percent-encoding/std", "form_urlencoded/std", "data-serialization?/std"]

[lib]
name = "url"
path = "src/lib.rs"

[dependencies.form_urlencoded]
version = "1.2.2"
features = ["alloc"]
default-features = false
path = "../form_urlencoded"

[dependencies.idna]
version = "1.1.0"
features = [
    "alloc",
    "compiled_data",
]
default-features = false
path = "../idna"

[dependencies.percent-encoding]
version = "2.3.2"
features = ["alloc"]
default-features = false
path = "../percent-encoding"

[dependencies.data-serialization]
version = "1.0.229"
optional = true
default-features = false
path = "../data-serialization"

