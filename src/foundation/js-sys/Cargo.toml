# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.81"
name = "js-sys"
version = "0.3.106"
authors = ["The wasm-bindgen Developers"]
build = false
include = [
    "/LICENSE-*",
    "/src",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Bindings for all JS global objects and functions in all JS environments like
Node.js and browsers, built on `#[wasm_bindgen]` using the `wasm-bindgen` crate.
"""
homepage = "https://wasm-bindgen.github.io/wasm-bindgen/"
documentation = "https://docs.rs/js-sys"
readme = "../../../docs/upstream/js-sys-0.3.106/README.md"
categories = ["wasm"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/wasm-bindgen/wasm-bindgen/tree/master/crates/js-sys"

[features]
default = ["std", "unsafe-eval"]
futures-core-03-stream = ["dep:futures-util", "dep:futures-core"]
std = ["wasm-bindgen/std", "futures-util/std"]
unsafe-eval = []

[lib]
name = "js_sys"
path = "src/lib.rs"
test = false
doctest = false

[dependencies.cfg-if]
version = "1.0.0"
path = "../cfg-if"

[dependencies.futures-core]
version = "0.3.8"
optional = true
default-features = false
path = "../futures-core"

[dependencies.futures-util]
version = "0.3.31"
optional = true
default-features = false
path = "../futures-util"

[dependencies.wasm-bindgen]
version = "=0.2.129"
default-features = false
path = "../wasm-bindgen"

[lints.clippy]
large_enum_variant = "allow"
new_without_default = "allow"
overly_complex_bool_expr = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(js_sys_unstable_apis)",
    "cfg(wasm_bindgen_unstable_jspi)",
]
