# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71.0"
name = "log"
version = "0.4.34"
authors = ["The Rust Project Developers"]
build = false
exclude = ["rfcs/**/*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
A lightweight logging facade for Rust
"""
documentation = "https://docs.rs/log"
readme = "../../../docs/upstream/log-0.4.34/README.md"
keywords = ["logging"]
categories = ["development-tools::debugging"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/log"

[features]
alloc = []
kv = []
kv_serialization = ["kv_std", "serialization"]
kv_std = ["std", "kv"]
kv_sval = ["kv"]
kv_unstable = ["kv"]
kv_unstable_serialization = ["kv_serialization", "kv_unstable_std"]
kv_unstable_std = ["kv_std", "kv_unstable"]
kv_unstable_sval = ["kv_sval", "kv_unstable"]
max_level_debug = []
max_level_error = []
max_level_info = []
max_level_off = []
max_level_trace = []
max_level_warn = []
release_max_level_debug = []
release_max_level_error = []
release_max_level_info = []
release_max_level_off = []
release_max_level_trace = []
release_max_level_warn = []
serialization = ["data-serialization"]
std = ["alloc"]

[lib]
name = "log"
path = "src/lib.rs"

[dependencies.data-serialization]
version = "1.0.229"
optional = true
default-features = false
path = "../data-serialization"

