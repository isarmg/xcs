# Internal numeric component. All seven upstream origins: compliance/provenance.
[package]
name = "numeric"
version = "0.2.19"
edition = "2021"
rust-version = "1.60"
build = "build.rs"
license = "MIT OR Apache-2.0"
description = "Numeric traits and feature-separated exact numeric types"
autotests = false
autobenches = false
autoexamples = false
[features]
default = ["std"]
std = []
alloc = []
integer = []
iter = ["integer"]
complex = []
bigint = ["alloc", "integer"]
rational = ["integer"]
collection = ["integer", "iter", "complex", "rational"]
serialization = ["dep:data-serialization"]
[build-dependencies.autocfg]
version = "1"
path = "../autocfg"
[dependencies.data-serialization]
version = "1"
path = "../data-serialization"
default-features = false
optional = true

[[test]]
name = "traits_cast"
path = "../../../test/foundation/numeric/traits/tests/cast.rs"

[[test]]
name = "bigint_roots"
path = "../../../test/foundation/numeric/bigint/tests/roots.rs"
required-features = ["bigint"]

[[test]]
name = "bigint_modpow"
path = "../../../test/foundation/numeric/bigint/tests/modpow.rs"
required-features = ["bigint"]

[[test]]
name = "bigint_fuzzed"
path = "../../../test/foundation/numeric/bigint/tests/fuzzed.rs"
required-features = ["bigint"]

[[test]]
name = "bigint_biguint_scalar"
path = "../../../test/foundation/numeric/bigint/tests/biguint_scalar.rs"
required-features = ["bigint"]

[[test]]
name = "bigint_biguint"
path = "../../../test/foundation/numeric/bigint/tests/biguint.rs"
required-features = ["bigint"]

[[test]]
name = "bigint_bigint_scalar"
path = "../../../test/foundation/numeric/bigint/tests/bigint_scalar.rs"
required-features = ["bigint"]

[[test]]
name = "bigint_bigint_bitwise"
path = "../../../test/foundation/numeric/bigint/tests/bigint_bitwise.rs"
required-features = ["bigint"]

[[test]]
name = "bigint_bigint"
path = "../../../test/foundation/numeric/bigint/tests/bigint.rs"
required-features = ["bigint"]

[[test]]
name = "integer_roots"
path = "../../../test/foundation/numeric/integer/tests/roots.rs"
required-features = ["integer"]

[[test]]
name = "integer_average"
path = "../../../test/foundation/numeric/integer/tests/average.rs"
required-features = ["integer"]
