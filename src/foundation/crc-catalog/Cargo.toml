# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
name = "crc-catalog"
version = "2.5.0"
authors = ["Akhil Velagapudi <akhilvelagapudi@gmail.com>"]
build = false
exclude = ["generate_catalog.sh"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Catalog of CRC algorithms (generated from http://reveng.sourceforge.net/crc-catalogue) expressed as simple Rust structs."
readme = "../../../docs/upstream/crc-catalog-2.5.0/README.md"
keywords = ["crc"]
categories = [
    "no-std",
    "network-programming",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/akhilles/crc-catalog.git"

[lib]
name = "crc_catalog"
path = "src/lib.rs"
