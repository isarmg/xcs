# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
name = "miniz_oxide"
version = "0.9.1"
authors = [
    "Frommi <daniil.liferenko@gmail.com>",
    "oyvindln <oyvindln@users.noreply.github.com>",
    "Rich Geldreich richgel99@gmail.com",
]
build = false
exclude = [
    "benches/*",
    "tests/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "DEFLATE compression and decompression library rewritten in Rust based on miniz"
homepage = "https://github.com/Frommi/miniz_oxide/tree/master/miniz_oxide"
documentation = "https://docs.rs/miniz_oxide"
readme = "../../../docs/upstream/miniz_oxide-0.9.1/Readme.md"
keywords = [
    "zlib",
    "miniz",
    "deflate",
    "encoding",
]
categories = ["compression"]
license = "MIT OR Zlib OR Apache-2.0"
repository = "https://github.com/Frommi/miniz_oxide/tree/master/miniz_oxide"
resolver = "1"

[features]
block-boundary = []
default = ["with-alloc"]
rustc-dep-of-std = ["adler2/rustc-dep-of-std"]
simd = ["simd-adler32"]
std = ["serde?/std"]
with-alloc = []

[lib]
name = "miniz_oxide"
path = "src/lib.rs"

[dependencies.adler2]
version = "2.0"
default-features = false
path = "../adler2"

[dependencies.serde]
version = "1.0"
features = [
    "derive",
    "alloc",
]
optional = true
default-features = false
path = "../serde"

[dependencies.simd-adler32]
version = "0.3.8"
optional = true
default-features = false
path = "../simd-adler32"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(fuzzing)"]
