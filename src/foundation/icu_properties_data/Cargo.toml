# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
rust-version = "1.88"
name = "icu_properties_data"
version = "2.3.0"
authors = ["The ICU4X Project Developers"]
build = "build.rs"
include = [
    "data/**/*",
    "src/**/*",
    "examples/**/*",
    "benches/**/*",
    "tests/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "build.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Data for the icu_properties crate"
homepage = "https://icu4x.unicode.org"
readme = "../../../docs/upstream/icu_properties_data-2.3.0/README.md"
keywords = [
    "data",
    "unicode",
]
categories = [
    "internationalization",
    "localization",
    "no-std",
    "embedded",
]
license = "Unicode-3.0"
repository = "https://github.com/unicode-org/icu4x"
resolver = "2"

[lib]
name = "icu_properties_data"
path = "src/lib.rs"

[dependencies]

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(icu4x_custom_data)"]
