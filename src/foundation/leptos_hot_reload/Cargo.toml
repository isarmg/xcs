# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.88"
name = "leptos_hot_reload"
version = "0.8.7"
authors = ["Greg Johnston"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Utility types used for dev mode and hot-reloading for the Leptos web framework."
readme = "../../../docs/upstream/leptos_hot_reload-0.8.7/README.md"
license = "MIT"
repository = "https://github.com/leptos-rs/leptos"

[lib]
name = "leptos_hot_reload"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1.0"
default-features = true
path = "../anyhow"

[dependencies.camino]
version = "1.2"
default-features = true
path = "../camino"

[dependencies.indexmap]
version = "2.13"
default-features = true
path = "../indexmap"

[dependencies.or_poisoned]
path = "../or_poisoned"
version = "0.1.0"

[dependencies.proc-macro2]
version = "1.0"
features = [
    "span-locations",
    "nightly",
]
default-features = true
path = "../proc-macro2"

[dependencies.quote]
version = "1.0"
default-features = true
path = "../quote"

[dependencies.rstml]
version = "0.13.1"
default-features = true
path = "../rstml"

[dependencies.serde]
version = "1.0"
features = ["derive"]
default-features = true
path = "../serde"

[dependencies.syn]
version = "3.0"
features = [
    "full",
    "parsing",
    "extra-traits",
    "visit",
    "printing",
]
default-features = true
path = "../syn-3.0.9"

[dependencies.walkdir]
version = "2.5"
default-features = true

# Maintained independently of the enclosing application workspace.
path = "../walkdir"
