# Internal source component. Original manifest and origin: compliance/provenance.

[package]
name = "mime_guess"
version = "2.0.5"
authors = ["Austin Bonander <austin.bonander@gmail.com>"]
description = "A simple crate for detection of a file's MIME type by its extension."
documentation = "https://docs.rs/mime_guess/"
readme = "../../../../docs/upstream/mime_guess-2.0.5/README.md"
keywords = [
    "mime",
    "filesystem",
    "extension",
]
license = "MIT"
repository = "https://github.com/abonander/mime_guess"
autotests = false
autobenches = false
autoexamples = false

[dependencies.mime]
version = "0.3"
path = "../mime"

[dependencies.unicase]
version = "2.4.0"
path = "../../text-unicode/unicase"

[build-dependencies.unicase]
version = "2.4.0"
path = "../../text-unicode/unicase"

[features]
default = ["rev-mappings"]
rev-mappings = []
