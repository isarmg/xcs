# Original sources, versions and licenses: compliance/provenance and URL architecture notes.
[package]
name = "url-encoding"
version = "2.5.8"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "Capability-gated URL parsing, domain normalization and byte/form encoding"
autotests = false
autobenches = false
[lib]
name = "url_encoding"
path = "src/lib.rs"
[features]
default = ["std"]
alloc = []
std = ["alloc", "data-serialization?/std"]
form = ["alloc"]
domain = ["alloc", "unicode-normalizer/compiled_data", "unicode-properties/compiled_data", "dep:smallvec", "dep:utf8_iter"]
parser = ["domain", "form"]
serialization = ["parser", "dep:data-serialization", "data-serialization/derive"]
expose_internals = ["parser"]
[dependencies.unicode-normalizer]
path = "../../text-unicode/unicode-normalizer"
default-features = false
optional = true
[dependencies.unicode-properties]
path = "../../text-unicode/unicode-properties"
default-features = false
optional = true
[dependencies.smallvec]
path = "../../collections/smallvec"
features = ["const_generics"]
optional = true
[dependencies.utf8_iter]
path = "../../text-unicode/utf8_iter"
optional = true
[dependencies.data-serialization]
path = "../../data-storage/data-serialization"
default-features = false
optional = true
