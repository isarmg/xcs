# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.85"
name = "hyper-rustls"
version = "0.27.10"
build = false
include = [
    "Cargo.toml",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "LICENSE-ISC",
    "README.md",
    "src/**/*.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rustls+hyper integration for pure rust HTTPS"
homepage = "https://github.com/rustls/hyper-rustls"
documentation = "https://docs.rs/hyper-rustls/"
readme = "../../../../docs/upstream/hyper-rustls-0.27.10/README.md"
license = "Apache-2.0 OR ISC OR MIT"
repository = "https://github.com/rustls/hyper-rustls"

[features]
aws-lc-rs = ["rustls/aws_lc_rs"]
default = ["native-tokio", "http1", "tls12", "logging", "aws-lc-rs"]
fips = ["aws-lc-rs", "rustls/fips"]
http1 = ["http-transport/http1"]
logging = ["log", "tokio-rustls/logging", "rustls/logging"]
native-tokio = []
ring = ["rustls/ring"]
tls12 = ["tokio-rustls/tls12", "rustls/tls12"]
webpki-tokio = ["webpki-roots"]

[lib]
name = "hyper_rustls"
path = "src/lib.rs"

[dependencies.http]
version = "1"
path = "../http"

[dependencies.log]
version = "0.4.4"
optional = true
path = "../../diagnostics/log"

[dependencies.rustls]
version = "0.23"
default-features = false
path = "../rustls"

[dependencies.tokio]
version = "1.0"
path = "../../concurrency/tokio"

[dependencies.tokio-rustls]
version = "0.26"
default-features = false
path = "../tokio-rustls"

[dependencies.webpki-roots]
version = "1"
optional = true
path = "../webpki-roots"

[lints.clippy]
cloned_instead_of_copied = "warn"
manual_let_else = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
upper_case_acronyms = "warn"
use_self = "warn"

[lints.rust]
elided_lifetimes_in_paths = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(hyper_rustls_docsrs)"]
[dependencies.service-stack]
version = "0.5.3"
path = "../service-stack"
default-features = false

[dependencies.http-transport]
version = "1.12.0"
path = "../http-transport"
default-features = false
features = ["client-legacy", "tokio"]
