# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "rustls"
version = "0.23.46"
build = "build.rs"
exclude = [
    "src/testdata",
    "tests/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rustls is a modern TLS library written in Rust."
homepage = "https://github.com/rustls/rustls"
readme = "../../../../docs/upstream/rustls-0.23.46/README.md"
categories = [
    "network-programming",
    "cryptography",
]
license = "Apache-2.0 OR ISC OR MIT"
repository = "https://github.com/rustls/rustls"

[features]
aws-lc-rs = ["aws_lc_rs"]
aws_lc_rs = ["webpki/aws-lc-rs"]
brotli = ["std"]
custom-provider = []
default = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"]
fips = ["aws_lc_rs", "webpki/aws-lc-rs-fips"]
logging = ["log"]
prefer-post-quantum = ["aws_lc_rs"]
read_buf = ["rustversion", "std"]
ring = ["dep:ring", "webpki/ring"]
std = ["webpki/std", "pki-types/std", "once_cell/std"]
tls12 = []

[lib]
name = "rustls"
path = "src/lib.rs"

[dependencies.log]
version = "0.4.8"
optional = true
path = "../../diagnostics/log"

[dependencies.once_cell]
version = "1.16"
features = [
    "alloc",
    "race",
]
default-features = false
path = "../../concurrency/once_cell"

[dependencies.pki-types]
version = "1.12"
features = ["alloc"]
package = "rustls-pki-types"
path = "../rustls-pki-types"

[dependencies.ring]
version = "0.17"
optional = true
path = "../../cryptography/ring"

[dependencies.subtle]
version = "2.5.0"
default-features = false
path = "../../cryptography/subtle"

[dependencies.webpki]
version = "0.103.14"
features = ["alloc"]
default-features = false
package = "rustls-webpki"
path = "../rustls-webpki"

[dependencies.zeroize]
version = "1.8"
path = "../../cryptography/zeroize"

[build-dependencies.rustversion]
version = "1.0.6"
optional = true
path = "../../tooling/rustversion"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(bench)",
    "cfg(coverage_nightly)",
    "cfg(read_buf)",
    "cfg(rustls_docsrs)",
]
