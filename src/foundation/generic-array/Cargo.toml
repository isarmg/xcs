# Internal source component. Original manifest and origin: compliance/provenance.

[package]
name = "generic-array"
version = "0.14.7"
authors = [
    "Bartłomiej Kamiński <fizyk20@gmail.com>",
    "Aaron Trent <novacrazy@gmail.com>",
]
include = [
    "src/**/*",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "build.rs",
]
description = "Generic types implementing functionality of arrays"
documentation = "http://fizyk20.github.io/generic-array/generic_array/"
readme = "../../../docs/upstream/generic-array-0.14.7/README.md"
keywords = [
    "generic",
    "array",
]
categories = [
    "data-structures",
    "no-std",
]
license = "MIT"
repository = "https://github.com/fizyk20/generic-array.git"
autotests = false
autobenches = false
autoexamples = false

[lib]
name = "generic_array"

[dependencies.data-serialization]
version = "1.0"
optional = true
default-features = false
path = "../data-serialization"

[dependencies.typenum]
version = "1.12"
path = "../typenum"

[dependencies.zeroize]
version = "1"
optional = true
default-features = false
path = "../zeroize"

[build-dependencies.version_check]
version = "0.9"
path = "../version_check"

[features]
serialization = ["dep:data-serialization"]
more_lengths = []

[badges.travis-ci]
repository = "fizyk20/generic-array"
