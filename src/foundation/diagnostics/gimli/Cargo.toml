# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.60"
name = "gimli"
version = "0.32.3"
build = false
include = [
    "/CHANGELOG.md",
    "/Cargo.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/src",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A library for reading and writing the DWARF debugging format."
documentation = "https://docs.rs/gimli"
readme = "../../../../docs/upstream/gimli-0.32.3/README.md"
keywords = [
    "DWARF",
    "debug",
    "ELF",
    "eh_frame",
]
categories = [
    "development-tools::debugging",
    "development-tools::profiling",
    "parser-implementations",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gimli-rs/gimli"
resolver = "2"

[features]
default = ["read-all", "write"]
endian-reader = ["read", "dep:stable_deref_trait"]
fallible-iterator = ["dep:fallible-iterator"]
read = ["read-core"]
read-all = ["read", "std", "fallible-iterator", "endian-reader"]
read-core = []
rustc-dep-of-std = []
std = ["fallible-iterator?/std", "stable_deref_trait?/std"]
write = ["dep:indexmap"]

[lib]
name = "gimli"
path = "src/lib.rs"

[dependencies.fallible-iterator]
version = "0.3.0"
optional = true
default-features = false
path = "../../collections/fallible-iterator"

[dependencies.indexmap]
version = "2.0.0"
optional = true
path = "../../collections/indexmap"

[dependencies.stable_deref_trait]
version = "1.1.0"
optional = true
default-features = false
path = "../../collections/stable_deref_trait"

