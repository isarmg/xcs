# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.68"
name = "anyhow"
version = "1.0.104"
authors = ["David Tolnay <dtolnay@gmail.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Flexible concrete Error type built on std::error::Error"
documentation = "https://docs.rs/anyhow"
readme = "../../../../docs/upstream/anyhow-1.0.104/README.md"
keywords = [
    "error",
    "error-handling",
]
categories = [
    "rust-patterns",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtolnay/anyhow"

[features]
backtrace = []
default = ["std"]
std = []

[lib]
name = "anyhow"
path = "src/lib.rs"

