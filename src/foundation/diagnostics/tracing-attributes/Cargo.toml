# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.65.0"
name = "tracing-attributes"
version = "0.1.31"
authors = [
    "Tokio Contributors <team@tokio.rs>",
    "Eliza Weisman <eliza@buoyant.io>",
    "David Barsky <dbarsky@amazon.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Procedural macro attributes for automatically instrumenting functions.
"""
homepage = "https://tokio.rs"
readme = "../../../../docs/upstream/tracing-attributes-0.1.31/README.md"
keywords = [
    "logging",
    "tracing",
    "macro",
    "instrument",
    "log",
]
categories = [
    "development-tools::debugging",
    "development-tools::profiling",
    "asynchronous",
]
license = "MIT"
repository = "https://github.com/tokio-rs/tracing"
resolver = "2"

[badges.maintenance]
status = "experimental"

[features]
async-await = []

[lib]
name = "tracing_attributes"
path = "src/lib.rs"
proc-macro = true

[dependencies.proc-macro2]
version = "1.0.60"
path = "../../code-generation/proc-macro2"

[dependencies.quote]
version = "1.0.20"
path = "../../code-generation/quote"

[dependencies.rust-syntax]
version = "3"
features = [
    "full",
    "parsing",
    "printing",
    "visit-mut",
    "clone-impls",
    "extra-traits",
    "proc-macro",
]
default-features = false
path = "../../code-generation/rust-syntax"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(flaky_tests)",
    "cfg(tracing_unstable)",
    "cfg(unsound_local_offset)",
]
