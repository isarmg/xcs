# Internal source component. Original manifest and origin: compliance/provenance.

[package]
name = "rustc-demangle"
version = "0.1.28"
authors = ["Alex Crichton <alex@alexcrichton.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Rust compiler symbol demangling.
"""
homepage = "https://github.com/rust-lang/rustc-demangle"
documentation = "https://docs.rs/rustc-demangle"
readme = "../../../../docs/upstream/rustc-demangle-0.1.28/README.md"
license = "MIT/Apache-2.0"
repository = "https://github.com/rust-lang/rustc-demangle"

[features]
compiler_builtins = []
rustc-dep-of-std = []
std = []

[lib]
name = "rustc_demangle"
path = "src/lib.rs"

