[package]
name = "terminal-style"
version = "1.0.14"
edition = "2021"
license = "MIT OR Apache-2.0"
autotests = false
[features]
default = []
std = []
parser = []
parser-core = ["parser", "dep:arrayvec"]
parser-utf8 = ["parser"]
output = ["std", "parser-utf8"]
[dependencies.arrayvec]
path = "../arrayvec"
optional = true
default-features = false
[lib]
doctest = false
[[test]]
name = "capabilities"
path = "../../../test/ci/fixtures/terminal-style-capabilities.rs"
