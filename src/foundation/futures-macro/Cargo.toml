# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.71"
name = "futures-macro"
version = "0.3.34"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
The futures-rs procedural macro implementations.
"""
homepage = "https://rust-lang.github.io/futures-rs"
readme = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/futures-rs"

[features]

[lib]
name = "futures_macro"
path = "src/lib.rs"
proc-macro = true

[dependencies.proc-macro2]
version = "1.0.60"
path = "../proc-macro2"

[dependencies.quote]
version = "1.0"
path = "../quote"

[dependencies.rust-syntax]
version = "3.0"
features = ["full"]
path = "../rust-syntax"

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unreachable_pub = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(futures_sanitizer)"]
