# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.61"
name = "crossbeam-epoch"
version = "0.9.21"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Epoch-based garbage collection"
homepage = "https://github.com/crossbeam-rs/crossbeam/tree/master/crossbeam-epoch"
readme = "../../../docs/upstream/crossbeam-epoch-0.9.21/README.md"
keywords = [
    "lock-free",
    "rcu",
    "atomic",
    "garbage",
]
categories = [
    "concurrency",
    "memory-management",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/crossbeam-rs/crossbeam"

[features]
alloc = []
default = ["std"]
nightly = ["crossbeam-utils/nightly"]
std = ["alloc", "crossbeam-utils/std"]

[lib]
name = "crossbeam_epoch"
path = "src/lib.rs"

[dependencies.crossbeam-utils]
version = "0.8.18"
default-features = false
path = "../crossbeam-utils"

[lints.clippy.declare_interior_mutable_const]
level = "allow"
priority = 1

[lints.clippy.lint_groups_priority]
level = "allow"
priority = 1

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(crossbeam_loom)",
    "cfg(crossbeam_sanitize)",
]
