# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "zmij"
version = "1.0.23"
authors = ["David Tolnay <dtolnay@gmail.com>"]
build = "build.rs"
exclude = ["*.png"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A double-to-string conversion algorithm based on Schubfach and xjb"
documentation = "https://docs.rs/zmij"
readme = "../../../docs/upstream/zmij-1.0.23/README.md"
keywords = ["float"]
categories = [
    "value-formatting",
    "no-std",
    "no-std::no-alloc",
]
license = "MIT"
repository = "https://github.com/dtolnay/zmij"

[lib]
name = "zmij"
path = "src/lib.rs"

