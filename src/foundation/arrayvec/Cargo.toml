# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.51"
name = "arrayvec"
version = "0.7.8"
authors = ["bluss"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A vector with fixed capacity, backed by an array (it can be stored on the stack too). Implements fixed capacity ArrayVec and ArrayString."
documentation = "https://docs.rs/arrayvec/"
readme = "../../../docs/upstream/arrayvec-0.7.8/README.md"
keywords = [
    "stack",
    "vector",
    "array",
    "data-structure",
    "no_std",
]
categories = [
    "data-structures",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bluss/arrayvec"

[features]
default = ["std"]
std = []

[lib]
name = "arrayvec"
path = "src/lib.rs"

[dependencies.serde]
version = "1.0"
optional = true
default-features = false
path = "../serde"

[dependencies.zeroize]
version = "1.4"
optional = true
default-features = false
path = "../zeroize"

[build-dependencies]

