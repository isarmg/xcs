# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.77"
name = "rustc-hash"
version = "2.1.3"
authors = ["The Rust Project Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A speedy, non-cryptographic hashing algorithm used by rustc"
readme = "../../../docs/upstream/rustc-hash-2.1.3/README.md"
keywords = [
    "hash",
    "hasher",
    "fxhash",
    "rustc",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/rust-lang/rustc-hash"

[features]
default = ["std"]
nightly = []
rand = ["std"]
std = []

[lib]
name = "rustc_hash"
path = "src/lib.rs"

