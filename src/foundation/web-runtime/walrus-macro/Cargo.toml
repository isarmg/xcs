# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
name = "walrus-macro"
version = "0.26.0"
authors = ["Nick Fitzgerald <fitzgen@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Internal macros used by the `walrus` crate, not for public consumption.
"""
homepage = "https://github.com/rustwasm/walrus"
documentation = "https://docs.rs/walrus-macro"
readme = false
categories = ["wasm"]
license = "MIT/Apache-2.0"
repository = "https://github.com/rustwasm/walrus/tree/crates/macro"

[lib]
name = "walrus_macro"
path = "src/lib.rs"
proc-macro = true

[dependencies.heck]
version = "0.5.0"
path = "../../text-unicode/heck"

[dependencies.proc-macro2]
version = "1.0.106"
path = "../../code-generation/proc-macro2"

[dependencies.quote]
version = "1.0.45"
path = "../../code-generation/quote"

[dependencies.rust-syntax]
version = "3"
features = ["extra-traits"]
path = "../../code-generation/rust-syntax"
