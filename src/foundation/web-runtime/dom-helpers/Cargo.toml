# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.88"
name = "dom-helpers"
version = "0.8.8"
authors = ["Greg Johnston"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "DOM operations for the Leptos web framework."
readme = false
license = "MIT"
repository = "https://github.com/leptos-rs/leptos"

[features]
serialization = ["dep:data-serialization"]
default = []
trace-component-props = ["dep:data-serialization", "dep:json-codec", "dep:tracing"]
tracing = ["dep:tracing"]

[lib]
name = "dom_helpers"
path = "src/lib.rs"

[dependencies.js-sys]
version = "0.3"
default-features = true
path = "../js-sys"

[dependencies.or_poisoned]
path = "../../concurrency/or_poisoned"
version = "0.1.0"

[dependencies.reactive-state]
path = "../reactive-state"
version = "0.2.13"

[dependencies.send_wrapper]
version = "0.6"
default-features = true
path = "../../concurrency/send_wrapper"

[dependencies.data-serialization]
version = "1.0"
optional = true
default-features = true
path = "../../data-storage/data-serialization"

[dependencies.json-codec]
version = "1.0"
optional = true
default-features = true
path = "../../data-storage/json-codec"

[dependencies.view-renderer]
path = "../view-renderer"
version = "0.2.12"

[dependencies.tracing]
version = "0.1"
optional = true
default-features = true
path = "../../diagnostics/tracing"

[dependencies.wasm-bindgen]
version = "0.2"
default-features = true
path = "../wasm-bindgen"

[dependencies.web-sys]
version = "0.3"
features = ["Location"]
default-features = true
path = "../web-sys"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(interface_debuginfo)"]

# Maintained independently of the enclosing application workspace.
