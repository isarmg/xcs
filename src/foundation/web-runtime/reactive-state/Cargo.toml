# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.88"
name = "reactive-state"
version = "0.2.16"
authors = ["Greg Johnston"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A fine-grained reactive graph for building user interfaces."
readme = "../../../../docs/upstream/reactive_graph-0.2.16/README.md"
license = "MIT"
repository = "https://github.com/leptos-rs/leptos"

[features]
effects = []
sandboxed-arenas = []
serialization = ["dep:data-serialization"]
tracing = ["dep:tracing"]

[lib]
name = "reactive_state"
path = "src/lib.rs"

[dependencies.task-dispatch]
path = "../../concurrency/task-dispatch"
version = "0.3.0"

[dependencies.async-notification]
path = "../../concurrency/async-notification"
default-features = true
features = ["locks"]

[dependencies.futures]
version = "0.3.34"
path = "../../concurrency/futures"
default-features = false
features = ["async-await-macro", "channel", "executor", "io", "shared-state", "sink", "std", "utilities"]

[dependencies.guardian]
version = "1.3"
default-features = true
path = "../../concurrency/guardian"

[dependencies.indexmap]
version = "2.13"
default-features = true
path = "../../collections/indexmap"

[dependencies.or_poisoned]
path = "../../concurrency/or_poisoned"
version = "0.1.0"

[dependencies.paste]
package = "pastey"
version = "=0.2.3"
default-features = true
path = "../../code-generation/pastey"

[dependencies.pin-project-lite]
version = "0.2"
default-features = true
path = "../../concurrency/pin-project-lite"

[dependencies.rustc-hash]
version = "2.1"
default-features = true
path = "../../core-types/rustc-hash"

[dependencies.send_wrapper]
version = "0.6"
features = ["futures"]
default-features = true
path = "../../concurrency/send_wrapper"

[dependencies.data-serialization]
version = "1.0"
features = ["derive"]
optional = true
default-features = true
path = "../../data-storage/data-serialization"

[dependencies.slotmap]
version = "1.1"
default-features = true
path = "../../collections/slotmap"

[dependencies.error-definition]
version = "2.0"
default-features = true
path = "../../diagnostics/error-definition"

[dependencies.tracing]
version = "0.1"
optional = true
default-features = true
path = "../../diagnostics/tracing"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.web-sys]
version = "0.3"
features = ["console"]
default-features = false
path = "../web-sys"

[dev-dependencies.typed-builder]
version = "0.23"
path = "../../code-generation/typed-builder"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(interface_debuginfo)",
]

# Maintained independently of the enclosing application workspace.
