# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.81"
name = "wasm-bindgen"
version = "0.2.129"
authors = ["The wasm-bindgen Developers"]
build = "build.rs"
include = [
    "/build.rs",
    "/LICENSE-*",
    "/src",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Easy support for interacting between JS and Rust.
"""
homepage = "https://wasm-bindgen.github.io/wasm-bindgen"
documentation = "https://docs.rs/wasm-bindgen"
readme = "../../../../docs/upstream/wasm-bindgen-0.2.129/README.md"
categories = ["wasm"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/wasm-bindgen/wasm-bindgen"

[features]
serialization = ["dep:data-serialization"]
default = ["std"]
enable-interning = ["std"]
gg-alloc = []
msrv = []
rustversion = []
serialization-serialize = ["serialization", "json-codec", "std"]
spans = []
std = []
strict-macro = ["wasm-binding-macros/strict-macro"]
xxx_debug_only_print_generated_code = []

[lib]
name = "wasm_bindgen"
path = "src/lib.rs"
test = false

[dependencies.cfg-if]
version = "1.0.0"
path = "../../tooling/cfg-if"

[dependencies.once_cell]
version = "1.12"
default-features = false
path = "../../concurrency/once_cell"

[dependencies.data-serialization]
version = "1.0"
optional = true
path = "../../data-storage/data-serialization"

[dependencies.json-codec]
version = "1.0"
optional = true
path = "../../data-storage/json-codec"

[dependencies.wasm-binding-macros]
version = "=0.2.129"
path = "../wasm-binding-macros"

[dependencies.wasm-bindgen-shared]
version = "=0.2.129"
path = "../wasm-bindgen-shared"

[build-dependencies.rustversion-compat]
version = "1.0.6"
package = "rustversion"
path = "../../tooling/rustversion"

[lints.clippy]
large_enum_variant = "allow"
new_without_default = "allow"
overly_complex_bool_expr = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
uninlined_format_args = "warn"

[lints.rust]
unused_lifetimes = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(wasm_bindgen_unstable_test_coverage)",
    "cfg(wasm_bindgen_use_js_sys)",
    "cfg(xxx_debug_only_print_generated_code)",
    "cfg(legacy_eh)",
    "cfg(tokio_unstable)",
    "cfg(wasm_bindgen_unstable_tokio)",
    "cfg(wasm_bindgen_unstable_jspi)",
]
