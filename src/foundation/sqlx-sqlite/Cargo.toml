# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.94.0"
name = "sqlx-sqlite"
version = "0.9.0"
authors = [
    "Ryan Leckey <leckey.ryan@gmail.com>",
    "Austin Bonander <austin.bonander@gmail.com>",
    "Chloe Ross <orangesnowfox@gmail.com>",
    "Daniel Akhterov <akhterovd@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "SQLite driver implementation for SQLx. Not for direct use; see the `sqlx` crate for details."
documentation = "https://docs.rs/sqlx"
readme = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/launchbadge/sqlx"

[features]
serialization = ["dep:data-serialization"]
_unstable-all-sqlite-features = ["deserialize", "load-extension", "preupdate-hook", "unlock-notify"]
_unstable-all-types = ["json", "uuid"]
bundled = ["libsqlite3-sys/bundled"]
deserialize = []
json = ["sqlx-core/json", "serialization"]
load-extension = []
offline = ["sqlx-core/offline", "serialization"]
preupdate-hook = ["libsqlite3-sys/preupdate_hook"]
regexp = ["dep:regex"]
unbundled = ["libsqlite3-sys/buildtime_bindgen"]
unlock-notify = ["libsqlite3-sys/unlock_notify"]
uuid = ["dep:uuid", "sqlx-core/uuid"]

[lib]
name = "sqlx_sqlite"
path = "src/lib.rs"

[dependencies.bytes]
version = "1.2.0"
path = "../bytes"

[dependencies.atoi]
version = "2.0"
path = "../atoi"

[dependencies.flume]
version = "0.12.0"
features = ["async"]
default-features = false
path = "../flume"

[dependencies.form_urlencoded]
version = "1.2.2"
path = "../form_urlencoded"

[dependencies.futures-channel]
version = "0.3.32"
features = [
    "sink",
    "alloc",
    "std",
]
default-features = false
path = "../futures-channel"

[dependencies.futures-core]
version = "0.3.32"
default-features = false
path = "../futures-core"

[dependencies.futures-executor]
version = "0.3.32"
path = "../futures-executor"

[dependencies.futures-intrusive]
version = "0.5.0"
path = "../futures-intrusive"

[dependencies.futures-util]
version = "0.3.32"
features = [
    "alloc",
    "sink",
]
default-features = false
path = "../futures-util"

[dependencies.libsqlite3-sys]
version = ">=0.30.1, <0.38.0"
features = [
    "pkg-config",
]
default-features = false
path = "../libsqlite3-sys"

[dependencies.log]
version = "0.4.18"
path = "../log"

[dependencies.percent-encoding]
version = "2.3.0"
path = "../percent-encoding"

[dependencies.regex]
version = "1.6.0"
optional = true
path = "../regex"

[dependencies.data-serialization]
version = "1.0.219"
features = ["derive"]
optional = true
path = "../data-serialization"

[dependencies.sqlx-core]
version = "=0.9.0"
path = "../sqlx-core"

[dependencies.thiserror]
version = "2.0.18"
features = ["std"]
default-features = false
path = "../thiserror"

[dependencies.tracing]
version = "0.1.37"
features = ["log"]
path = "../tracing"

[dependencies.url]
version = "2.2.2"
path = "../url"

[dependencies.uuid]
version = "1.12.1"
optional = true
path = "../uuid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
disallowed_methods = "deny"
