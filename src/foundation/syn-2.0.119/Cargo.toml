# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "syn"
version = "2.0.119"
authors = ["David Tolnay <dtolnay@gmail.com>"]
build = false
include = [
    "/benches/**",
    "/Cargo.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/src/**",
    "/tests/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Parser for Rust source code"
documentation = "https://docs.rs/syn"
readme = "../../../docs/upstream/syn-2.0.119/README.md"
keywords = [
    "macros",
    "syn",
]
categories = [
    "development-tools::procedural-macro-helpers",
    "parser-implementations",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtolnay/syn"

[features]
clone-impls = []
default = ["derive", "parsing", "printing", "clone-impls", "proc-macro"]
derive = []
extra-traits = []
fold = []
full = []
parsing = []
printing = ["dep:quote"]
proc-macro = ["proc-macro2/proc-macro", "quote?/proc-macro"]
test = []
visit = []
visit-mut = []

[lib]
name = "syn"
path = "src/lib.rs"

[dependencies.proc-macro2]
version = "1.0.91"
default-features = false
path = "../proc-macro2"

[dependencies.quote]
version = "1.0.35"
optional = true
default-features = false
path = "../quote"

[dependencies.unicode-ident]
version = "1"
path = "../unicode-ident"

