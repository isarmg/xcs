# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.61.0"
name = "camino"
version = "1.2.6"
authors = [
    "Without Boats <saoirse@without.boats>",
    "Ashley Williams <ashley666ashley@gmail.com>",
    "Steve Klabnik <steve@steveklabnik.com>",
    "Rain <rain@sunshowers.io>",
]
build = "build.rs"
include = [
    "/build.rs",
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "UTF-8 paths"
documentation = "https://docs.rs/camino"
readme = "../../../docs/upstream/camino-1.2.6/README.md"
keywords = [
    "paths",
    "utf8",
    "unicode",
    "filesystem",
]
categories = [
    "development-tools",
    "filesystem",
    "os",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/camino-rs/camino"

[features]
proptest1 = []
serde1 = ["dep:serde_core"]

[lib]
name = "camino"
path = "src/lib.rs"

[dependencies.serde_core]
version = "1"
optional = true
path = "../serde_core"

