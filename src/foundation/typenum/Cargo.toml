# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.41.0"
name = "typenum"
version = "1.20.1"
build = false
exclude = [
    "/.envrc",
    "/.github/",
    "/clippy.toml",
    "/flake.lock",
    "/flake.nix",
    "/justfile",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Typenum is a Rust library for type-level numbers evaluated at
    compile time. It currently supports bits, unsigned integers, and signed
    integers. It also provides a type-level array of type-level numbers, but its
    implementation is incomplete."""
documentation = "https://docs.rs/typenum"
readme = "../../../docs/upstream/typenum-1.20.1/README.md"
categories = ["no-std"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/paholg/typenum"

[features]
const-generics = []
i128 = []
scale_info = []
strict = []

[lib]
name = "typenum"
path = "src/lib.rs"

