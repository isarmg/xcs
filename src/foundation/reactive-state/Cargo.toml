# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.88"
name = "reactive-state"
version = "0.2.16"
authors = ["Greg Johnston"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A fine-grained reactive graph for building user interfaces."
readme = "../../../docs/upstream/reactive_graph-0.2.16/README.md"
license = "MIT"
repository = "https://github.com/leptos-rs/leptos"

[features]
effects = []
hydration = []
nightly = []
sandboxed-arenas = []
serde = ["dep:serde"]
subsecond = []
tracing = ["dep:tracing"]

[lib]
name = "reactive_state"
path = "src/lib.rs"

[dependencies.task-dispatch]
path = "../task-dispatch"
version = "0.3.0"

[dependencies.async-lock]
version = "3.4"
default-features = true
path = "../async-lock"

[dependencies.futures]
version = "0.3"
default-features = true
path = "../futures"

[dependencies.guardian]
version = "1.3"
default-features = true
path = "../guardian"

[dependencies.indexmap]
version = "2.13"
default-features = true
path = "../indexmap"

[dependencies.or_poisoned]
path = "../or_poisoned"
version = "0.1.0"

[dependencies.paste]
package = "pastey"
version = "=0.2.3"
default-features = true
path = "../pastey"

[dependencies.pin-project-lite]
version = "0.2"
default-features = true
path = "../pin-project-lite"

[dependencies.rustc-hash]
version = "2.1"
default-features = true
path = "../rustc-hash"

[dependencies.send_wrapper]
version = "0.6"
features = ["futures"]
default-features = true
path = "../send_wrapper"

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true
default-features = true
path = "../serde"

[dependencies.slotmap]
version = "1.1"
default-features = true
path = "../slotmap"

[dependencies.thiserror]
version = "2.0"
default-features = true
path = "../thiserror"

[dependencies.tracing]
version = "0.1"
optional = true
default-features = true
path = "../tracing"

[build-dependencies.rustc_version]
version = "0.4"
default-features = true
path = "../rustc_version"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.web-sys]
version = "0.3"
features = ["console"]
default-features = false
path = "../web-sys"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(interface_debuginfo)",
    "cfg(rustc_nightly)",
]

# Maintained independently of the enclosing application workspace.
