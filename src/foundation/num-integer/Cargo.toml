# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.31"
name = "num-integer"
version = "0.1.47"
authors = ["The Rust Project Developers"]
build = false
exclude = [
    "/ci/*",
    "/.github/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Integer traits and functions"
homepage = "https://github.com/rust-num/num-integer"
documentation = "https://docs.rs/num-integer"
readme = "../../../docs/upstream/num-integer-0.1.47/README.md"
keywords = [
    "mathematics",
    "numerics",
]
categories = [
    "algorithms",
    "science",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-num/num-integer"

[features]
default = ["std"]
i128 = []
std = ["num-traits/std"]

[lib]
name = "num_integer"
path = "src/lib.rs"

[dependencies.num-traits]
version = "0.2.11"
features = ["i128"]
default-features = false
path = "../num-traits"
