# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.60"
name = "num"
version = "0.4.3"
authors = ["The Rust Project Developers"]
exclude = [
    "/ci/*",
    "/.github/*",
]
description = """
A collection of numeric types and traits for Rust, including bigint,
complex, rational, range iterators, generic integers, and more!
"""
homepage = "https://github.com/rust-num/num"
documentation = "https://docs.rs/num"
readme = "../../../docs/upstream/num-0.4.3/README.md"
keywords = [
    "mathematics",
    "numerics",
    "bignum",
]
categories = [
    "algorithms",
    "data-structures",
    "science",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-num/num"
autotests = false
autobenches = false
autoexamples = false

[dependencies.num-bigint]
version = "0.4.5"
optional = true
default-features = false
path = "../num-bigint"

[dependencies.num-complex]
version = "0.4.6"
default-features = false
path = "../num-complex"

[dependencies.num-integer]
version = "0.1.46"
features = ["i128"]
default-features = false
path = "../num-integer"

[dependencies.num-iter]
version = "0.1.45"
features = ["i128"]
default-features = false
path = "../num-iter"

[dependencies.num-rational]
version = "0.4.2"
default-features = false
path = "../num-rational"

[dependencies.num-traits]
version = "0.2.19"
features = ["i128"]
default-features = false
path = "../num-traits"

[features]
alloc = ["dep:num-bigint", "num-rational/num-bigint"]
default = ["std"]
libm = ["num-complex/libm", "num-traits/libm"]
num-bigint = ["dep:num-bigint"]
rand = ["num-bigint/rand", "num-complex/rand"]
serialization = ["num-bigint/serialization", "num-complex/serialization", "num-rational/serialization"]
std = ["dep:num-bigint", "num-bigint/std", "num-complex/std", "num-integer/std", "num-iter/std", "num-rational/std", "num-rational/num-bigint-std", "num-traits/std"]
