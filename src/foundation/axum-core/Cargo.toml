# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.78"
name = "axum-core"
version = "0.5.6"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Core types and traits for axum"
homepage = "https://github.com/tokio-rs/axum"
readme = "../../../docs/upstream/axum-core-0.5.6/README.md"
keywords = [
    "http",
    "web",
    "framework",
]
categories = [
    "asynchronous",
    "network-programming",
    "web-programming",
]
license = "MIT"
repository = "https://github.com/tokio-rs/axum"

[features]
__private_docs = ["dep:tower-http"]
tracing = ["dep:tracing"]

[lib]
name = "axum_core"
path = "src/lib.rs"

[dependencies.bytes]
version = "1.2"
path = "../bytes"

[dependencies.futures-core]
version = "0.3"
path = "../futures-core"

[dependencies.http]
version = "1.0.0"
path = "../http"

[dependencies.http-body]
version = "1.0.0"
path = "../http-body"

[dependencies.http-body-util]
version = "0.1.0"
path = "../http-body-util"

[dependencies.mime]
version = "0.3.16"
path = "../mime"

[dependencies.pin-project-lite]
version = "0.2.7"
path = "../pin-project-lite"

[dependencies.sync_wrapper]
version = "1.0.0"
path = "../sync_wrapper"

[dependencies.tower-http]
version = "0.6.0"
features = ["limit"]
optional = true
path = "../tower-http"

[dependencies.tower-layer]
version = "0.3"
path = "../tower-layer"

[dependencies.tower-service]
version = "0.3"
path = "../tower-service"

[dependencies.tracing]
version = "0.1.37"
optional = true
default-features = false
path = "../tracing"

[lints.clippy]
await_holding_lock = "warn"
dbg_macro = "warn"
empty_enum = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
exit = "warn"
filter_map_next = "warn"
fn_params_excessive_bools = "warn"
if_let_mutex = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
must_use_candidate = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
option_option = "warn"
redundant_clone = "warn"
ref_option = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_self_not_must_use = "warn"
single_match_else = "warn"
str_to_string = "warn"
suboptimal_flops = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
type_complexity = "allow"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
use_self = "warn"
verbose_file_reads = "warn"

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.rust.rust_2018_idioms]
level = "warn"
priority = -1
