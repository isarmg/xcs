# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "unicode-ident"
version = "1.0.27"
authors = ["David Tolnay <dtolnay@gmail.com>"]
build = false
autolib = false
