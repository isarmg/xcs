    "development-tools::procedural-macro-helpers",
    "no-std",
    "no-std::no-alloc",
]
license = "(MIT OR Apache-2.0) AND Unicode-3.0"
repository = "https://github.com/dtolnay/unicode-ident"

[lib]
name = "unicode_ident"
path = "src/lib.rs"

