# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.71"
name = "strum"
version = "0.28.0"
authors = ["Peter Glotfelty <peter.glotfelty@microsoft.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Helpful macros for working with enums and strings"
homepage = "https://github.com/Peternator7/strum"
documentation = "https://docs.rs/strum"
readme = "../../../docs/upstream/strum-0.28.0/README.md"
keywords = [
    "enum",
    "string",
    "macros",
    "proc-macros",
]
categories = [
    "development-tools::procedural-macro-helpers",
    "parsing",
]
license = "MIT"
repository = "https://github.com/Peternator7/strum"

[badges.travis-ci]
repository = "Peternator7/strum"

[features]
default = ["std"]
derive = ["strum_macros"]
std = []

[lib]
name = "strum"
path = "src/lib.rs"

[dependencies.strum_macros]
version = "0.28"
optional = true
path = "../strum_macros"

