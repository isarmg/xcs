# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.65"
name = "regex-syntax"
version = "0.8.11"
authors = [
    "The Rust Project Developers",
    "Andrew Gallant <jamslam@gmail.com>",
]
build = false
include = [
    "/CHANGELOG.md",
    "/Cargo.toml",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/README.md",
    "/UNICODE.md",
    "bench/README.md",
    "src/**/*.rs",
    "testdata/**.toml",
    "tests/**/*.rs",
    "bench/**/*.rs",
    "benches/**/*.rs",
    "LICENSE-UNICODE",
    "!/tests/fuzz/mod.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A regular expression parser."
homepage = "https://github.com/rust-lang/regex/tree/master/regex-syntax"
documentation = "https://docs.rs/regex-syntax"
readme = "../../../docs/upstream/regex-syntax-0.8.11/README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/regex"

[features]
arbitrary = []
default = ["std", "unicode"]
std = []
unicode = ["unicode-age", "unicode-bool", "unicode-case", "unicode-gencat", "unicode-perl", "unicode-script", "unicode-segment"]
unicode-age = []
unicode-bool = []
unicode-case = []
unicode-gencat = []
unicode-perl = []
unicode-script = []
unicode-segment = []

[lib]
name = "regex_syntax"
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
check-cfg = ["cfg(docsrs_regex)"]
