# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
name = "blake3"
version = "1.8.7"
authors = [
    "Jack O'Connor <oconnor663@gmail.com>",
    "Samuel Neves",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "the BLAKE3 hash function"
documentation = "https://docs.rs/blake3"
readme = "../../../docs/upstream/blake3-1.8.7/README.md"
license = "CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/BLAKE3-team/BLAKE3"

[features]
serialization = ["dep:data-serialization"]
default = ["std"]
cryptographic-core = ["dep:cryptographic-core"]
mmap = ["std"]
neon = []
no_avx2 = []
no_avx512 = []
no_neon = []
no_sse2 = []
no_sse41 = []
prefer_intrinsics = []
pure = []
rayon = ["dep:rayon-core"]
std = ["constant_time_eq/std"]
traits-preview = ["dep:cryptographic-core"]
wasm32_simd = []
zeroize = ["dep:zeroize", "arrayvec/zeroize"]

[lib]
name = "blake3"
path = "src/lib.rs"

[dependencies.arrayvec]
version = "0.7.4"
default-features = false
path = "../arrayvec"

[dependencies.cfg-if]
version = "1.0.0"
path = "../cfg-if"

[dependencies.constant_time_eq]
version = "0.4.2"
default-features = false
path = "../constant_time_eq"

[dependencies.cryptographic-core]
version = "0.11.2"
features = ["mac"]
optional = true
path = "../cryptographic-core"

[dependencies.rayon-core]
version = "1.12.1"
optional = true
path = "../rayon-core"

[dependencies.data-serialization]
version = "1.0"
features = ["derive"]
optional = true
default-features = false
path = "../data-serialization"

[dependencies.zeroize]
version = "1"
optional = true
default-features = false
path = "../zeroize"

[build-dependencies.cc]
version = "1.1.12"
path = "../cc"

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies.cpu-feature-detect]
version = "0.3.0"
path = "../cpu-feature-detect"
