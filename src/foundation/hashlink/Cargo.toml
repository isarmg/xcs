# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.65"
name = "hashlink"
version = "0.11.1"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "HashMap-like containers that hold their key-value pairs in a user controllable order"
documentation = "https://docs.rs/hashlink"
readme = "../../../docs/upstream/hashlink-0.11.1/README.md"
keywords = [
    "data-structures",
    "no_std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/djc/hashlink"

[features]
serde_impl = ["serde"]

[lib]
name = "hashlink"
path = "src/lib.rs"

[dependencies.hash-table]
version = "0.17.1"
features = ["default-hasher"]
default-features = false
path = "../hash-table"

[dependencies.serde]
version = "1.0"
optional = true
default-features = false
path = "../serde"

