# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.71"
name = "futures-util"
version = "0.3.34"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Common utilities and extension traits for the futures-rs library.
"""
homepage = "https://rust-lang.github.io/futures-rs"
readme = "../../../docs/upstream/futures-util-0.3.34/README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/futures-rs"

[features]
alloc = ["futures-core/alloc", "futures-task/alloc", "slab"]
async-await = []
async-await-macro = ["async-await", "futures-macro"]
bilock = []
cfg-target-has-atomic = []
channel = ["std", "futures-channel"]
compat = ["std", "libc"]
default = ["std", "async-await", "async-await-macro"]
io = ["std", "futures-io", "memchr"]
io-compat = ["io", "compat", "libc"]
sink = ["futures-sink"]
std = ["alloc", "futures-core/std", "futures-task/std", "slab/std"]
unstable = ["futures-core/unstable", "futures-task/unstable"]
write-all-vectored = ["io"]

[lib]
name = "futures_util"
path = "src/lib.rs"

[dependencies.futures-channel]
version = "0.3.34"
features = ["std"]
optional = true
default-features = false
path = "../futures-channel"

[dependencies.futures-core]
version = "0.3.34"
default-features = false
path = "../futures-core"

[dependencies.futures-io]
version = "0.3.34"
features = ["std"]
optional = true
default-features = false
path = "../futures-io"

[dependencies.futures-macro]
version = "=0.3.34"
optional = true
default-features = false
path = "../futures-macro"

[dependencies.futures-sink]
version = "0.3.34"
optional = true
default-features = false
path = "../futures-sink"

[dependencies.futures-task]
version = "0.3.34"
default-features = false
path = "../futures-task"

[dependencies.libc]
version = "0.2.26"
optional = true
path = "../libc"

[dependencies.memchr]
version = "2.2"
optional = true
path = "../memchr"

[dependencies.pin-project-lite]
version = "0.2.6"
path = "../pin-project-lite"

[dependencies.slab]
version = "0.4.7"
optional = true
default-features = false
path = "../slab"

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unreachable_pub = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(futures_sanitizer)"]
