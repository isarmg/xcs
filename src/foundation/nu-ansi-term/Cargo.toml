# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.62.1"
name = "nu-ansi-term"
version = "0.50.3"
authors = [
    "ogham@bsago.me",
    "Ryan Scheel (Havvy) <ryan.havvy@gmail.com>",
    "Josh Triplett <josh@joshtriplett.org>",
    "The Nushell Project Developers",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Library for ANSI terminal colors and styles (bold, underline)"
readme = "../../../docs/upstream/nu-ansi-term-0.50.3/README.md"
license = "MIT"
repository = "https://github.com/nushell/nu-ansi-term"

[features]
serialization = ["dep:data-serialization"]
default = ["std"]
derive_serialization_style = ["serialization"]
gnu_legacy = []
std = []

[lib]
name = "nu_ansi_term"
path = "src/lib.rs"
doctest = true

[dependencies.data-serialization]
version = "1.0.152"
features = ["derive"]
optional = true
path = "../data-serialization"
