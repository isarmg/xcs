# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
name = "walrus"
version = "0.27.2"
authors = ["Nick Fitzgerald <fitzgen@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
A library for performing WebAssembly transformations
"""
homepage = "https://github.com/rustwasm/walrus"
documentation = "https://docs.rs/walrus"
readme = "../../../docs/upstream/walrus-0.27.2/README.md"
categories = ["wasm"]
license = "MIT/Apache-2.0"
repository = "https://github.com/rustwasm/walrus"

[features]
parallel = ["rayon", "id-arena/rayon"]

[lib]
name = "walrus"
path = "src/lib.rs"
bench = false

[dependencies.anyhow]
version = "1.0"
path = "../anyhow"

[dependencies.gimli]
version = "0.32.0"
path = "../gimli"

[dependencies.id-arena]
version = "2.3.0"
path = "../id-arena"

[dependencies.leb128]
version = "0.2.5"
path = "../leb128"

[dependencies.log]
version = "0.4.29"
path = "../log"

[dependencies.rayon]
version = "1.11.0"
optional = true
path = "../rayon"

[dependencies.walrus-macro]
version = "=0.26.0"
path = "../walrus-macro"

[dependencies.wasm-encoder]
version = "0.245.1"
path = "../wasm-encoder"

[dependencies.wasmparser]
version = "0.245.1"
path = "../wasmparser"

