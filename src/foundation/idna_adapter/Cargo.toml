# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2024"
rust-version = "1.86"
name = "idna_adapter"
version = "1.2.2"
authors = ["The rust-url developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Back end adapter for idna"
homepage = "https://docs.rs/crate/idna_adapter/latest"
documentation = "https://docs.rs/idna_adapter/latest/idna_adapter/"
readme = "../../../docs/upstream/idna_adapter-1.2.2/README.md"
keywords = [
    "unicode",
    "dns",
    "idna",
]
categories = [
    "no-std",
    "internationalization",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/hsivonen/idna_adapter"

[features]
compiled_data = ["unicode-normalizer/compiled_data", "unicode-properties/compiled_data"]

[lib]
name = "idna_adapter"
path = "src/lib.rs"

[dependencies.unicode-normalizer]
version = "2.2"
default-features = false
path = "../unicode-normalizer"

[dependencies.unicode-properties]
version = "2.2"
default-features = false
path = "../unicode-properties"
