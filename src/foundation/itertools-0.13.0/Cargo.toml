# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2018"
rust-version = "1.43.1"
name = "itertools"
version = "0.13.0"
authors = ["bluss"]
description = "Extra iterator adaptors, iterator methods, free functions, and macros."
documentation = "https://docs.rs/itertools/"
readme = "../../../docs/upstream/itertools-0.13.0/README.md"
keywords = [
    "iterator",
    "data-structure",
    "zip",
    "product",
]
categories = [
    "algorithms",
    "rust-patterns",
    "no-std",
    "no-std::no-alloc",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-itertools/itertools"
autotests = false
autobenches = false
autoexamples = false

[lib]
test = false
bench = false

[dependencies.either]
version = "1.0"
default-features = false
path = "../either"

[features]
default = ["use_std"]
use_alloc = []
use_std = ["use_alloc", "either/use_std"]
