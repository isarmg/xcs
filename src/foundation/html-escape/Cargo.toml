# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.58"
name = "html-escape"
version = "0.2.15"
authors = ["Magic Len <len@magiclen.org>"]
build = false
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "This library is for encoding/escaping special characters in HTML and decoding/unescaping HTML entities as well."
homepage = "https://magiclen.org/html-escape"
readme = "../../../docs/upstream/html-escape-0.2.15/README.md"
keywords = [
    "html",
    "escape",
    "unescape",
    "encode",
    "decode",
]
categories = [
    "no-std",
    "encoding",
]
license = "MIT"
repository = "https://github.com/magiclen/html-escape"

[features]
default = ["std"]
std = []

[lib]
name = "html_escape"
path = "src/lib.rs"

[dependencies]

