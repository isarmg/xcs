# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
rust-version = "1.83"
name = "crc"
version = "3.4.0"
authors = [
    "Rui Hu <code@mrhooray.com>",
    "Akhil Velagapudi <4@4khil.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust implementation of CRC with support of various standards"
documentation = "https://docs.rs/crc"
readme = "../../../docs/upstream/crc-3.4.0/README.md"
keywords = [
    "crc",
    "crc16",
    "crc32",
    "crc64",
    "hash",
]
categories = [
    "algorithms",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mrhooray/crc-rs.git"

[lib]
name = "crc"
path = "src/lib.rs"

[dependencies.crc-catalog]
version = "2.4.0"
path = "../crc-catalog"

