# Internal source component. Original manifest and origin: compliance/provenance.

[package]
edition = "2021"
name = "clang-sys"
version = "1.9.1"
authors = ["Kyle Mayes <kyle@mayeses.com>"]
build = "build.rs"
links = "clang"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust bindings for libclang."
documentation = "https://docs.rs/clang-sys"
readme = "../../../docs/upstream/clang-sys-1.9.1/README.md"
license = "Apache-2.0"
repository = "https://github.com/KyleMayes/clang-sys"

[features]
clang_10_0 = ["clang_9_0"]
clang_11_0 = ["clang_10_0"]
clang_12_0 = ["clang_11_0"]
clang_13_0 = ["clang_12_0"]
clang_14_0 = ["clang_13_0"]
clang_15_0 = ["clang_14_0"]
clang_16_0 = ["clang_15_0"]
clang_17_0 = ["clang_16_0"]
clang_18_0 = ["clang_17_0"]
clang_19_0 = ["clang_18_0"]
clang_20_0 = ["clang_19_0"]
clang_3_5 = []
clang_3_6 = ["clang_3_5"]
clang_3_7 = ["clang_3_6"]
clang_3_8 = ["clang_3_7"]
clang_3_9 = ["clang_3_8"]
clang_4_0 = ["clang_3_9"]
clang_5_0 = ["clang_4_0"]
clang_6_0 = ["clang_5_0"]
clang_7_0 = ["clang_6_0"]
clang_8_0 = ["clang_7_0"]
clang_9_0 = ["clang_8_0"]
libcpp = []
runtime = ["libloading"]
static = []

[lib]
name = "clang_sys"
path = "src/lib.rs"

[dependencies.glob]
version = "0.3"
path = "../glob"

[dependencies.libc]
version = "0.2.39"
default-features = false
path = "../libc"

[dependencies.libloading]
version = "0.8"
optional = true
path = "../libloading"

[build-dependencies.glob]
version = "0.3"
path = "../glob"
