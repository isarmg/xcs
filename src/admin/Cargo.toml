[package]
name = "storage-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "zxs"
path = "src/main.rs"

[dependencies]
authentication.workspace = true
platform-io.workspace = true
rustix.workspace = true
command-line = { workspace = true, features = ["env"] }
data-serialization.workspace = true
json-codec.workspace = true
tokio.workspace = true
tracing = { version = "0.1", features = ["collector-default", "env-filter"], path = "../foundation/tracing" }
storage-client = { path = "../client" }
storage-server = { path = "../server" }
storage-engine = { path = "../engine" }

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "cli_startup"
path = "../../test/admin/cli_startup.rs"
