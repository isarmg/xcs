[package]
name = "smb-vfs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["smb-sdk"]
smb-sdk = ["dep:bindgen"]

[dependencies]
blake3 = {version = "1.8.7", path = "../foundation/blake3"}
libc = {version = "0.2", path = "../foundation/libc"}
json-codec = {version = "1", path = "../foundation/json-codec"}
smb-protocol = { path = "../smb" }

[build-dependencies]
bindgen = { version = "0.72.1", optional = true, path = "../foundation/bindgen"}
json-codec = {version = "1", path = "../foundation/json-codec"}
