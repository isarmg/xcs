[package]
name = "storage-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"], path = "../foundation/reqwest"}
data-serialization.workspace = true
json-codec.workspace = true
error-definition.workspace = true
tokio = { version = "1.53.2", features = ["fs", "io-util"], path = "../foundation/tokio"}
tokio-util = { version = "0.7", features = ["io"], path = "../foundation/tokio-util"}
futures = { version = "0.3.34", path = "../foundation/futures", default-features = false, features = ["async-await-macro", "shared-state", "std", "utilities"] }
url-encoding = { path = "../foundation/url-encoding", default-features = false, features = ["std", "parser"] }
blake3.workspace = true
storage-contract = { path = "../contract" }
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"], path = "../foundation/tokio"}
rustls-webpki = { version = "0.103.16", features = ["ring"], path = "../foundation/rustls-webpki" }
rustls-pki-types = { version = "1", path = "../foundation/rustls-pki-types" }
webpki-roots = { version = "1.0.10", path = "../foundation/webpki-roots" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], path = "../foundation/rustls" }

[[test]]
name = "tls_trust_regression"
path = "../../test/client/integration/tls_trust_regression.rs"
