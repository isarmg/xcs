[package]
name = "web-app"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
web-interface = { path = "../interface" }
storage-contract = { path = "../contract" }
name-policy = { path = "../naming" }
system-entropy = { version = "0.4", features = ["wasm_js"], path = "../foundation/system-entropy"}
uuid = { version = "1", features = ["js"], path = "../foundation/uuid"}
json-codec = {version = "1", path = "../foundation/json-codec"}
wasm-bindgen = {version = "=0.2.129", path = "../foundation/wasm-bindgen"}
wasm-bindgen-futures = {version = "=0.4.79", path = "../foundation/wasm-bindgen-futures"}
js-sys = {version = "=0.3.106", path = "../foundation/js-sys"}
gloo-timers = { version = "0.3", features = ["futures"], path = "../foundation/gloo-timers"}
send_wrapper = {version = "0.6", path = "../foundation/send_wrapper"}
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Crypto", "AbortController", "AbortSignal", "Request", "RequestInit", "RequestMode", "RequestCredentials", "RequestRedirect", "Response", "ReadableStream", "ReadableStreamDefaultReader", "Headers", "UrlSearchParams", "Storage", "Event", "MouseEvent", "SubmitEvent", "console"], path = "../foundation/web-sys"}

[lints.rust]
unsafe_code = "forbid"
