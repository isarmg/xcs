[package]
name = "platform-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ZXS filesystem durability, SQLite index, and credential primitives"

[features]
# Retained multi-connection adapters for async embedders and diagnostics.
# The storage engine uses direct connections and does not enable this capability.
sqlite-pool = ["sqlite-access/pool", "dep:tokio"]

[dependencies]
blake3.workspace = true
futures = { version = "0.3.34", path = "../foundation/futures", default-features = false, features = ["executor", "std"] }
system-entropy = {version = "0.4", path = "../foundation/system-entropy"}
libc = {version = "0.2", path = "../foundation/libc"}
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"], path = "../foundation/libsqlite3-sys"}
rustix = { version = "1.1.5", features = ["fs", "process"], path = "../foundation/rustix"}
data-serialization.workspace = true
json-codec.workspace = true
sha2 = {version = "0.11.0", path = "../foundation/sha2"}
sqlite-access = { version = "=0.9.0", default-features = false, features = ["sqlite-bundled"], path = "../foundation/sqlite-access"}
tempfile.workspace = true
error-definition.workspace = true
tokio = { version = "1.53.2", default-features = false, features = ["rt"], optional = true, path = "../foundation/tokio"}
zeroize = {version = "1.8", path = "../foundation/zeroize"}

[dev-dependencies]
tokio = { version = "1.53.2", default-features = false, features = ["rt-multi-thread", "macros"], path = "../foundation/tokio" }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[test]]
name = "sqlite_foundation"
path = "../../test/platform/integration/sqlite_foundation.rs"
