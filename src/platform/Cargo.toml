[package]
name = "platform-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ZXS filesystem durability, SQLite index, and credential primitives"

[dependencies]
blake3.workspace = true
futures-executor = {version = "0.3", path = "../foundation/futures-executor"}
getrandom = {version = "0.4", path = "../foundation/getrandom-0.4.3"}
libc = {version = "0.2", path = "../foundation/libc"}
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"], path = "../foundation/libsqlite3-sys"}
rustix = { version = "1.1.5", features = ["fs", "process"], path = "../foundation/rustix"}
serde.workspace = true
serde_json.workspace = true
sha2 = {version = "0.11.0", path = "../foundation/sha2-0.11.1"}
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled"], path = "../foundation/sqlx"}
tempfile.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.2", features = ["fs", "rt-multi-thread", "macros", "sync", "time"], path = "../foundation/tokio"}
zeroize = {version = "1.8", path = "../foundation/zeroize"}

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
