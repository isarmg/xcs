<?xml-stylesheet type='text/css' href='diagram.css'?><svg xmlns='http://www.w3.org/2000/svg' width='1280' height='1280' viewBox='0 0 1280 1280' role='img' aria-labelledby='10-namespace-title 10-namespace-desc' data-scene='10-namespace'><title id='10-namespace-title'>新增、删除：目录保存完整组成</title><desc id='10-namespace-desc'>P1：切回 main 恢复报告和数据；选择方案甲显示报告和日志，两个分支不互相混入文件。 </desc><defs><marker id='10-namespace-arrow' markerWidth='10' markerHeight='10' refX='7' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M 0 0 L 8 4 L 0 8 Z' fill='#7b8ba2'/></marker><marker id='10-namespace-ref' markerWidth='10' markerHeight='10' refX='7' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M 0 0 L 8 4 L 0 8 Z' fill='#326bc4'/></marker></defs><rect width='1280' height='1280' rx='22' fill='#f7f9fc'/><path d='M 36 110 H 1244' stroke='#e3e9f1' stroke-width='1'/><text x='40' y='49' class='dg-title'>新增、删除：目录保存完整组成</text><text x='40' y='83' class='dg-subtitle'>P1：切回 main 恢复报告和数据；选择方案甲显示报告和日志，两个分支不互相混入文件。 </text><path class='dg-edge' data-parent='T1' data-child='T2' data-reference='false' d='M 355 568 V 401' fill='none' stroke='#7b8ba2' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' vector-effect='non-scaling-stroke' marker-end='url(#10-namespace-arrow)'/><rect x='301' y='465.5' width='108' height='28' rx='10' fill='#f7f9fc'/><text x='355' y='484.5' class='dg-edge-label'>删除目录条目</text><path class='dg-edge' data-parent='T0' data-child='T1' data-reference='false' d='M 355 968 V 801' fill='none' stroke='#7b8ba2' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' vector-effect='non-scaling-stroke' marker-end='url(#10-namespace-arrow)'/><rect x='301' y='865.5' width='108' height='28' rx='10' fill='#f7f9fc'/><text x='355' y='884.5' class='dg-edge-label'>新增日志文件</text><g class='dg-node' data-node='T2' data-x='70' data-y='170' data-width='570' data-height='224' data-head='false'><rect x='70' y='170' width='570' height='224' rx='18' fill='white' stroke='#8