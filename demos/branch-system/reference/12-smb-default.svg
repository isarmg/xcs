<?xml-stylesheet type='text/css' href='diagram.css'?><svg xmlns='http://www.w3.org/2000/svg' width='1280' height='960' viewBox='0 0 1280 960' role='img' aria-labelledby='12-smb-default-title 12-smb-default-desc' data-scene='12-smb-default'><title id='12-smb-default-title'>SMB 默认主分支：用户可以选择方案甲</title><desc id='12-smb-default-desc'>蓝色标记表示默认入口。切换入口不创建正文或子树；后续新打开的操作使用选定视图。 </desc><defs><marker id='12-smb-default-arrow' markerWidth='10' markerHeight='10' refX='7' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M 0 0 L 8 4 L 0 8 Z' fill='#7b8ba2'/></marker><marker id='12-smb-default-ref' markerWidth='10' markerHeight='10' refX='7' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M 0 0 L 8 4 L 0 8 Z' fill='#326bc4'/></marker></defs><rect width='1280' height='960' rx='22' fill='#f7f9fc'/><path d='M 36 110 H 1244' stroke='#e3e9f1' stroke-width='1'/><text x='40' y='49' class='dg-title'>SMB 默认主分支：用户可以选择方案甲</text><text x='40' y='83' class='dg-subtitle'>蓝色标记表示默认入口。切换入口不创建正文或子树；后续新打开的操作使用选定视图。 </text><path class='dg-edge' data-parent='T0' data-child='T1' data-reference='false' d='M 640 638 V 421' fill='none' stroke='#7b8ba2' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' vector-effect='non-scaling-stroke' marker-end='url(#12-smb-default-arrow)'/><rect x='565' y='510.5' width='150' height='28' rx='10' fill='#f7f9fc'/><text x='640' y='529.5' class='dg-edge-label'>此前已有的子树演进</text><g class='dg-node' data-node='T1' data-x='390' data-y='190' data-width='500' data-height='224' data-head='false'><rect x='390' y='190' width='500' height='224' rx='18' fill='white' stroke='#d9e2ee' stroke-width='1.5'/><rect x='391' y='214' width='5' height='176' rx='2.5' fill='#65758b'/><text x='414' y='217' class='dg-kind'>已有子树，不是本次新建</text><text x='414' y='255' class='dg-node-title'>T1 · 项目目录</text><rect x='818' y='200' width='56' height='23' rx='7' fill='#f2f5f9'/><text x='828' y='216' class='dg-badge' fill='#65758b'>方案甲</text><rect x='410' y='274' width='460' h