<?xml-stylesheet type='text/css' href='diagram.css'?><svg xmlns='http://www.w3.org/2000/svg' width='1280' height='960' viewBox='0 0 1280 960' role='img' aria-labelledby='27-backup-prefix-title 27-backup-prefix-desc' data-scene='27-backup-prefix'><title id='27-backup-prefix-title'>三份保存：每个备份盘独立逻辑前缀</title><desc id='27-backup-prefix-desc'>前缀由用户指定；主盘移动或改名不会把真实主盘路径写进备份前缀。</desc><defs><marker id='27-backup-prefix-arrow' markerWidth='10' markerHeight='10' refX='7' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M 0 0 L 8 4 L 0 8 Z' fill='#7b8ba2'/></marker><marker id='27-backup-prefix-ref' markerWidth='10' markerHeight='10' refX='7' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M 0 0 L 8 4 L 0 8 Z' fill='#326bc4'/></marker></defs><rect width='1280' height='960' rx='22' fill='#f7f9fc'/><path d='M 36 110 H 1244' stroke='#e3e9f1' stroke-width='1'/><text x='40' y='49' class='dg-title'>三份保存：每个备份盘独立逻辑前缀</text><text x='40' y='83' class='dg-subtitle'>前缀由用户指定；主盘移动或改名不会把真实主盘路径写进备份前缀。</text><g class='dg-node' data-node='P' data-x='55' data-y='210' data-width='1170' data-height='156' data-head='false'><rect x='55' y='210' width='1170' height='156' rx='18' fill='white' stroke='#d9e2ee' stroke-width='1.5'/><rect x='56' y='234' width='5' height='108' rx='2.5' fill='#65758b'/><text x='79' y='237' class='dg-kind'>实际文件容器</text><text x='79' y='275' class='dg-node-title'>主盘 P01 · 工作/客户甲/项目/图纸/a.svg</text><rect x='1103' y='220' width='106' height='23' rx='7' fill='#f2f5f9'/><text x='1113' y='236' class='dg-badge' fill='#65758b'>3 份包含这一份</text><text x='84' y='315' class='dg-row' fill='#65758b'>策略目录：工作/客户甲/项目；相对路径：图纸/a.svg</text></g><g class='dg-node' data-node='B' data-x='55' data-y='510' data-width='550' data-height='190' data-head='false'><rect x='55' y='510' width='550' height='190' rx='18' fill='white' stroke='#d9e2ee' stroke-width='1.5'/><rect x='56' y='534' width='5' height='142' rx='2.5' fill='#7753c6'/><text x='79' y='537' class='dg-kind'>用户前缀：档案/项目</text><text x='79' y='575' class='dg-node-title'>备份 B01</text><rect x='521' y='520' width='68' height='23' rx='7' fill='#f2edfc'/><text x='531' y='536' class='dg-badge' fill='#7753c6'>独立配置</text><rect x='75' y='594' width='510' height='29' rx='7' fill='#f2edfc'/><text x='84' y='615' class='dg-row' fill='#7753c6'>档案/项目/图纸/a.svg</text><text x='84' y='649' class='dg-row' fill='#65758b'>保留同一版本 ID 和正文证明</text></g><g class='dg-node' data-node='C' data-x='675' data-y='510' data-width='550' data-height='190' data-head='false'><rect x='675' y='510' width='550' height='190' rx='18' fill='white' stroke='#d9e2ee' stroke-width='1.5'/><rect x='676' y='534' width='5' height='142' rx='2.5' fill='#7753c6'/><text x='699' y='537' class='dg-kind'>用户前缀：离线/项目</text><text x='699' y='575' class='dg-node-title'>备份 C01</text><rect x='1141' y='520' width='68' height='23' rx='7' fill='#f2edfc'/><text x='1151' y='536' class='dg-badge' fill='#7753c6'>独立配置</text><rect x='695' y='594' width='510' height='29' rx='7' fill='#f2edfc'/><text x='704' y='615' class='dg-row' fill='#7753c6'>离线/项目/图纸/a.svg</text><text x='704' y='649' class='dg-row' fill='#65758b'>不是主盘真实路径的拼接</text></g><rect x='55' y='800' width='1170' height='98' rx='16' fill='#edf1f7'/><text x='75' y='833' class='dg-note-title'>绑定持久化</text><text x='75' y='868' class='dg-note-row'>移动主盘文件后仍保持已设置的份数和副本路径。显式修改配置时才重设前缀和路径。</text><circle cx='45' cy='925' r='5' fill='#16845d'/><text x='59' y='930' class='dg-legend'>本次新增节点</text><circle cx='240' cy='925' r='5' fill='#65758b'/><text x='254' y='930' class='dg-legend'>已有 / 复用节点</text><circle cx='470' cy='925' r='5' fill='#7753c6'/><text x='484' y='930' class='dg-legend'>明确选中的引用</text><circle cx='700' cy='925' r='5' fill='#326bc4'/><text x='714' y='930' class='dg-legend'>分支标签 / 默认入口</text><text x='1245' y='930' class='dg-legend' text-anchor='end'>子节点在上 · 父节点在下</text></svg>