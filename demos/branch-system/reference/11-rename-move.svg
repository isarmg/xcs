<?xml-stylesheet type='text/css' href='diagram.css'?><svg xmlns='http://www.w3.org/2000/svg' width='1280' height='960' viewBox='0 0 1280 960' role='img' aria-labelledby='11-rename-move-title 11-rename-move-desc' data-scene='11-rename-move'><title id='11-rename-move-title'>只在选中分支改名：文件身份和正文不变</title><desc id='11-rename-move-desc'>在方案甲将报告改名为客户报告，未选 main 仍保留原名称。文件身份 A、节点 F1 和正文继续复用。 </desc><defs><marker id='11-rename-move-arrow' markerWidth='10' markerHeight='10' refX='7' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M 0 0 L 8 4 L 0 8 Z' fill='#7b8ba2'/></marker><marker id='11-rename-move-ref' markerWidth='10' markerHeight='10' refX='7' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M 0 0 L 8 4 L 0 8 Z' fill='#326bc4'/></marker></defs><rect width='1280' height='960' rx='22' fill='#f7f9fc'/><path d='M 36 110 H 1244' stroke='#e3e9f1' stroke-width='1'/><text x='40' y='49' class='dg-title'>只在选中分支改名：文件身份和正文不变</text><text x='40' y='83' class='dg-subtitle'>在方案甲将报告改名为客户报告，未选 main 仍保留原名称。文件身份 A、节点 F1 和正文继续复用。 </text><text x='320' y='147' class='dg-lane'>仅选中分支的名称形成新子树</text><text x='960' y='147' class='dg-lane'>仍然是同一个文件</text><path class='dg-edge' data-parent='T0' data-child='T1' data-reference='false' d='M 320 648 V 436' fill='none' stroke='#7b8ba2' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' vector-effect='non-scaling-stroke' marker-end='url(#11-rename-move-arrow)'/><rect x='252' y='523' width='136' height='28' rx='10' fill='#f7f9fc'/><text x='320' y='542' class='dg-edge-label'>仅在方案甲重命名</text><g class='dg-node' data-node='T1' data-x='45' data-y='205' data-width='550' data-height='224' data-head='false'><rect x='45' y='205' width='550' height='224' rx='18' fill='white' stroke='#8ecdb1' stroke-width='1.5'/><rect x='46' y='229' width='5' height='176' rx='2.5' fill='#16845d'/><text x='69' y='232' class='dg-kind'>本次新增目录子树</text><text x='69' y='270' class='dg-node-title'>T1 · 项目目录</text><rect x='499' y='215' width='80' height='23' rx='7' fill='#e8f7ef'/><text x='509' y='231' class='dg-badge' fill='#16845d'>方案甲当前</text><rect x='65' y='289' width='510' height='29' rx='7' fill='#f2edfc'/><text x='74' y='310' class='dg-row' fill='#7753c6'>客户报告.docx → F1</text><text x='74' y='344' class='dg-row' fill='#65758b'>归档 / → S0　复用</text><text x='74' y='378' class='dg-row' fill='#65758b'>文件身份 A 保持不变</text></g><g class='dg-node' data-node='T0' data-x='45' data-y='650' data-width='550' data-height='224' data-head='false'><rect x='45' y='650' width='550' height='224' rx='18' fill='white' stroke='#d9e2ee' stroke-width='1.5'/><rect x='46' y='674' width='5' height='176' rx='2.5' fill='#65758b'/><text x='69' y='677' class='dg-kind'>父目录子树</text><text x='69' y='715' class='dg-node-title'>T0 · 项目目录</text><rect x='500' y='660' width='79' height='23' rx='7' fill='#f2f5f9'/><text x='510' y='676' class='dg-badge' fill='#65758b'>main 当前</text><text x='74' y='755' class='dg-row' fill='#65758b'>报告.docx → F1</text><text x='74' y='789' class='dg-row' fill='#65758b'>归档 / → 空目录 S0</text><text x='74' y='823' class='dg-row' fill='#65758b'>文件身份 A</text></g><g class='dg-node' data-node='F1' data-x='685' data-y='650' data-width='550' data-height='224' data-head='false'><rect x='685' y='650' width='550' height='224' rx='18' fill='white' stroke='#d9e2ee' stroke-width='1.5'/><rect x='686' y='674' width='5' height='176' rx='2.5' fill='#65758b'/><text x='709' y='677' class='dg-kind'>继续复用的文件节点</text><text x='709' y='715' class='dg-node-title'>F1 · 文件身份 A</text><rect x='1113' y='660' width='106' height='23' rx='7' fill='#f2f5f9'/><text x='1123' y='676' class='dg-badge' fill='#65758b'>正文节点新增 0</text><text x='714' y='755' class='dg-row' fill='#65758b'>原完整正文</text><text x='714' y='789' class='dg-row' fill='#65758b'>稳定文件身份不因改名重建</text><text x='714' y='823' class='dg-row' fill='#65758b'>内部版本存储名保持不变</text></g><rect x='730' y='235' width='460' height='160' rx='16' fill='#edf1f7'/><text x='750' y='268' class='dg-note-title'>下载名取当前目录视图</text><text x='750' y='303' class='dg-note-row'>main：报告.docx</text><text x='750' y='334' class='dg-note-row'>方案甲：客户报告.docx</text><text x='750' y='365' class='dg-note-row'>历史子树仍保留各自名称</text><circle cx='45' cy='925' r='5' fill='#16845d'/><text x='59' y='930' class='dg-legend'>本次新增节点</text><circle cx='240' cy='925' r='5' fill='#65758b'/><text x='254' y='930' class='dg-legend'>已有 / 复用节点</text><circle cx='470' cy='925' r='5' fill='#7753c6'/><text x='484' y='930' class='dg-legend'>明确选中的引用</text><circle cx='700' cy='925' r='5' fill='#326bc4'/><text x='714' y='930' class='dg-legend'>分支标签 / 默认入口</text><text x='1245' y='930' class='dg-legend' text-anchor='end'>子节点在上 · 父节点在下</text></svg>