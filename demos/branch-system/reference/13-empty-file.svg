<?xml-stylesheet type='text/css' href='diagram.css'?><svg xmlns='http://www.w3.org/2000/svg' width='1280' height='960' viewBox='0 0 1280 960' role='img' aria-labelledby='13-empty-file-title 13-empty-file-desc' data-scene='13-empty-file'><title id='13-empty-file-title'>真正提交空文件：0 字节也是真实新版本</title><desc id='13-empty-file-desc'>新建分支时没有空占位文件。这里的 F2 来自用户实际提交“清空文件”，因此是完整的真实版本。 </desc><defs><marker id='13-empty-file-arrow' markerWidth='10' markerHeight='10' refX='7' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M 0 0 L 8 4 L 0 8 Z' fill='#7b8ba2'/></marker><marker id='13-empty-file-ref' markerWidth='10' markerHeight='10' refX='7' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M 0 0 L 8 4 L 0 8 Z' fill='#326bc4'/></marker></defs><rect width='1280' height='960' rx='22' fill='#f7f9fc'/><path d='M 36 110 H 1244' stroke='#e3e9f1' stroke-width='1'/><text x='40' y='49' class='dg-title'>真正提交空文件：0 字节也是真实新版本</text><text x='40' y='83' class='dg-subtitle'>新建分支时没有空占位文件。这里的 F2 来自用户实际提交“清空文件”，因此是完整的真实版本。 </text><path class='dg-edge' data-parent='F1' data-child='F2' data-reference='false' d='M 640 638 V 421' fill='none' stroke='#7b8ba2' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' vector-effect='non-scaling-stroke' marker-end='url(#13-empty-file-arrow)'/><rect x='558' y='510.5' width='164' height='28' rx='10' fill='#f7f9fc'/><text x='640' y='529.5' class='dg-edge-label'>用户实际提交清空操作</text><g class='dg-node' data-node='F2' data-x='390' data-y='190' data-width='500' data-height='224' data-head='false'><rect x='390' y='190' width='500' height='224' rx='18' fill='white' stroke='#8ecdb1' stroke-width='1.5'/><rect x='391' y='214' width='5' height='176' rx='2.5' fill='#16845d'/><text x='414' y='217' class='dg-kind'>本次新增文件节点</text><text x='414' y='255' class='dg-node-title'>F2 · 报告.docx</text><rect x='752' y='200' width='122' height='23' rx='7' fill='#e8f7ef'/><text x='762' y='216' class='dg-badge' fill='#16845d'>方案甲-7c2a 当前</text><rect x='410' y='274' width='460' height='29' rx='7' fill='#e8f7ef'/><text x='419' y='295' class='dg-row' fill='#16845d'>真实内容长度：0 字节</text><text x='419' y='329' class='dg-row' fill='#65758b'>来源：20 字节的 F1</text><rect x='410' y='342' width='460' height='29' rx='7' fill='#e8f7ef'/><text x='419' y='363' class='dg-row' fill='#16845d'>已成功提交，不是占位文件</text></g><g class='dg-node' data-node='F1' data-x='390' data-y='640' data-width='500' data-height='224' data-head='false'><rect x='390' y='640' width='500' height='224' rx='18' fill='white' stroke='#d9e2ee' stroke-width='1.5'/><rect x='391' y='664' width='5' height='176' rx='2.5' fill='#65758b'/><text x='414' y='667' class='dg-kind'>父文件节点</text><text x='414' y='705' class='dg-node-title'>F1 · 报告.docx</text><rect x='795' y='650' width='79' height='23' rx='7' fill='#f2f5f9'/><text x='805' y='666' class='dg-badge' fill='#65758b'>main 当前</text><text x='419' y='745' class='dg-row' fill='#65758b'>原内容长度：20 字节</text><text x='419' y='779' class='dg-row' fill='#65758b'>登记分支时直接读取本节点</text><text x='419' y='813' class='dg-row' fill='#65758b'>只读关闭或取消不会产生 F2</text></g><circle cx='45' cy='925' r='5' fill='#16845d'/><text x='59' y='930' class='dg-legend'>本次新增节点</text><circle cx='240' cy='925' r='5' fill='#65758b'/><text x='254' y='930' class='dg-legend'>已有 / 复用节点</text><circle cx='470' cy='925' r='5' fill='#7753c6'/><text x='484' y='930' class='dg-legend'>明确选中的引用</text><circle cx='700' cy='925' r='5' fill='#326bc4'/><text x='714' y='930' class='dg-legend'>分支标签 / 默认入口</text><text x='1245' y='930' class='dg-legend' text-anchor='end'>子节点在上 · 父节点在下</text></svg>