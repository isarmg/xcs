<?xml-stylesheet type='text/css' href='diagram.css'?><svg xmlns='http://www.w3.org/2000/svg' width='1280' height='960' viewBox='0 0 1280 960' role='img' aria-labelledby='08-switch-folder-title 08-switch-folder-desc' data-scene='08-switch-folder'><title id='08-switch-folder-title'>切换子文件夹：父目录直接引用目标子树</title><desc id='08-switch-folder-desc'>资料选择发布版 S5；说明、图片、附件仍可各用不同文件分支，不做同名批量切换。 </desc><defs><marker id='08-switch-folder-arrow' markerWidth='10' markerHeight='10' refX='7' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M 0 0 L 8 4 L 0 8 Z' fill='#7b8ba2'/></marker><marker id='08-switch-folder-ref' markerWidth='10' markerHeight='10' refX='7' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M 0 0 L 8 4 L 0 8 Z' fill='#326bc4'/></marker></defs><rect width='1280' height='960' rx='22' fill='#f7f9fc'/><path d='M 36 110 H 1244' stroke='#e3e9f1' stroke-width='1'/><text x='40' y='49' class='dg-title'>切换子文件夹：父目录直接引用目标子树</text><text x='40' y='83' class='dg-subtitle'>资料选择发布版 S5；说明、图片、附件仍可各用不同文件分支，不做同名批量切换。 </text><text x='320' y='147' class='dg-lane'>父目录新增子树</text><text x='960' y='147' class='dg-lane'>目标子目录保持原样</text><path class='dg-edge' data-parent='T1' data-child='T2' data-reference='false' d='M 320 648 V 436' fill='none' stroke='#7b8ba2' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' vector-effect='non-scaling-stroke' marker-end='url(#08-switch-folder-arrow)'/><rect x='259' y='523' width='122' height='28' rx='10' fill='#f7f9fc'/><text x='320' y='542' class='dg-edge-label'>更换子目录引用</text><g class='dg-node' data-node='T2' data-x='45' data-y='205' data-width='550' data-height='224' data-head='false'><rect x='45' y='205' width='550' height='224' rx='18' fill='white' stroke='#8ecdb1' stroke-width='1.5'/><rect x='46' y='229' width='5' height='176' rx='2.5' fill='#16845d'/><text x='69' y='232' class='dg-kind'>本次新增目录子树</text><text x='69' y='270' class='dg-node-title'>T2 · 项目目录</text><rect x='499' y='215' width='80' height='23' rx='7' fill='#e8f7ef'/><text x='509' y='231' class='dg-badge' fill='#16845d'>方案甲当前</text><text x='74' y='310' class='dg-row' fill='#65758b'>报告 → 方案甲-7c2a @ F2　复用</text><rect x='65' y='323' width='510' height='29' rx='7' fill='#f2edfc'/><text x='74' y='344' class='dg-row' fill='#7753c6'>资料 / → 发布版 @ S5　指定</text><text x='74' y='378' class='dg-row' fill='#65758b'>其他目录内容保持原引用</text></g><g class='dg-node' data-node='T1' data-x='45' data-y='650' data-width='550' data-height='224' data-head='false'><rect x='45' y='650' width='550' height='224' rx='18' fill='white' stroke='#d9e2ee' stroke-width='1.5'/><rect x='46' y='674' width='5' height='176' rx='2.5' fill='#65758b'/><text x='69' y='677' class='dg-kind'>父目录子树</text><text x='69' y='715' class='dg-node-title'>T1 · 项目目录</text><rect x='523' y='660' width='56' height='23' rx='7' fill='#f2f5f9'/><text x='533' y='676' class='dg-badge' fill='#65758b'>切换前</text><text x='74' y='755' class='dg-row' fill='#65758b'>报告 → 方案甲-7c2a @ F2</text><text x='74' y='789' class='dg-row' fill='#65758b'>资料 / → main @ S1</text><text x='74' y='823' class='dg-row' fill='#65758b'>父目录引用的是旧子树</text></g><g class='dg-node' data-node='S5' data-x='685' data-y='650' data-width='550' data-height='224' data-head='false'><rect x='685' y='650' width='550' height='224' rx='18' fill='white' stroke='#d9e2ee' stroke-width='1.5'/><rect x='686' y='674' width='5' height='176' rx='2.5' fill='#65758b'/><text x='709' y='677' class='dg-kind'>早已存在的子目录子树</text><text x='709' y='715' class='dg-node-title'>S5 · 资料目录</text><rect x='1139' y='660' width='80' height='23' rx='7' fill='#f2f5f9'/><text x='1149' y='676' class='dg-badge' fill='#65758b'>发布版当前</text><text x='714' y='755' class='dg-row' fill='#65758b'>说明.txt → 审阅稿 @ H7</text><text x='714' y='789' class='dg-row' fill='#65758b'>图片.png → main @ I1</text><text x='714' y='823' class='dg-row' fill='#65758b'>附件.pdf → 客户版 @ J3</text></g><rect x='730' y='240' width='460' height='160' rx='16' fill='#edf1f7'/><text x='750' y='273' class='dg-note-title'>没有复制子目录里的文件</text><text x='750' y='308' class='dg-note-row'>S5 本身不被改写</text><text x='750' y='339' class='dg-note-row'>文件正文新增：0</text><text x='750' y='370' class='dg-note-row'>只改变父目录对资料的引用</text><circle cx='45' cy='925' r='5' fill='#16845d'/><text x='59' y='930' class='dg-legend'>本次新增节点</text><circle cx='240' cy='925' r='5' fill='#65758b'/><text x='254' y='930' class='dg-legend'>已有 / 复用节点</text><circle cx='470' cy='925' r='5' fill='#7753c6'/><text x='484' y='930' class='dg-legend'>明确选中的引用</text><circle cx='700' cy='925' r='5' fill='#326bc4'/><text x='714' y='930' class='dg-legend'>分支标签 / 默认入口</text><text x='1245' y='930' class='dg-legend' text-anchor='end'>子节点在上 · 父节点在下</text></svg>