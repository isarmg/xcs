g-row' fill='#7753c6'>标签：[已审阅]</text></g><g class='dg-node' data-node='T' data-x='55' data-y='730' data-width='520' data-height='190' data-head='false'><rect x='55' y='730' width='520' height='190' rx='18' fill='white' stroke='#8ecdb1' stroke-width='1.5'/><rect x='56' y='754' width='5' height='142' rx='2.5' fill='#16845d'/><text x='79' y='757' class='dg-kind'>正文仍引用 V1</text><text x='79' y='795' class='dg-node-title'>T · 修改当前节点标签</text><rect x='443' y='740' width='116' height='23' rx='7' fill='#e8f7ef'/><text x='453' y='756' class='dg-badge' fill='#16845d'>只新增标签子节点</text><rect x='75' y='814' width='480' height='29' rx='7' fill='#f2edfc'/><text x='84' y='835' class='dg-row' fill='#7753c6'>移除 草稿，增加 已审阅</text><rect x='75' y='848' width='480' height='29' rx='7' fill='#f2edfc'/><text x='84' y='869' class='dg-row' fill='#7753c6'>新标签：[已审阅]</text></g><g class='dg-node' data-node='H' data-x='705' data-y='730' data-width='520' data-height='190' data-head='false'><rect x='705' y='730' width='520' height='190' rx='18' fill='white' stroke='#8ecdb1' stroke-width='1.5'/><rect x='706' y='754' width='5' height='142' rx='2.5' fill='#16845d'/><text x='729' y='757' class='dg-kind'>历史旁子节点</text><text x='729' y='795' class='dg-node-title'>H · 给旧 V1 改标签</text><rect x='1105' y='740' width='104' height='23' rx='7' fill='#e8f7ef'/><text x='1115' y='756' class='dg-badge' fill='#16845d'>不回退当前引用</text><text x='734' y='835' class='dg-row' fill='#65758b'>正文仍引用 V1</text><rect x='725' y='848' width='480' height='29' rx='7' fill='#f2edfc'/><text x='734' y='869' class='dg-row' fill='#7753c6'>标签：[草稿、归档]</text></g><g class='dg-node' data-node='V1' data-x='380' data-y='1030' data-width='520' data-height='156' data-head='false'><rect x='380' y='1030' width='520' height='156' rx='18' fill='white' stroke='#d9e2ee' stroke-width='1.5'/><rect x='381' y='1054' width='5' height='108' rx='2.5' fill='#65758b'/><text x='404' y='1057' class='dg-kind'>已有正文</text><text x='404' y='1095' class='dg-node-title'>V1 · 原节点</text><rect x='771' y='1040' width='113' height='23' rx='7' fill='#f2f5f9'/><text x='781' y='1056' class='dg-badge' fill='#65758b'>标签仍为 [草稿]</text><text x='409' y='1135' class='dg-row' fill='#65758b'>原标签快照不原地修改</text></g><rect x='705' y='200' width='520' height='160' rx='16' fill='#edf1f7'/><text x='725' y='233' class='dg-note-title'>可批量选择多个分支节点</text><text x='725' y='268' class='dg-note-row'>每项单独继承旧标签，再应用相同增删。</text><text x='725' y='299' class='dg-note-row'>先验证所有目标；任何冲突整批失败。</text><text x='725' y='330' class='dg-note-row'>无标签变化不重复生成节点。</text><circle cx='45' cy='1285' r='5' fill='#16845d'/><text x='59' y='1290' class='dg-legend'>本次新增节点</text><circle cx='240' cy='1285' r='5' fill='#65758b'/><text x='254' y='1290' class='dg-legend'>已有 / 复用节点</text><circle cx='470' cy='1285' r='5' fill='#7753c6'/><text x='484' y='1290' class='dg-legend'>明确选中的引用</text><circle cx='700' cy='1285' r='5' fill='#326bc4'/><text x='714' y='1290' class='dg-legend'>分支标签 / 默认入口</text><text x='1245' y='1290' class='dg-legend' text-anchor='end'>子节点在上 · 父节点在下</text></svg>