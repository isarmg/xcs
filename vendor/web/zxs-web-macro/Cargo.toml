[package]
name = "zxs-web-macro"
version = "0.8.19"
edition = "2021"
build = "build.rs"
autotests = false
license-file = "README.md"
description = "Project CSR view and component macros"

[workspace]

[lib]
name = "zxs_web_macro"
proc-macro = true

[features]
default = ["csr"]
csr = []
__internal_erase_components = []
trace-component-props = []
trace-components = []
tracing = ["dep:tracing"]

[dependencies]
attribute-derive = { version = "0.11", features = ["syn-full"] }
cfg-if = "1"
convert_case = "0.11"
convert_case_extras = "0.2"
html-escape = "0.2"
itertools = "0.14"
leptos_hot_reload = "0.8.7"
prettyplease = "0.3"
proc-macro2 = "1"
quote = "1"
rstml = "0.13.1"
syn = { version = "3", features = ["full"] }
tracing = { version = "0.1", optional = true }

[build-dependencies]
rustc_version = "0.4"

[lints.rust]
unexpected_cfgs = { level = "allow" }
