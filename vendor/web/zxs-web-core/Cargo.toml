[package]
name = "zxs-web-core"
version = "0.8.19"
edition = "2021"
build = "build.rs"
autotests = false
license-file = "README.md"
description = "Project-specific browser CSR runtime"

[features]
default = ["csr"]
csr = ["zxs_web_macro/csr", "reactive_graph/effects"]

[dependencies]
any_spawner = { version = "0.3.0", features = ["wasm-bindgen"] }
either_of = "0.1.9"
futures = "0.3"
leptos_dom = "0.8.8"
zxs_web_macro = { package = "zxs-web-macro", path = "../zxs-web-macro", default-features = false, features = ["csr"] }
oco_ref = "0.2.1"
or_poisoned = "0.1.0"
paste = "1"
reactive_graph = { version = "0.2.14", features = ["serde"] }
rustc-hash = "2.1"
send_wrapper = "0.6"
serde = "1"
serde_json = "1"
slotmap = "1.1"
tachys = { version = "0.2.15", features = ["reactive_graph", "oco"] }
thiserror = "2"
throw_error = "0.3.1"
typed-builder = "0.23"
typed-builder-macro = "0.23"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[build-dependencies]
rustc_version = "0.4"

[lints.rust]
unexpected_cfgs = { level = "allow" }
