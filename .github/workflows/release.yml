name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # Build-only rehearsal. Never creates or publishes a Release.

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ runner.temp }}/zxs-cargo-home
  RUST_BACKTRACE: '1'

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo test --locked --offline -p release-tools
      - id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: cargo run --locked --offline -p release-tools -- "$TAG"

  verify:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
      - name: Run all portable test suites and contract checks
        run: |
          for suite in rust-sources quality security workspace foundation web contracts build-tools smb-protocol; do
            bash .github/scripts/check.sh "$suite"
          done

  linux-web:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
      - run: bash .github/scripts/check.sh web-production
      - name: Exercise production Web against the real server
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          export CHROMEDRIVER="$(command -v chromedriver)"
          bash .github/scripts/check.sh browser-smoke
      - name: Build Linux server and CLI
        run: |
          python3 .github/scripts/check-rust-diagnostics.py -- \
            cargo build --locked --offline --release --package storage-admin --message-format=json
          target/native/release/zxs --help
          bash .github/scripts/release-package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-web
          path: release-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web-dist
          path: build/web/
          if-no-files-found: error

  assemble:
    needs: [version, verify, linux-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-web
          path: release-assets
      - name: Verify complete asset set and create checksums
        run: bash .github/scripts/release-assemble.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-complete
          path: release-assets/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-complete
          path: release-assets
      - name: Upload all assets to a draft, then publish once
        run: bash .github/scripts/release-publish.sh
