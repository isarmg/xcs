name: Pinned Samba SDK validation

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  smb-sdk:
    name: Samba 4.23.0 real SDK ABI and FFI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize isolated Cargo home
        run: bash .github/scripts/initialize-cargo-home.sh
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Install official Ubuntu SDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config python3 perl libparse-yapp-perl flex bison m4 \
            clang libclang-dev libgnutls28-dev libkrb5-dev zlib1g-dev libpopt-dev
      - name: Cache pinned configured Samba source and real libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/smb-sdk
          key: samba-4.23.0-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ hashFiles('.github/scripts/smb-sdk.sh') }}
      - name: Build official SDK and validate the Rust VFS
        run: bash .github/scripts/smb-sdk.sh
