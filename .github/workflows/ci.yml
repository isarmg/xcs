name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'

jobs:
  tests:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [workspace, apps, web, contracts, build-tools, demo, smb-protocol]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.suite }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.suite }}-
      - name: Run locked test suite
        run: bash .github/scripts/check.sh "${{ matrix.suite }}"

  web-production:
    name: Production WASM build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain and WASM target
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
          rustc --version
      - name: Cache Cargo dependencies and exact wasm-bindgen CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target/ci-tools
          key: cargo-${{ runner.os }}-${{ runner.arch }}-web-build-bindgen-0.2.129-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-web-build-bindgen-0.2.129-
      - name: Build production Web distribution
        run: bash .github/scripts/check.sh web-production
      - name: Retain production assets for checks in this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

  desktop-host:
    name: Desktop host (${{ matrix.os }})
    needs: web-production
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-host-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-host-
      - name: Fetch production Web assets from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Install official Ubuntu Tauri development dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Test portable bridge on this platform
        run: bash .github/scripts/check.sh apps
      - name: Check native host against production Web assets
        run: bash .github/scripts/check.sh desktop-host

  browser-smoke:
    name: Browser smoke (Chrome)
    needs: web-production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-browser-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-browser-
      - name: Fetch production Web assets from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Verify runner Chrome and ChromeDriver
        run: |
          chrome="$(command -v google-chrome)"
          driver="$(command -v chromedriver)"
          "$chrome" --version
          "$driver" --version
          chrome_major=$("$chrome" --version | grep -oE '[0-9]+' | head -1)
          driver_major=$("$driver" --version | grep -oE '[0-9]+' | head -1)
          test "$chrome_major" = "$driver_major"
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=$driver" >> "$GITHUB_ENV"
      - name: Install CJK fonts for the Chinese screenshot
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Run browser smoke against the real server and WASM app
        env:
          ZXS_SMOKE_SCREENSHOT: artifacts/web-file-manager.png
          ZXS_DEMO_CAPTURE: artifacts/demo-capture
        run: bash .github/scripts/check.sh browser-smoke
      - name: Retain real Web file manager screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-screenshot
          path: artifacts/web-file-manager.png
          if-no-files-found: error
          retention-days: 7

      - name: Retain verified real Web demonstration frames
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zxs-demo-capture
          path: artifacts/demo-capture/
          if-no-files-found: warn
          retention-days: 7
