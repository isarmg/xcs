# Selected as the scanner working directory's .cargo/audit.toml, replacing
# (not merging) any caller/project or CARGO_HOME audit policy.
[advisories]
ignore = []
informational_warnings = ["unmaintained", "unsound", "notice"]
# No severity_threshold: every advisory severity must be checked.

[database]
url = "https://github.com/RustSec/advisory-db"
fetch = true
stale = false

[yanked]
enabled = true
update_index = true
