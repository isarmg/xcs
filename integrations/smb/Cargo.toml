[package]
name = "zxs-smb"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "ZXS local Samba bridge protocol and file descriptor transport"

[workspace]
members = ["vfs"]
resolver = "2"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zxs-contract = { path = "../../crates/zxs-contract" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
