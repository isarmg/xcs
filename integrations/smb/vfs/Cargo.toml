[package]
name = "zxs-smb-vfs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["smb-sdk"]
smb-sdk = ["dep:bindgen"]

[dependencies]
blake3 = "1.8.7"
libc = "0.2"
serde_json = "1"
zxs-smb = { path = ".." }

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
serde_json = "1"
